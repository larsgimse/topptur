<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Busstest Tromsø - Nasjonalt API</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #fff; }
        #map { width: 100vw; height: 100vh; }
        
        #status-box {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 1000;
            background: rgba(24, 24, 27, 0.92);
            backdrop-filter: blur(8px);
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 13px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            min-width: 220px;
        }

        .status-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-weight: 600;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #eab308;
            display: inline-block;
        }

        .status-dot.ok { background-color: #22c55e; }
        .status-dot.error { background-color: #ef4444; }

        #buss-count {
            margin-top: 6px;
            font-size: 12px;
            color: #a1a1aa;
        }

        .bus-marker {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ef4444;
            color: #ffffff;
            font-weight: 700;
            font-size: 11px;
            border: 2px solid #ffffff;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
        }

        .leaflet-popup-content-wrapper {
            background: #18181b;
            color: #f4f4f5;
            border-radius: 8px;
            border: 1px solid #3f3f46;
        }
        .leaflet-popup-tip { background: #18181b; }
    </style>
</head>
<body>

    <div id="status-box">
        <div class="status-header">
            <span>Buss Tromsø</span>
            <span id="status-dot" class="status-dot"></span>
        </div>
        <div id="buss-count">Henter sanntidsdata...</div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const CONFIG = {
            // Enturs nasjonale GraphQL API
            API_URL: 'https://api.entur.io/journey-planner/v3/graphql',
            CLIENT_NAME: 'gimse-busstest',
            POLL_INTERVAL_MS: 10000,
            CENTER: [69.6492, 18.9553], // Tromsø
            ZOOM: 12,
            // Geografisk Bounding Box for Tromsø
            BBOX: { minLat: 69.5, maxLat: 69.8, minLon: 18.8, maxLon: 19.3 }
        };

        const map = L.map('map').setView(CONFIG.CENTER, CONFIG.ZOOM);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a> &copy; <a href="https://entur.no">Entur Nasjonalt API</a>',
            maxZoom: 19
        }).addTo(map);

        const busLayerGroup = L.layerGroup().addTo(map);
        const activeMarkers = new Map();

        function createBusIcon(line) {
            return L.divIcon({
                className: 'bus-marker-wrapper',
                html: `<div class="bus-marker" style="width: 32px; height: 22px;">L${line}</div>`,
                iconSize: [32, 22],
                iconAnchor: [16, 11]
            });
        }

        async function hentBussdata() {
            const statusDot = document.getElementById('status-dot');
            const countEl = document.getElementById('buss-count');

            // GraphQL-spørring mot det nasjonale registeret
            const graphqlQuery = {
                query: `
                query {
                  vehicles {
                    id
                    location {
                      latitude
                      longitude
                    }
                    line {
                      publicCode
                    }
                    destinationName
                  }
                }`
            };

            try {
                const response = await fetch(CONFIG.API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'ET-Client-Name': CONFIG.CLIENT_NAME
                    },
                    body: JSON.stringify(graphqlQuery)
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const result = await response.json();
                
                if (result.errors) {
                    throw new Error(result.errors[0]?.message || 'GraphQL-feil');
                }

                const vehicles = result?.data?.vehicles || [];
                const seenVehicleIds = new Set();
                let tromsoCount = 0;

                vehicles.forEach((buss, index) => {
                    if (!buss.location) return;

                    const lat = buss.location.latitude;
                    const lon = buss.location.longitude;

                    // Filtrer utelukkende på Tromsø-området via GPS
                    if (lat < CONFIG.BBOX.minLat || lat > CONFIG.BBOX.maxLat || 
                        lon < CONFIG.BBOX.minLon || lon > CONFIG.BBOX.maxLon) {
                        return;
                    }

                    const vehicleId = buss.id || `buss_${index}`;
                    const line = buss.line?.publicCode || '?';
                    const destination = buss.destinationName || 'Ukjent destinasjon';

                    seenVehicleIds.add(vehicleId);
                    tromsoCount++;

                    const popupContent = `
                        <div style="font-size: 13px;">
                            <strong style="color: #ef4444;">Linje ${line}</strong><br>
                            <strong>Destinasjon:</strong> ${destination}
                        </div>
                    `;

                    // Oppdater posisjon dersom markøren allerede finnes
                    if (activeMarkers.has(vehicleId)) {
                        const marker = activeMarkers.get(vehicleId);
                        marker.setLatLng([lat, lon]);
                        marker.setPopupContent(popupContent);
                    } else {
                        const marker = L.marker([lat, lon], {
                            icon: createBusIcon(line),
                            title: `Linje ${line} - ${destination}`
                        }).bindPopup(popupContent);

                        marker.addTo(busLayerGroup);
                        activeMarkers.set(vehicleId, marker);
                    }
                });

                // Fjern markører som ikke lenger er i drift
                for (const [vId, marker] of activeMarkers.entries()) {
                    if (!seenVehicleIds.has(vId)) {
                        busLayerGroup.removeLayer(marker);
                        activeMarkers.delete(vId);
                    }
                }

                statusDot.className = 'status-dot ok';
                countEl.innerText = `Viser ${tromsoCount} busser (${new Date().toLocaleTimeString('no-NO')})`;

            } catch (err) {
                console.error('Feil ved henting:', err);
                statusDot.className = 'status-dot error';
                countEl.innerText = `Feil: ${err.message}`;
            }
        }

        hentBussdata();
        setInterval(hentBussdata, CONFIG.POLL_INTERVAL_MS);
    </script>
</body>
</html>
