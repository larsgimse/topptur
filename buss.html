<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Busstest Tromsø - Best Practice</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #fff; }
        #map { width: 100vw; height: 100vh; }
        
        /* Statuspanel øverst til høyre */
        #status-box {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 1000;
            background: rgba(24, 24, 27, 0.9);
            backdrop-filter: blur(8px);
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 13px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            min-width: 200px;
        }

        .status-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-weight: 600;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #eab308; /* Venter/Gul */
            display: inline-block;
        }

        .status-dot.ok { background-color: #22c55e; }
        .status-dot.error { background-color: #ef4444; }

        #buss-count {
            margin-top: 6px;
            font-size: 12px;
            color: #a1a1aa;
        }

        /* Styling for buss-markører */
        .bus-marker {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ef4444;
            color: #ffffff;
            font-weight: 700;
            font-size: 11px;
            border: 2px solid #ffffff;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease;
        }

        .leaflet-popup-content-wrapper {
            background: #18181b;
            color: #f4f4f5;
            border-radius: 8px;
            border: 1px solid #3f3f46;
        }
        
        .leaflet-popup-tip { background: #18181b; }
    </style>
</head>
<body>

    <div id="status-box">
        <div class="status-header">
            <span>Buss Tromsø</span>
            <span id="status-dot" class="status-dot"></span>
        </div>
        <div id="buss-count">Henter sanntidsdata...</div>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Configuration Constants
        const CONFIG = {
            ENTUR_URL: 'https://api.entur.io/realtime/v1/rest/vm',
            CLIENT_NAME: 'gimse-busstest',
            POLL_INTERVAL_MS: 10000,
            DEFAULT_CENTER: [69.6492, 18.9553], // Tromsø
            DEFAULT_ZOOM: 12,
            // Geografisk Bounding Box for Tromsø
            BBOX: { minLat: 69.4, maxLat: 69.8, minLon: 18.3, maxLon: 19.3 }
        };

        // Kart-initialisering
        const map = L.map('map', {
            zoomControl: true
        }).setView(CONFIG.DEFAULT_CENTER, CONFIG.DEFAULT_ZOOM);

        // Mørk bakgrunn med korrekt attribution (NLOD / CC BY 4.0)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a> &copy; <a href="https://entur.no">Entur</a>',
            maxZoom: 19
        }).addTo(map);

        const busLayerGroup = L.layerGroup().addTo(map);
        
        // Map for gjenbruk av eksisterende markører (KjøretøyID -> Leaflet Marker)
        const activeMarkers = new Map();
        let currentAbortController = null;

        // Opprett tilpasset DivIcon for buss
        function createBusIcon(line) {
            return L.divIcon({
                className: 'bus-marker-wrapper',
                html: `<div class="bus-marker" style="width: 30px; height: 22px;">L${line}</div>`,
                iconSize: [30, 22],
                iconAnchor: [15, 11]
            });
        }

        // Hovedfunksjon for henting og oppdatering av data
        async function fetchVehiclePositions() {
            const statusDot = document.getElementById('status-dot');
            const countEl = document.getElementById('buss-count');

            // Avbryt forrige uavsluttede kall hvis det finnes
            if (currentAbortController) {
                currentAbortController.abort();
            }
            currentAbortController = new AbortController();

            try {
                const response = await fetch(CONFIG.ENTUR_URL, {
                    method: 'GET',
                    headers: {
                        'ET-Client-Name': CONFIG.CLIENT_NAME
                    },
                    signal: currentAbortController.signal
                });

                if (!response.ok) {
                    throw new Error(`HTTP-feil: ${response.status}`);
                }

                const data = await response.json();
                const activities = data?.Siri?.ServiceDelivery?.VehicleMonitoringDelivery?.[0]?.VehicleActivity || [];

                const seenVehicleIds = new Set();
                let tromsoCount = 0;

                activities.forEach((activity, index) => {
                    const journey = activity.MonitoredVehicleJourney;
                    if (!journey || !journey.VehicleLocation) return;

                    const lat = parseFloat(journey.VehicleLocation.Latitude);
                    const lon = parseFloat(journey.VehicleLocation.Longitude);

                    if (isNaN(lat) || isNaN(lon)) return;

                    // Geografisk filtrering
                    if (lat < CONFIG.BBOX.minLat || lat > CONFIG.BBOX.maxLat || 
                        lon < CONFIG.BBOX.minLon || lon > CONFIG.BBOX.maxLon) {
                        return;
                    }

                    // Entydig nøkkel per kjøretøy/reise
                    const vehicleId = journey.VehicleRef || 
                                      journey.FramedVehicleJourneyRef?.DatedVehicleJourneyRef || 
                                      `v_${journey.LineRef}_${index}`;

                    const line = journey.PublishedLineName?.[0]?.value || journey.LineRef || '?';
                    const destination = journey.DestinationName?.[0]?.value || 'Ukjent destinasjon';

                    seenVehicleIds.add(vehicleId);
                    tromsoCount++;

                    const popupContent = `
                        <div style="font-size: 13px;">
                            <strong style="color: #ef4444;">Linje ${line}</strong><br>
                            <strong>Destinasjon:</strong> ${destination}
                        </div>
                    `;

                    // Hvis markøren finnes fra før: Flytt den glatt til ny posisjon
                    if (activeMarkers.has(vehicleId)) {
                        const existingMarker = activeMarkers.get(vehicleId);
                        existingMarker.setLatLng([lat, lon]);
                        existingMarker.setPopupContent(popupContent);
                    } else {
                        // Ny markør opprettes
                        const newMarker = L.marker([lat, lon], {
                            icon: createBusIcon(line),
                            title: `Linje ${line} - ${destination}`
                        }).bindPopup(popupContent);

                        newMarker.addTo(busLayerGroup);
                        activeMarkers.set(vehicleId, newMarker);
                    }
                });

                // Opprydding: Fjern markører for busser som har gått ut av rute eller avgrensing
                for (const [vId, marker] of activeMarkers.entries()) {
                    if (!seenVehicleIds.has(vId)) {
                        busLayerGroup.removeLayer(marker);
                        activeMarkers.delete(vId);
                    }
                }

                // Oppdater UI
                statusDot.className = 'status-dot ok';
                countEl.innerText = `Viser ${tromsoCount} busser (${new Date().toLocaleTimeString('no-NO')})`;

            } catch (err) {
                if (err.name === 'AbortError') return; // Ignorer avbrutte kall

                console.error('Feil ved henting av bussdata:', err);
                statusDot.className = 'status-dot error';
                countEl.innerText = 'Feil ved oppdatering';
            }
        }

        // Start henting og sett opp fast periodisk oppdatering
        fetchVehiclePositions();
        const intervalId = setInterval(fetchVehiclePositions, CONFIG.POLL_INTERVAL_MS);

        // Rydd opp timer dersom vinduet lukkes
        window.addEventListener('beforeunload', () => {
            clearInterval(intervalId);
        });
    </script>
</body>
</html>
