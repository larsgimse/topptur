<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sanntidsbusser Tromsø</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      height: 100%;
      width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #map {
      height: 100vh;
      width: 100vw;
    }
    #info-panel {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      padding: 12px 16px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      max-width: 300px;
    }
    #info-panel h1 {
      font-size: 16px;
      margin-bottom: 4px;
      color: #1a1a1a;
    }
    #info-panel p {
      font-size: 13px;
      color: #555;
    }
    /* Buss-ikon stil */
    .bus-icon {
      background: #e2001a;
      color: white;
      border: 2px solid white;
      border-radius: 50%;
      font-weight: bold;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>

  <div id="info-panel">
    <h1>Buss i Sanntid – Tromsø</h1>
    <p id="status">Laster inn sanntidsdata...</p>
  </div>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Initialiser kartet over Tromsø
    const map = L.map('map').setView([69.6492, 18.9553], 13);

    // Legg til kartfliser fra OpenStreetMap
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap | Data fra Entur (SIRI-VM)'
    }).addTo(map);

    const busMarkers = {};

    // Entur SIRI-VM JSON-endepunkt (Henter kjøretøydata i hele Norge)
    const SIRI_VM_URL = 'https://api.entur.io/realtime/v1/rest/vm';

    // Bounding Box for Tromsø (Lat: 69.50 - 69.75, Lon: 18.70 - 19.20)
    function erITromso(lat, lon) {
      return lat >= 69.50 && lat <= 69.75 && lon >= 18.70 && lon <= 19.20;
    }

    async function fetchBusses() {
      try {
        const response = await fetch(SIRI_VM_URL, {
          headers: {
            'ET-Client-Name': 'tromso-sanntid-test'
          }
        });

        if (!response.ok) {
          throw new Error(`HTTP feil! Status: ${response.status}`);
        }

        const data = await response.json();
        
        // Hent ut alle kjøretøy-aktiviteter fra SIRI-S-responsen
        const delivery = data?.Siri?.ServiceDelivery?.VehicleMonitoringDelivery?.[0];
        const activities = delivery?.VehicleActivity || [];

        const tromsoBusses = [];

        activities.forEach(activity => {
          const location = activity?.MonitoredVehicleJourney?.VehicleLocation;
          if (!location) return;

          const lat = parseFloat(location.Latitude);
          const lon = parseFloat(location.Longitude);

          // Filtrer slik at vi kun tar med busser innenfor Tromsø-området
          if (erITromso(lat, lon)) {
            const journey = activity.MonitoredVehicleJourney;
            const lineRef = journey?.PublishedLineName || journey?.LineRef?.value || 'Buss';
            const vehicleRef = journey?.VehicleRef?.value || `${lat}-${lon}`;
            const destination = journey?.DestinationName || 'Ukjent destinasjon';

            tromsoBusses.push({
              id: vehicleRef,
              lat: lat,
              lon: lon,
              line: lineRef,
              destination: destination
            });
          }
        });

        oppdaterKart(tromsoBusses);

        document.getElementById('status').innerText = 
          `Sist oppdatert: ${new Date().toLocaleTimeString()} (${tromsoBusses.length} busser på veien i Tromsø)`;

      } catch (err) {
        console.error('Feil ved henting av bussdata:', err);
        document.getElementById('status').innerText = 'Feil ved henting av data fra Entur.';
      }
    }

    function oppdaterKart(busses) {
      const activeIds = new Set();

      busses.forEach(bus => {
        activeIds.add(bus.id);

        const popupContent = `
          <strong>Linje ${bus.line}</strong><br>
          <em>Retning:</em> ${bus.destination}
        `;

        if (busMarkers[bus.id]) {
          // Flytt eksisterende buss
          busMarkers[bus.id].setLatLng([bus.lat, bus.lon]);
          busMarkers[bus.id].getPopup().setContent(popupContent);
        } else {
          // Lag nytt buss-ikon
          const customIcon = L.divIcon({
            className: 'bus-icon',
            html: `<span>${bus.line}</span>`,
            iconSize: [28, 28],
            iconAnchor: [14, 14]
          });

          const marker = L.marker([bus.lat, bus.lon], { icon: customIcon })
            .bindPopup(popupContent)
            .addTo(map);

          busMarkers[bus.id] = marker;
        }
      });

      // Fjern busser som har kjørt ut av området eller er skrudd av
      Object.keys(busMarkers).forEach(id => {
        if (!activeIds.has(id)) {
          map.removeLayer(busMarkers[id]);
          delete busMarkers[id];
        }
      });
    }

    // Første henting ved oppstart
    fetchBusses();

    // Automatisk oppdatering hvert 6. sekund
    setInterval(fetchBusses, 6000);
  </script>
</body>
</html>
