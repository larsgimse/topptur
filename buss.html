<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sanntidsbusser Tromsø</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      height: 100%;
      width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #map {
      height: 100vh;
      width: 100vw;
    }
    #info-panel {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      padding: 12px 16px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      max-width: 280px;
    }
    #info-panel h1 {
      font-size: 16px;
      margin-bottom: 4px;
      color: #1a1a1a;
    }
    #info-panel p {
      font-size: 13px;
      color: #555;
    }
    /* Custom bus marker style */
    .bus-icon {
      background: #e2001a;
      color: white;
      border: 2px solid white;
      border-radius: 50%;
      font-weight: bold;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.4);
      transition: transform 0.3s ease;
    }
  </style>
</head>
<body>

  <div id="info-panel">
    <h1>Buss i Sanntid – Tromsø</h1>
    <p id="status">Laster bussdata...</p>
  </div>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // 1. Initialiser kartet over Tromsø
    const map = L.map('map').setView([69.6492, 18.9553], 13);

    // Legg til OpenStreetMap kartfliser
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> bidragsytere | Data fra <a href="https://entur.no">Entur</a>'
    }).addTo(map);

    // Objekt for å holde på aktive buss-markører
    const busMarkers = {};

    // Entur GraphQL API URL for kjørøyposisjoner
    const ENTUR_API_URL = 'https://api.entur.io/realtime/v2/vehicles/graphql';

    // Bounding Box for Tromsø og omegn
    const TROMSO_BOUNDS = {
      minLat: 69.50,
      maxLat: 69.75,
      minLon: 18.70,
      maxLon: 19.20
    };

    // GraphQL spørring for å hente kjennetegn, posisjon og linjenummer
    const query = `
      query GetTromsoBusses($bounds: BoundingBoxInput) {
        vehicles(boundingBox: $bounds) {
          vehicleId
          lastUpdated
          bearing
          delay
          line {
            publicCode
            lineName
          }
          location {
            latitude
            longitude
          }
        }
      }
    `;

    async function fetchBusses() {
      try {
        const response = await fetch(ENTUR_API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'ET-Client-Name': 'tromso-sanntid-testapp' // Identifikator påkrevd av Entur
          },
          body: JSON.stringify({
            query: query,
            variables: { bounds: TROMSO_BOUNDS }
          })
        });

        if (!response.ok) {
          throw new Error(`HTTP feil: ${response.status}`);
        }

        const json = await response.json();
        const vehicles = json.data?.vehicles || [];

        oppdaterKart(vehicles);

        document.getElementById('status').innerText = 
          `Sist oppdatert: ${new Date().toLocaleTimeString()} (${vehicles.length} busser i kartet)`;

      } catch (err) {
        console.error('Feil ved henting av bussdata:', err);
        document.getElementById('status').innerText = 'Kunne ikke hente bussdata.';
      }
    }

    function oppdaterKart(vehicles) {
      const activeIds = new Set();

      vehicles.forEach(bus => {
        if (!bus.location || !bus.location.latitude || !bus.location.longitude) return;

        const id = bus.vehicleId || `${bus.line?.publicCode}-${bus.location.latitude}`;
        activeIds.add(id);

        const lat = bus.location.latitude;
        const lon = bus.location.longitude;
        const lineCode = bus.line?.publicCode || 'Buss';
        const lineName = bus.line?.lineName || 'Ukjent rute';
        const delayMin = bus.delay ? Math.round(bus.delay / 60) : 0;
        const delayText = delayMin > 0 ? ` (+${delayMin} min forsinket)` : (delayMin < 0 ? ` (${Math.abs(delayMin)} min foran)` : '');

        const popupContent = `
          <strong>Linje ${lineCode}</strong><br>
          ${lineName}<br>
          <em>Forsinkelse:</em> ${delayText || 'I rute'}
        `;

        // Hvis busse-markøren allerede finnes, flytt den
        if (busMarkers[id]) {
          busMarkers[id].setLatLng([lat, lon]);
          busMarkers[id].getPopup().setContent(popupContent);
        } else {
          // Lag ny markør med linjenummer i sirkelen
          const customIcon = L.divIcon({
            className: 'bus-icon',
            html: `<span>${lineCode}</span>`,
            iconSize: [28, 28],
            iconAnchor: [14, 14]
          });

          const marker = L.marker([lat, lon], { icon: customIcon })
            .bindPopup(popupContent)
            .addTo(map);

          busMarkers[id] = marker;
        }
      });

      // Fjern busser som ikke lenger er aktive
      Object.keys(busMarkers).forEach(id => {
        if (!activeIds.has(id)) {
          map.removeLayer(busMarkers[id]);
          delete busMarkers[id];
        }
      });
    }

    // Hent data med én gang ved oppstart
    fetchBusses();

    // Oppdater automatisk hvert 5. sekund
    setInterval(fetchBusses, 5000);
  </script>
</body>
</html>
