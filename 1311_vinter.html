        document.getElementById('mapSelect').onchange = (e) => {
            if (kartModus !== 'topp') return;
            if (e.target.value === "osm") { map.addLayer(osmLayer); map.removeLayer(norgeLayer); }
            else { map.addLayer(norgeLayer); map.removeLayer(osmLayer); }
        };

        function lagBadge(fil, override) {
            if (!fil && !override) return null;
            const s = document.createElement('span');
            const aar = override || fil.split('_')[0];
            if (aar === "2026") { s.className = 'badge-label badge-2026'; s.innerText = aar; }
            else { s.className = 'badge-label badge-year'; s.innerText = aar; }
            return s;
        }

        function lastNedGPX(filsti, filnavn) {
            const link = document.createElement('a');
            link.href = filsti;
            link.download = filnavn.endsWith('.gpx') ? filnavn : filnavn + ".gpx";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function parseDatoFraFil(gpxFil) {
            const match = (gpxFil || '').match(/(\d{4})_(\d{2})_(\d{2})/);
            return match ? `${match[3]}.${match[2]}.${match[1]}` : '';
        }


        // Skarp høydeprofil: tegnes i enhetens fulle oppløsning (devicePixelRatio) med tynn svart strek
        function tegnHoydeprofil(canvas, stats, minH, maxH, bredde, hoyde) {
            const dpr = Math.max(window.devicePixelRatio || 1, 2);
            canvas.width = Math.round(bredde * dpr);
            canvas.height = Math.round(hoyde * dpr);
            canvas.style.width = bredde + 'px';
            canvas.style.height = hoyde + 'px';
            canvas.style.display = 'block';
            const ctx = canvas.getContext('2d');
            ctx.scale(dpr, dpr);
            const pad = 5;
            const bunn = hoyde - pad;
            const maxDist = stats[stats.length - 1][0] || 1;
            const rangeH = (maxH - minH) || 1;
            const xAv = d => pad + (d / maxDist) * (bredde - pad * 2);
            const yAv = e => bunn - ((e - minH) / rangeH) * (hoyde - pad * 2);

            // Fyll under profilen
            ctx.beginPath();
            ctx.moveTo(pad, bunn);
            stats.forEach(([d, e]) => ctx.lineTo(xAv(d), yAv(e)));
            ctx.lineTo(bredde - pad, bunn);
            ctx.closePath();
            ctx.fillStyle = 'rgba(0, 0, 0, 0.07)';
            ctx.fill();

            // Tynn svart bunnlinje
            ctx.beginPath();
            ctx.moveTo(pad, bunn + 0.5);
            ctx.lineTo(bredde - pad, bunn + 0.5);
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1;
            ctx.stroke();

            // Tynn svart profillinje
            ctx.beginPath();
            stats.forEach(([d, e], i) => { if (i === 0) ctx.moveTo(xAv(d), yAv(e)); else ctx.lineTo(xAv(d), yAv(e)); });
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1;
            ctx.lineJoin = 'round';
            ctx.stroke();
        }

        function visProfil(gpxLayer, tittel, gpxFil) {
            const d = gpxLayer.get_distance();
            const e = gpxLayer.get_elevation_gain();
            const h = gpxLayer.get_elevation_max();
            const minH = gpxLayer.get_elevation_min();
            const stats = gpxLayer.get_elevation_data();
            const dato = parseDatoFraFil(gpxFil);

            let tidTR = "N/A";
            let tidTilTopp = "N/A";
            const startTid = gpxLayer.get_start_time();
            const sluttTid = gpxLayer.get_end_time();

            if (startTid && sluttTid) {
                const diffMs = sluttTid - startTid;
                const hTR = Math.floor(diffMs / 3600000);
                const mTR = Math.floor((diffMs % 3600000) / 60000);
                tidTR = `${hTR}t ${mTR}min`;

                const punkter = gpxLayer.getLayers()[0].getLatLngs();
                let toppPunktTid = null;
                for (let p of punkter) {
                    if (p.meta && p.meta.ele >= h - 0.5) {
                        toppPunktTid = p.meta.time;
                        break;
                    }
                }
                if (toppPunktTid) {
                    const diffToppMs = toppPunktTid - startTid;
                    const hTopp = Math.floor(diffToppMs / 3600000);
                    const mTopp = Math.floor((diffToppMs % 3600000) / 60000);
                    tidTilTopp = `${hTopp}t ${mTopp}min`;
                }
            }

            const popupContent = document.createElement('div');
            popupContent.style.minWidth = "220px";
            popupContent.innerHTML = `
                <div class="prof-title">${tittel}</div>
                ${dato ? `<div class="prof-date">${dato}</div>` : ''}
                <canvas id="elevationChart" width="220" height="100" style="margin-top:8px;"></canvas>
                <div style="font-size:12px; margin-top:8px; line-height:1.4; text-align:left;">
                    📏 Distanse T/R: ${(d/1000).toFixed(1)} km<br>
                    📈 Stigning: ${e.toFixed(0)} m<br>
                    🏔️ Topp: ${h.toFixed(0)} moh<br>
                    ⏱️ Tid til topp: ${tidTilTopp}<br>
                    ⌛ Tid T/R: ${tidTR}
                </div>
            `;

            tegnHoydeprofil(popupContent.querySelector('canvas'), stats, minH, h, 220, 100);
            gpxLayer.bindPopup(popupContent).openPopup();
        }

        function skapKontrollRad(label, badgeFil, startOn, onSporToggle, onProfilToggle) {
            const container = document.createElement('div');
            container.className = 'control-row-container';
            const labelEl = document.createElement('div');
            labelEl.className = 'control-label';
            labelEl.innerText = label;
            if (badgeFil) { const bdg = lagBadge(badgeFil); if (bdg) labelEl.appendChild(bdg); }
            container.appendChild(labelEl);

            const sporGroup = document.createElement('div');
            sporGroup.className = 'toggle-group' + (startOn ? ' active' : '');
            sporGroup.innerHTML = `<span class="toggle-text">Spor</span><div class="switch-track"><div class="switch-thumb"></div></div>`;
            sporGroup.onclick = () => { onSporToggle(sporGroup.classList.toggle('active')); };
            container.appendChild(sporGroup);

            const profilGroup = document.createElement('div');
            profilGroup.className = 'toggle-group';
            profilGroup.innerHTML = `<span class="toggle-text">Profil</span><div class="switch-track"><div class="switch-thumb"></div></div>`;
            profilGroup.onclick = () => { onProfilToggle(profilGroup.classList.toggle('active')); };
            container.appendChild(profilGroup);

            return container;
        }

        // ---- Hover i bokstavmenyen: vis toppen midlertidig, og gå tilbake når musen forlater den ----
        let hoverId = null;
        let hoverStartView = null;
        let hoverBackTimer = null;

        function startHover(topp) {
            if (isTouchDevice || aktivToppNavn || isReseting) return;
            const l = gpxLagMap[topp.id];
            if (!l) return;
            clearTimeout(hoverBackTimer);
            if (hoverId && hoverId !== topp.id && gpxLagMap[hoverId]) {
                gpxLagMap[hoverId].setStyle(OVERSIKT_SPOR);
            }
            if (!hoverStartView) hoverStartView = { center: map.getCenter(), zoom: map.getZoom() };
            hoverId = topp.id;
            l.setStyle(OVERSIKT_HOVER).bringToFront();
            map.flyToBounds(l.getBounds(), { padding: [60, 60], duration: 0.4 });
            // Sørg for at sporet står i hover-fargen når kartet har flyttet seg ferdig
            map.once('moveend', () => {
                if (hoverId === topp.id) l.setStyle(OVERSIKT_HOVER).bringToFront();
            });
        }

        function planleggSluttHover() {
            clearTimeout(hoverBackTimer);
            hoverBackTimer = setTimeout(avsluttHover, 150);
        }

        function avsluttHover() {
            clearTimeout(hoverBackTimer);
            if (!hoverId && !hoverStartView) return;
            if (!aktivToppNavn && !isReseting) {
                if (hoverId && gpxLagMap[hoverId]) {
                    gpxLagMap[hoverId].setStyle(OVERSIKT_SPOR);
                }
                if (hoverStartView) map.flyTo(hoverStartView.center, hoverStartView.zoom, { duration: 0.4 });
            }
            hoverId = null;
            hoverStartView = null;
        }

        function avbrytHover() {
            clearTimeout(hoverBackTimer);
            hoverId = null;
            hoverStartView = null;
        }

        // ---- Bokstavknapper med nedtrekksmeny ----
        function hentStorBokstavMapping(navn) {
            const deler = navn.split(/\s*[-–—/]\s*/);
            const mapping = [];

            deler.forEach(del => {
                const ordListe = del.trim().split(/\s+/);
                for (let ord of ordListe) {
                    const ren = ord.replace(/^[^a-zæøåA-ZÆØÅ0-9]+/, '');
                    if (ren.length > 0 && /[A-ZÆØÅ0-9]/.test(ren[0])) {
                        const bokstav = /[0-9]/.test(ren[0]) ? '#' : ren[0].toUpperCase();
                        mapping.push({ bokstav: bokstav, ord: ord });
                        break;
                    }
                }
            });

            return mapping;
        }

        function formaterNavnMedFarge(navn, malord) {
            if (!malord) return navn;
            return navn.split(/(\s+|[-–—/])/).map(del =>
                del === malord ? `<span class="highlight-word">${del}</span>` : del
            ).join('');
        }

        function lukkAlleDropdowns() {
            document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('show'));
            document.querySelectorAll('.letter-btn').forEach(b => b.classList.remove('active'));
            avsluttHover();
        }

        function plasserMeny(menu, btn) {
            menu.style.marginLeft = '0px';
            menu.style.top = '';
            if (window.matchMedia('(max-width: 768px)').matches) {
                menu.style.top = (btn.getBoundingClientRect().bottom + 6) + 'px';
            } else {
                const r = menu.getBoundingClientRect();
                let skift = 0;
                if (r.left < 8) skift = 8 - r.left;
                else if (r.right > window.innerWidth - 8) skift = window.innerWidth - 8 - r.right;
                menu.style.marginLeft = skift + 'px';
            }
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.letter-dropdown')) lukkAlleDropdowns();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') lukkAlleDropdowns();
        });

        // Finn nyeste tur ut fra datoen i GPX-filnavnet, også eventuelle ekstraspor.
        // Det er bare én topp som får den røde prikken; ingen manuell oppdatering nødvendig.
        function gpxDatoTall(fil) {
            const m = String(fil || '').match(/(\d{4})_(\d{2})_(\d{2})(?=\D|$)/);
            if (!m) return 0;
            const dato = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
            if (dato.getUTCFullYear() !== +m[1] || dato.getUTCMonth() !== +m[2] - 1 || dato.getUTCDate() !== +m[3]) return 0;
            return +m[1] * 10000 + +m[2] * 100 + +m[3];
        }

        function nyesteGpxToppId(liste) {
            let nyesteDato = 0;
            let nyesteId = null;
            liste.forEach(topp => {
                const spor = [topp.fil, ...(Array.isArray(topp.ekstraSpor) ? topp.ekstraSpor.map(s => s.fil) : [])];
                const dato = Math.max(0, ...spor.map(gpxDatoTall));
                if (dato > nyesteDato) {
                    nyesteDato = dato;
                    nyesteId = topp.id;
                }
            });
            return nyesteId;
        }

        function lagNyestePrikk() {
            const prikk = document.createElement('span');
            prikk.className = 'nyeste-gpx-prikk';
            prikk.setAttribute('aria-hidden', 'true');

        }

        function byggBokstavMeny() {
            const bokstavMap = {};
            const nyesteId = nyesteGpxToppId(topper);

            topper.forEach(topp => {
                knapperMap[topp.id] = { items: [], aktiver: null };
                hentStorBokstavMapping(topp.navn).forEach(m => {
                    if (!bokstavMap[m.bokstav]) bokstavMap[m.bokstav] = [];
                    // Samme topp vises kun én gang per bokstav
                    if (!bokstavMap[m.bokstav].some(entry => entry.topp === topp)) {
                        bokstavMap[m.bokstav].push({ topp: topp, ord: m.ord });
                    }
                });
            });

            Object.keys(bokstavMap).sort((a, b) => a.localeCompare(b, 'no')).forEach(bokstav => {
                const wrapper = document.createElement('div');
                wrapper.className = 'letter-dropdown';

                const btn = document.createElement('button');
                btn.className = 'letter-btn';
                btn.innerText = bokstav;
                if (bokstavMap[bokstav].some(entry => entry.topp.id === nyesteId)) {
                    btn.appendChild(lagNyestePrikk());
                    btn.title = 'Inneholder nyeste GPX-tur';
                }

                const menu = document.createElement('div');
                menu.className = 'dropdown-menu';

                btn.onclick = (e) => {
                    e.stopPropagation();
                    const varAktiv = menu.classList.contains('show');
                    lukkAlleDropdowns();
                    if (!varAktiv) {
                        menu.classList.add('show');
                        btn.classList.add('active');
                        plasserMeny(menu, btn);
                    }
                };

                bokstavMap[bokstav].forEach(entry => {
                    const topp = entry.topp;
                    const item = document.createElement('div');
                    item.className = 'dropdown-item';

                    const tekstSpan = document.createElement('span');
                    tekstSpan.innerHTML = formaterNavnMedFarge(topp.navn, entry.ord);
                    item.appendChild(tekstSpan);
                    if (topp.id === nyesteId) {
                        item.appendChild(lagNyestePrikk());
                        item.title = 'Nyeste GPX-tur';
                    }

                    const badge = lagBadge(topp.fil, topp.overrideAar);
                    if (badge) item.appendChild(badge);

                    knapperMap[topp.id].items.push(item);

                    item.onclick = (e) => {
                        e.stopPropagation();
                        avbrytHover();
                        lukkAlleDropdowns();
                        if (knapperMap[topp.id].aktiver) knapperMap[topp.id].aktiver();
                    };

                    if (!isTouchDevice) {
                        item.onmouseenter = () => startHover(topp);
                        item.onmouseleave = () => planleggSluttHover();
                    }

                    menu.appendChild(item);
                });

                wrapper.appendChild(btn);
                wrapper.appendChild(menu);
                buttonsContainer.appendChild(wrapper);
            });
            // Språkknappen skal alltid være først og synlig på mobil.
            buttonsContainer.prepend(document.getElementById('langBtn'));
            buttonsContainer.scrollLeft = 0;
        }

        function sjekkURLParameter() {
            const urlParams = new URLSearchParams(window.location.search);
            const fjellFraUrl = urlParams.get('fjell');
            const sokVal = fjellFraUrl ? fjellFraUrl.toLowerCase().trim() : null;
            const treff = sokVal ? topper.find(t => t.id === sokVal || t.navn.toLowerCase() === sokVal) : null;

            if (treff && knapperMap[treff.id] && knapperMap[treff.id].aktiver) {
                knapperMap[treff.id].aktiver();
            } else if (allTracksGroup.getLayers().length > 0) {
                visOversikt(allTracksGroup.getBounds());
            }
        }

        fetch('vinter_topper.json')
            .then(res => {
                if (!res.ok) throw new Error('Fant ikke vinter_topper.json');

            })
            .then(data => {
                topper = data;

                topper.sort((a,b) => a.navn.localeCompare(b.navn));
                byggBokstavMeny();

                const topperListEl = document.getElementById('topperList');
                topperListEl.innerHTML = '';
                topper.forEach(t => { const o = document.createElement('option'); o.value = t.navn; topperListEl.appendChild(o); });

                topper.forEach(topp => {

                    const track = new L.GPX('gpx/' + topp.fil, {

                    }).on('loaded', (e) => {

                        registrerLading();

                        const aktiver = () => {
                            isReseting = false; aktivToppNavn = topp.navn; settKartModus('topp'); galleriForespørsel++;
                            document.getElementById('topSearchInput').value = topp.navn;
                        avbrytHover();
                        lukkAlleDropdowns();

                            const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?fjell=' + encodeURIComponent(topp.id);
                            window.history.pushState({path: newUrl}, '', newUrl);

                            document.querySelectorAll('.dropdown-item').forEach(el => el.classList.remove('active'));
                            knapperMap[topp.id].items.forEach(el => el.classList.add('active'));
                            aktiveEkstraSporLayers.forEach(layer => map.removeLayer(layer));
                            aktiveEkstraSporLayers = [];
                            aktiveMarkører.forEach(m => map.removeLayer(m));
                            aktiveMarkører = [];
                            allTracksGroup.eachLayer(layer => layer.setStyle({opacity: 0.1, weight: 1, color: 'var(--strava-orange)'}));

                            if (topp.suunto) {

                                        }).on('loaded', (eEvt) => {
                                            if (!es.popupTekst) return;
                                            const punkter = eEvt.target.getLayers()[0].getLatLngs();
                                            if (punkter && punkter.length > 0) {
                                                const pin = L.marker(punkter[punkter.length - 1], { icon: smallIcon }).addTo(map);
                                                pin.bindPopup(`<b>${es.tittel}</b><br>${es.popupTekst}`);
                                                pin.openPopup();
                                                aktiveMarkører.push(pin);
                                            }
                                        });
                                    }
                                    esL.addTo(map).bringToFront();
                                    if (!aktiveEkstraSporLayers.includes(esL)) aktiveEkstraSporLayers.push(esL);

                        // Hover direkte på sporet i oversiktskartet: sporet blir blått
                        l.on('mouseover', () => {

                        l.on('mouseout', () => {

                                l.setStyle(OVERSIKT_SPOR);
                            }
                        });
                    });
                });
            })
            .catch(err => console.error("Kunne ikke laste vinter_topper.json:", err) || oppdaterProgresjon(true));

        // Lenkeknapper, Brattskala og lukket GPX-boks ligger to og to; er antallet oddetall får den siste full bredde
        function justerLenkeKnapper() {
            const hent = sel => Array.from(videoContainer.querySelectorAll(':scope > ' + sel));
            // Samme rekkefølge som i CSS (order)
            const celler = [
                ...hent('.video-link-btn, .search-link-btn, .gallery-link-btn'),
                ...hent('.brattskala-rad'),
                ...hent('.download-area:not(.open)')
            ];
            celler.forEach(b => b.classList.remove('btn-full'));
            if (celler.length % 2 === 1) celler[celler.length - 1].classList.add('btn-full');
        }

        // Beskrivelsesboksen kan foldes sammen; på mobil er den lukket til å begynne med for å spare plass
        function gjørSammenleggbar(boks) {
            if (window.matchMedia('(max-width: 768px)').matches) boks.classList.add('collapsed');
            boks.querySelector('.desc-box-title').onclick = () => boks.classList.toggle('collapsed');
        }

        // ---- Søk etter topp ----
        const searchInput = document.getElementById('topSearchInput');

        function utførSøk() {
            const søkVal = searchInput.value.toLowerCase().trim();
            if (!søkVal) return;
            const treff = topper.find(t => t.navn.toLowerCase() === søkVal)
                       || topper.find(t => t.navn.toLowerCase().includes(søkVal));
            if (treff && knapperMap[treff.id] && knapperMap[treff.id].aktiver) {
                knapperMap[treff.id].aktiver();
            }
        }

        searchInput.addEventListener('change', utførSøk);
        searchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') utførSøk(); });

        document.getElementById('resetBtn').onclick = () => {

            searchInput.value = '';

            const cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
            window.history.pushState({path: cleanUrl}, '', cleanUrl);

            document.querySelectorAll('.dropdown-item').forEach(el => el.classList.remove('active'));
            avbrytHover();
            lukkAlleDropdowns();
            map.closePopup();
            aktiveEkstraSporLayers.forEach(l => map.removeLayer(l));
            aktiveEkstraSporLayers = [];
            aktiveMarkører.forEach(m => map.removeLayer(m));
            aktiveMarkører = [];
            allTracksGroup.eachLayer(l => { if(!map.hasLayer(l)) map.addLayer(l); l.setStyle(OVERSIKT_SPOR); });
            visOversikt(allTracksGroup.getBounds());
            setTimeout(() => isReseting = false, 300);
        };

    function oversett(tekst) {
        if (!tekst) return tekst;
        var m = /^(\s*)([\s\S]*?)(\s*)$/.exec(tekst);
        var kjerne = m[2];
        if (!kjerne) return tekst;
        if (Object.prototype.hasOwnProperty.call(ORDBOK, kjerne)) return m[1] + ORDBOK[kjerne] + m[3];
        var ut = kjerne;
        for (var i = 0; i < REGLER.length; i++) ut = ut.replace(REGLER[i][0], REGLER[i][1]);
        return ut === kjerne ? tekst : m[1] + ut + m[3];
    }

    var lang = 'no';

    } catch (_) { var u2 = /[?&]lang=en/.test(location.search); lang = u2 ? 'en' : 'no'; }

    var tekstMinne = new WeakMap();   // tekstnode  -> {no, en}
    var attrMinne = new WeakMap();    // element    -> { attr: {no, en} }
    var ATTR = ['title', 'placeholder', 'aria-label', 'alt'];
    var hopp = { SCRIPT: 1, STYLE: 1, TEXTAREA: 1, NOSCRIPT: 1 };
    var observer = null;

    function tekstNode(n) {
        var p = n.parentNode;
        if (p && hopp[p.nodeName]) return;
        var rec = tekstMinne.get(n), cur = n.nodeValue;
        if (rec && cur === rec.en) { if (lang === 'no') n.nodeValue = rec.no; return; }
        if (lang === 'en') {
            var en = oversett(cur);
            if (en !== cur) { tekstMinne.set(n, { no: cur, en: en }); n.nodeValue = en; }
            else tekstMinne.delete(n);
        } else tekstMinne.delete(n);
    }

    function attributter(el) {
        if (!el.getAttribute) return;
        var rek = attrMinne.get(el);
        for (var i = 0; i < ATTR.length; i++) {
            var a = ATTR[i];
            if (!el.hasAttribute(a)) continue;
            var cur = el.getAttribute(a), r = rek && rek[a];
            if (r && cur === r.en) { if (lang === 'no') el.setAttribute(a, r.no); continue; }
            if (lang === 'en') {
                var en = oversett(cur);
                if (en !== cur) {
                    if (!rek) { rek = {}; attrMinne.set(el, rek); }
                    rek[a] = { no: cur, en: en };
                    el.setAttribute(a, en);
                } else if (rek) delete rek[a];
            } else if (rek) delete rek[a];
        }
    }

    function gjennom(rot) {
        if (!rot) return;

        var n;
        while ((n = tw.nextNode())) {
            if (n.nodeType === 3) tekstNode(n); else if (!hopp[n.nodeName]) attributter(n);
        }
    }

        if (observer) return;
        observer = new MutationObserver(function (muts) {
            for (var i = 0; i < muts.length; i++) {
                var m = muts[i];

                else if (m.type === 'attributes') attributter(m.target);
                else for (var j = 0; j < m.addedNodes.length; j++) gjennom(m.addedNodes[j]);
            }

    }

    var _alert = window.alert, _prompt = window.prompt;
    window.alert = function (m) { return _alert.call(window, lang === 'en' ? oversett(String(m)) : m); };
    window.prompt = function (m, d) { return _prompt.call(window, lang === 'en' ? oversett(String(m)) : m, d); };

    function oppdaterKnapp() {

    }

    function sett(nytt) {
        lang = nytt;
        try { localStorage.setItem('lang', lang); } catch (_) {}
        document.documentElement.lang = lang === 'en' ? 'en' : 'no';
        if (observer) observer.disconnect();
        gjennom(document.documentElement);
        observer = null; start();
        oppdaterKnapp();
        try { document.dispatchEvent(new CustomEvent('langchange', { detail: lang })); } catch (_) {}
    }

    window.__lang = function () { return lang; };
    window.__oversett = oversett;
    window.__setLang = sett;

    function init() {
        var b = document.getElementById('langBtn');
        if (b) b.addEventListener('click', function () { sett(lang === 'en' ? 'no' : 'en'); });
        document.documentElement.lang = lang === 'en' ? 'en' : 'no';
        if (lang === 'en') gjennom(document.documentElement);
        start();
        oppdaterKnapp();
    }

                    '<div class="fg-innhold"></div>' +
                    '<p class="fg-merk" hidden>Varsom publiserer varsel fra 1. desember til 31. mai.</p>' +
                    '<a class="fg-lenke" target="_blank" rel="noopener">Les hele varselet på Varsom.no</a>' +
                    '<div class="fg-kilde">Kilde: NVE / Varsom.no</div>' +
                '</div>';
            innhold = boks.querySelector('.fg-innhold');
            sesong = boks.querySelector('.fg-merk');
            lenke = boks.querySelector('.fg-lenke');
            lenke.href = varsomUrl();
            const knapp = boks.querySelector('.flyttbart-panelmin');
            const del = boks.querySelector('.flyttbart-panelinnhold');
            del.hidden = faregradMinimert;
            knapp.textContent = faregradMinimert ? '+' : '−';
            knapp.setAttribute('aria-expanded', String(!faregradMinimert));
            knapp.onclick = () => {
                faregradMinimert = !faregradMinimert;
                del.hidden = faregradMinimert;
                knapp.textContent = faregradMinimert ? '+' : '−';
                knapp.setAttribute('aria-expanded', String(!faregradMinimert));
                const tekst = faregradMinimert ? 'Utvid snøskredvarsel' : 'Minimer snøskredvarsel';
                knapp.setAttribute('aria-label', tekst); knapp.title = tekst;
                kartpanelInstanser.get('faregrad')?.juster();
            };
            L.DomEvent.disableClickPropagation(boks);
            L.DomEvent.disableScrollPropagation(boks);
            return boks;
        };

        function tekst(el, t) { el.textContent = ''; const d = document.createElement('div'); d.textContent = t; el.appendChild(d); }

        function vis(resultater, datoer) {
            const tabell = document.createElement('table');
            tabell.className = 'fg-tabell';
            const hode = tabell.createTHead().insertRow();
            ['', 'I dag', 'I morgen'].forEach(t => { const th = document.createElement('th'); th.textContent = t; hode.appendChild(th); });
            const kropp = tabell.createTBody();
            let alleNull = true, noenData = false;

            resultater.forEach((res, i) => {
                const rad = kropp.insertRow();
                rad.insertCell().textContent = REGIONER[i].navn;
                datoer.forEach(dato => {
                    const celle = rad.insertCell();
                    if (res.status !== 'fulfilled' || !Array.isArray(res.value)) { celle.textContent = '–'; return; }
                    noenData = true;
                    const w = res.value.find(x => String(x.ValidFrom || '').slice(0, 10) === dato);
                    const niva = w ? (Number(w.DangerLevel) || 0) : 0;
                    if (niva > 0) alleNull = false;
                    const badge = document.createElement('span');
                    badge.className = 'fg-badge';
                    badge.textContent = niva > 0 ? String(niva) : '–';
                    badge.style.background = FARGE[niva][0];
                    badge.style.color = FARGE[niva][1];
                    const navn = document.createElement('span');
                    navn.textContent = NIVA[niva] || NIVA[0];
                    celle.appendChild(badge);
                    celle.appendChild(navn);
                });
            });

            innhold.textContent = '';
            innhold.appendChild(tabell);
            sesong.hidden = !(noenData && alleNull);
        }

        function last() {
            tekst(innhold, 'Henter varsel …');
            sesong.hidden = true;
            const idag = new Date(), imorgen = new Date(Date.now() + 864e5);
            const a = iso(idag), b = iso(imorgen);
            Promise.allSettled(REGIONER.map(r => hent(r.id, a, b))).then(res => {
                if (!boks || !boks.isConnected) return;       // panelet ble lukket mens vi ventet
                if (res.every(r => r.status === 'rejected')) { tekst(innhold, 'Kunne ikke hente varselet'); return; }
                vis(res, [a, b]);
            });
        }

        // Kalles fra Snøskred-menyen (avkrysningsboksen «Faregrad»)
        window.settFaregrad = function (paa) {
            if (paa) {
                panel.addTo(map);
                lagFlyttbartKartpanel(boks, 'faregrad', '.flyttbart-panelhode', { right: 12, bottom: 20 });
                last();
            } else { map.removeControl(panel); boks = null; }
        };

        document.addEventListener('langchange', () => { if (lenke) lenke.href = varsomUrl(); });
    })();
    </script>
    <script>
    /* ===== MARKER OMRÅDE FOR Å ZOOME (pc): trykk «Marker», dra en firkant, kartet zoomer til den. Esc avbryter. ===== */
    (function () {
        const btn = document.getElementById('markerBtn');
        const beholder = document.getElementById('map-container');
        if (!btn || !beholder) return;
        let modus = false, start = null, boks = null, hint = null, hintTimer = null;

        function fjernHint() { clearTimeout(hintTimer); if (hint) { hint.remove(); hint = null; } }
        function avbryt() { if (boks) { boks.remove(); boks = null; } start = null; }
        function slaPa(pa) {
            modus = pa;
            btn.classList.toggle('active', pa);
            beholder.classList.toggle('marker-modus', pa);
            fjernHint();
            if (pa) {
                map.dragging.disable();
                hint = document.createElement('div');
                hint.className = 'marker-hint';
                hint.textContent = 'Dra en firkant over området du vil zoome til · Esc avbryter';
                beholder.appendChild(hint);
                hintTimer = setTimeout(fjernHint, 3500);
            } else {
                map.dragging.enable();
                avbryt();
            }
        }
        function punkt(e) {
            const r = map.getContainer().getBoundingClientRect();
            return { x: Math.min(Math.max(e.clientX - r.left, 0), r.width), y: Math.min(Math.max(e.clientY - r.top, 0), r.height) };
        }
        function tegn(p) {
            if (!boks || !start) return;
            boks.style.left = Math.min(start.x, p.x) + 'px';
            boks.style.top = Math.min(start.y, p.y) + 'px';
            boks.style.width = Math.abs(p.x - start.x) + 'px';
            boks.style.height = Math.abs(p.y - start.y) + 'px';
        }

        btn.addEventListener('click', () => slaPa(!modus));

        // Fanges før kartet, så kartet ikke begynner å dra mens du markerer. Menyen over kartet fungerer som vanlig.
        beholder.addEventListener('mousedown', e => {
            if (!modus || e.button !== 0 || e.target.closest('.leaflet-control, .flyttbart-kartpanel, #video-buttons-container, #track-progress')) return;
            e.preventDefault();
            e.stopPropagation();
            start = punkt(e);
            boks = document.createElement('div');
            boks.className = 'marker-boks';
            beholder.appendChild(boks);
            tegn(start);
        }, true);
        window.addEventListener('mousemove', e => { if (start) tegn(punkt(e)); });
        window.addEventListener('mouseup', e => {
            if (!start) return;
            const a = start, b = punkt(e);
            avbryt();
            if (Math.abs(b.x - a.x) < 12 || Math.abs(b.y - a.y) < 12) return;   // for liten: prøv igjen
            const sw = map.containerPointToLatLng(L.point(Math.min(a.x, b.x), Math.max(a.y, b.y)));
            const ne = map.containerPointToLatLng(L.point(Math.max(a.x, b.x), Math.min(a.y, b.y)));
            slaPa(false);
            map.fitBounds(L.latLngBounds(sw, ne));
        });
        document.addEventListener('keydown', e => { if (e.key === 'Escape' && modus) slaPa(false); });
    })();
    </script>
<script>
    /* ===== REGOBS: observerte naturfarar, henta frå NVE sitt opne Regobs API v5 =====
       Finn observasjonar innanfor synleg kartutsnitt, ikkje frå faste koordinatar.
       Eiget Leaflet-lag: påverkar ikkje GPX, snødybde, brattheit eller kartbakgrunnen.
       API-dokumentasjon: https://api.regobs.no/v5/swagger/ui/index
    */
    (function () {
        'use strict';
        const API = 'https://api.regobs.no/v5/Search/AtAGlance';
        const regobsBtn = document.getElementById('regobsBtn');
        const panel = document.getElementById('regobsPanel');
        const panelBody = document.getElementById('regobsPanelBody');
        const regobsFlytt = lagFlyttbartKartpanel(panel, 'regobs', '.regobs-panel-header', { left: 12, top: 12 });
        const minBtn = document.getElementById('regobsMinBtn');
        const closeBtn = document.getElementById('regobsCloseBtn');
        const refreshBtn = document.getElementById('regobsRefreshBtn');
        const daysSelect = document.getElementById('regobsDays');
        const statusEl = document.getElementById('regobsStatus');
        const filterEls = [...panel.querySelectorAll('[data-regobs-type]')];
        if (typeof map === 'undefined' || typeof L === 'undefined') return;

        const labels = {
            10: { no: 'Snø', en: 'Snow', color: '#2d77b5' },
            20: { no: 'Jord', en: 'Landslide', color: '#a16b30' },
            60: { no: 'Vann', en: 'Water', color: '#17a39b' },
            70: { no: 'Is', en: 'Ice', color: '#865dc4' }
        };
        const lang = () => typeof window.__lang === 'function' && window.__lang() === 'en' ? 'en' : 'no';
        const t = (no, en) => lang() === 'en' ? en : no;
        const escapeHtml = v => String(v === null || v === undefined ? '' : v)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        const pane = map.createPane('regobsObservationsPane');
        pane.style.zIndex = '625';
        const observationsLayer = L.layerGroup();
        let active = false;
        let collapsed = false;
        let observations = [];
        let loading = false;
        let requestNr = 0;
        let controller = null;
        let reloadTimer = null;
        let lastStatus = ['idle'];
        const MAX_RECORDS = 500;

        const types = () => filterEls.filter(el => el.checked).map(el => Number(el.dataset.regobsType));
        function status(code, count) {
            lastStatus = [code, count];
            const messages = {
                idle: [ 'Slå på for å hente observasjonar.', 'Switch on to load observations.' ],
                loading: [ 'Hentar observasjonar …', 'Loading observations …' ],
                empty: [ 'Ingen observasjonar i dette kartutsnittet og tidsrommet.', 'No observations in this map view and time range.' ],
                nofilter: [ 'Vel minst éin observasjonstype.', 'Select at least one observation type.' ],
                failed: [ 'Kunne ikkje hente data. Kontroller nettet, eller prøv igjen.', 'Could not load data. Check your connection or retry.' ]
            };
            if (code === 'ready') {
                statusEl.textContent = t(`Viser ${count} observasjonar`, `Showing ${count} observations`) +
                    (count >= MAX_RECORDS ? t(' (maks. 500 – zoom inn)', ' (max 500 – zoom in)') : '');
            } else statusEl.textContent = (messages[code] || messages.idle)[lang() === 'en' ? 1 : 0];
            refreshBtn.disabled = loading;
            refreshBtn.style.opacity = loading ? '.4' : '1';
        }
        function dateText(value) {
            if (!value) return '';
            const d = new Date(value);
            if (!Number.isFinite(d.getTime())) return '';
            return d.toLocaleString(lang() === 'en' ? 'en-GB' : 'nb-NO', {
                day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'
            });
        }
        function popupHtml(o) {
            const type = labels[Number(o.GeoHazardTID)];
            const heading = o.Title || (type ? type[lang()] : t('Observasjon', 'Observation'));
            const forms = Array.isArray(o.FormNames) ? o.FormNames.filter(Boolean).join(', ') : '';
            const name = o.NickName || t('Ikkje oppgitt', 'Not provided');
            const sourceLink = Number.isInteger(o.RegId) && o.RegId > 0
                ? `https://regobs.no/Registration/${o.RegId}` : 'https://regobs.no/';
            return `<div class="regobs-popup">
                <strong>${escapeHtml(heading)}</strong>
                ${forms && forms !== heading ? `<div class="regobs-popup-detail">${escapeHtml(forms)}</div>` : ''}
                <div class="regobs-popup-detail">${escapeHtml(dateText(o.DtObsTime))}</div>
                <div class="regobs-popup-detail">${escapeHtml(t('Observatør:', 'Observer:'))} ${escapeHtml(name)}</div>
                <a href="${sourceLink}" target="_blank" rel="noopener noreferrer">${escapeHtml(t('Sjå observasjonen på Regobs.no', 'View observation on Regobs.no'))} ↗</a>
            </div>`;
        }
        function draw() {
            observationsLayer.clearLayers();
            const wanted = new Set(types());
            let shown = 0;
            for (const o of observations) {
                if (!wanted.has(Number(o.GeoHazardTID))) continue;
                const lat = Number(o.Latitude), lng = Number(o.Longitude);
                if (!Number.isFinite(lat) || !Number.isFinite(lng) || lat < -90 || lat > 90 || lng < -180 || lng > 180) continue;
                const conf = labels[Number(o.GeoHazardTID)];
                const marker = L.circleMarker([lat, lng], {
                    pane: 'regobsObservationsPane', radius: 7, color: '#fff', weight: 2,
                    fillColor: conf ? conf.color : '#555', fillOpacity: .94,
                    bubblingMouseEvents: false
                });
                marker.bindPopup(() => popupHtml(o), { maxWidth: 280, autoPan: true });
                marker.bindTooltip(`${conf ? conf[lang()] : 'Regobs'} · ${o.Title || ''}`, { direction: 'top' });
                observationsLayer.addLayer(marker);
                shown++;
            }
            if (!loading) status(types().length === 0 ? 'nofilter' : shown ? 'ready' : 'empty', shown);
        }
        async function loadObservations() {
            if (!active) return;
            clearTimeout(reloadTimer);
            if (controller) controller.abort();
            controller = new AbortController();
            const currentRequest = ++requestNr;
            const selected = types();
            if (!selected.length) {
                observations = []; loading = false; draw(); return;
            }
            const b = map.getBounds();
            if (!b.isValid()) return;
            const days = Number(daysSelect.value) || 14;
            const requestBody = {
                LangKey: lang() === 'en' ? 2 : 1,
                SelectedGeoHazards: selected,
                FromDtObsTime: new Date(Date.now() - days * 86400000).toISOString(),
                Extent: {
                    TopLeft: { Latitude: Math.min(90, b.getNorth()), Longitude: Math.max(-180, b.getWest()) },
                    BottomRight: { Latitude: Math.max(-90, b.getSouth()), Longitude: Math.min(180, b.getEast()) }
                },
                NumberOfRecords: MAX_RECORDS,
                OrderBy: 'DtObsTime', AscendingOrder: false
            };
            loading = true;
            status('loading');
            try {
                const response = await fetch(API, {
                    method: 'POST', mode: 'cors',
                    headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
                    body: JSON.stringify(requestBody), signal: controller.signal
                });
                if (!response.ok) throw new Error(`Regobs API HTTP ${response.status}`);
                const data = await response.json();
                if (!active || currentRequest !== requestNr) return;
                if (!Array.isArray(data)) throw new Error('Unexpected Regobs response');
                observations = data;
                loading = false;
                draw();
            } catch (error) {
                if (!active || currentRequest !== requestNr || error.name === 'AbortError') return;
                console.warn('Regobs: klarte ikkje hente observasjonar:', error);
                observations = [];
                loading = false;
                observationsLayer.clearLayers();
                status('failed');
            }
        }
        function scheduleLoad() {
            if (!active) return;
            clearTimeout(reloadTimer);
            reloadTimer = setTimeout(loadObservations, 400);
        }
        function enable(enabled) {
            if (active === enabled) return;
            active = enabled;
            regobsBtn.classList.toggle('btn-toggle-active', enabled);
            regobsBtn.setAttribute('aria-pressed', String(enabled));
            panel.hidden = !enabled;
            if (enabled) {
                regobsFlytt.juster();
                observationsLayer.addTo(map);
                loadObservations();
            } else {
                ++requestNr;
                clearTimeout(reloadTimer);
                if (controller) controller.abort();
                controller = null;
                loading = false;
                observations = [];
                observationsLayer.clearLayers();
                map.removeLayer(observationsLayer);
                status('idle');
            }
        }
        regobsBtn.addEventListener('click', () => enable(!active));
        closeBtn.addEventListener('click', () => enable(false));
        minBtn.addEventListener('click', () => {
            collapsed = !collapsed;
            panel.classList.toggle('regobs-collapsed', collapsed);
            minBtn.textContent = collapsed ? '+' : '−';
            minBtn.setAttribute('aria-expanded', String(!collapsed));
            const title = collapsed ? t('Utvid Regobs-panelet', 'Expand Regobs panel') : t('Minimer Regobs-panelet', 'Minimize Regobs panel');
            minBtn.setAttribute('aria-label', title);
            minBtn.title = title;
            regobsFlytt.juster();
        });
        refreshBtn.addEventListener('click', loadObservations);
        daysSelect.addEventListener('change', loadObservations);
        filterEls.forEach(el => el.addEventListener('change', () => {
            // Filtera må verke med ein gong; ny API-forespurnad tek inn utvalet.
            draw();
            loadObservations();
        }));
        map.on('moveend', scheduleLoad);
        document.addEventListener('langchange', () => {
            if (!active) return;
            status(...lastStatus);
            if (!loading) draw();
            scheduleLoad();
        });
        L.DomEvent.disableClickPropagation(panel);
        L.DomEvent.disableScrollPropagation(panel);
        // Frys Regobs-status ved init, men hent ikkje noko før brukaren slår på laget.
        status('idle');
    })();
</script>
