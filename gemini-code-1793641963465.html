<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toppturer og Fjellturer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
<style>
:root {
    --ink: #000;
    --paper: #fff;
    --muted: #6b6b6b;
    --line: #000;
    --winter-bg: #dde9f2;
    --winter-ink: #3f6f93;
    --summer-bg: #e6efd8;
    --summer-ink: #5f7f3b;
    --map-bg: #ededeb;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
    min-height: 100vh;
    background: var(--paper);
    color: var(--ink);
    font-family: "Jost", "Helvetica Neue", Arial, sans-serif;
    font-weight: 300;
    position: relative;
    overflow-x: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 0;
}
svg { fill: none; stroke: currentColor; stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; }

/* Omriss av Tromsøya: egen plass til høyre, aldri bak tekst */
.outline {
    position: absolute;
    top: -16px;
    right: 0;
    height: calc(100% + 32px);
    aspect-ratio: 800 / 1546;
    color: var(--ink);
    opacity: .55;
    pointer-events: none;
    z-index: 2;
    transition: color .5s ease, opacity .5s ease;
}
body:has(.winter:hover) .outline, body:has(.winter:focus-visible) .outline { color: var(--winter-ink); opacity: .9; }
body:has(.summer:hover) .outline, body:has(.summer:focus-visible) .outline { color: var(--summer-ink); opacity: .9; }

main {
    position: relative;
    width: 100%;
    max-width: 640px;
    padding: 0 28px;
    display: flex;
    flex-direction: column;
}

h1 {
    position: relative;
    z-index: 1;
    margin: 0 0 10px;
    font-size: clamp(40px, 9vw, 60px);
    font-weight: 200;
    letter-spacing: -.02em;
    line-height: 1;
}
.sub { position: relative; z-index: 1; margin: 0 0 56px; color: var(--muted); font-size: 16px; }

nav { position: relative; z-index: 1; border-top: 1px solid var(--ink); }

.row {
    position: relative;
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 26px 4px;
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1px solid var(--ink);
    transition: background .35s ease, padding .35s ease;
}
.row .ico { flex: none; width: 44px; height: 44px; transition: color .35s ease; }
.row .ico.tall { width: 23px; margin: 0 10px; }
.row .txt { display: flex; flex-direction: column; gap: 2px; }
.row .name { font-size: 22px; letter-spacing: -.005em; }
.row .desc { font-size: 14px; color: var(--muted); }

.row:hover, .row:focus-visible { padding-left: 20px; outline: none; }
.row:focus-visible { box-shadow: inset 0 0 0 1px var(--ink); }
.winter:hover, .winter:focus-visible { background: var(--winter-bg); }
.winter:hover .ico, .winter:focus-visible .ico { color: var(--winter-ink); }
.summer:hover, .summer:focus-visible { background: var(--summer-bg); }
.summer:hover .ico, .summer:focus-visible .ico { color: var(--summer-ink); }
.map:hover, .map:focus-visible { background: var(--map-bg); }

/* Minimalistisk Beta-knapp i øvre høyre hjørne av vintermenyen */
.beta-btn {
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 3;
    padding: 4px 9px;
    font-size: 12px;
    font-weight: 400;
    color: var(--winter-ink);
    border: 1px solid var(--winter-ink);
    border-radius: 4px;
    text-decoration: none;
    background: rgba(255, 255, 255, 0.6);
    backdrop-filter: blur(2px);
    transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
}
.beta-btn:hover, .beta-btn:focus-visible {
    background: var(--winter-ink);
    color: #fff;
    transform: translateY(-1px);
    outline: none;
}

.sun-rays, .flake { transform-origin: 22px 22px; transition: transform 1.4s ease; }
.summer:hover .sun-rays { transform: rotate(45deg); }
.winter:hover .flake { transform: rotate(60deg); }

.foot {
    position: relative;
    z-index: 1;
    padding-top: 40px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 6px;
    font-size: 13px;
    color: var(--muted);
}
.counter b { font-weight: 400; color: var(--ink); }
.bmc {
    transform: scale(.62);
    transform-origin: left center;
    opacity: .75;
    transition: opacity .2s;
    height: 28px;
    display: flex;
    align-items: center;
}
.bmc:hover { opacity: 1; }

@media (max-width: 560px) {
    .row .name { font-size: 19px; }
    .row { gap: 16px; }
    .row .ico { width: 38px; height: 38px; }
    .row .ico.tall { width: 20px; margin: 0 9px; }
    .outline { right: -190px; opacity: .45; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
.lang {
    position: relative; z-index: 3; align-self: flex-start; margin: 0 0 28px;
    display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px;
    border: 1px solid var(--ink); border-radius: 0; background: var(--paper); color: var(--ink);
    font: inherit; font-size: 14px; font-weight: 400; cursor: pointer; transition: background .3s ease;
}
.lang svg { width: 17px; height: 17px; flex: none; }
.lang:hover, .lang:focus-visible { background: var(--map-bg); outline: none; }
.lang-code { letter-spacing: .04em; }
</style>
</head>

<script>
    const namespace = 'larsgimse-topptur-unike';
    const storageKey = 'has_visited_topptur';
    const el = document.getElementById('count');
    let visited = false;
    try { visited = !!localStorage.getItem(storageKey); } catch (e) {}

    if (visited) {
        fetch(`https://countapi.mileshilliard.com/api/v1/get/${namespace}`)
            .then(r => r.json())
            .then(d => { el.innerText = d.value || "1"; })
            .catch(() => { el.innerText = "—"; });
    } else {
        fetch(`https://countapi.mileshilliard.com/api/v1/hit/${namespace}`)
            .then(r => r.json())
            .then(d => {
                el.innerText = d.value || "1";
                try { localStorage.setItem(storageKey, 'true'); } catch (e) {}
            })
            .catch(() => { el.innerText = "1"; });
    }
</script>

        [/Henter fjelltopper fra OpenStreetMap: (\d+) av (\d+) fliser/g, 'Fetching peaks from OpenStreetMap: $1 of $2 tiles'],
        [/\(kan ta opptil ett minutt\)/g, '(may take up to a minute)'],
        [/(\d+) av (\d+) fliser ferdig/g, '$1 of $2 tiles done'],
        [/(\d+) spørringer venter på Overpass/g, '$1 requests waiting for Overpass'],
        [/(\d+) spørring venter på Overpass/g, '$1 request waiting for Overpass'],
        [new RegExp('(\\d+) ' + NN + ' så langt', 'g'), function (m, n, w) { return n + ' ' + N(w) + ' so far'; }],
        [new RegExp('Ferdig: (\\d+) ' + NN, 'g'), function (m, n, w) { return 'Done: ' + n + ' ' + N(w); }],
        [/(\d+) fliser hentet på/g, '$1 tiles fetched in'],
        [/, (\d+) fra hurtiglager/g, ', $1 from cache'],
        [/, (\d+) fra lagret/g, ', $1 from saved data'],
        [/(\d+) fra lagret/g, '$1 from saved data'],
        [/lagret i nettleseren/g, 'saved in the browser'],
        [/(\d+) nye fjelltopper lagt til/g, '$1 new peaks added'],
        [/Ingen nye fjelltopper her/g, 'No new peaks here'],
        [new RegExp('Feil ved henting av ' + NN + ':', 'g'), function (m, w) { return 'Error fetching ' + N(w) + ':'; }],
        [/Fant ikke flere fjelltopper\./g, 'Could not find more peaks.'],
        [/Overpass svarer ikke/g, 'Overpass is not responding'],
        [/tidsavbrudd på serveren/g, 'server timeout'],
        [/det som er hentet er lagret, trykk igjen for å fortsette/g, 'what has been fetched is saved, press again to continue'],
        [/Dra en firkant over området du vil zoome til/g, 'Drag a rectangle over the area you want to zoom to'],
        [/Esc avbryter/g, 'Esc to cancel'],
        [/Zoom inn nærmere \(nivå (\d+)\) for å laste stier\.\.\./g, 'Zoom in closer (level $1) to load trails...'],
        [/Laster inn spor\.\.\. (\d+)\/(\d+)/g, 'Loading tracks... $1/$2'],
        [/Alle (\d+) spor er lastet inn!/g, 'All $1 tracks loaded!'],
        [/Laster spor (\d+) \/ (\d+)/g, 'Loading tracks $1 / $2'],
        [/^(\d+) spor lastet$/g, '$1 tracks loaded'],
        [/^(\d+) fliser$/g, '$1 tiles'],
        [/(\d+),(\d) s\b/g, '$1.$2 s'],
        [/^Rute (.+)$/g, 'Route $1'],
        [/^Busser synlige: (\d+)$/g, 'Buses visible: $1'],
        [/^Busser: (\d+)$/g, 'Buses: $1'],
        [/^Linje (\S+)$/g, 'Line $1'],
        [/Forsinkelse: I rute/g, 'Delay: On time'],
        [/^Forsinkelse:/g, 'Delay:'],
        [/^(\d+) m\.o\.h\.$/g, '$1 m a.s.l.'],
        [/^Ekstra bilder \((\d+)\)$/g, 'Extra photos ($1)'],
        [/^Se video \((\d{4})\)$/g, 'Watch video ($1)'],
        [/^Spor (\d+)$/g, 'Track $1'],
        [/^Tur (\d+) \((\d{4})\)$/g, 'Trip $1 ($2)'],
        [/Lenke for (.+) er kopiert til utklippstavlen!/g, 'Link for $1 copied to the clipboard!'],
        [/Kopier denne lenken:/g, 'Copy this link:'],
        /* Høydeprofil-popup */
        [/Distanse T\/R:/g, 'Distance round trip:'],
        [/Stigning:/g, 'Ascent:'],
        [/Tid til topp:/g, 'Time to summit:'],
        [/Tid T\/R:/g, 'Time round trip:'],
        [/Til topp:/g, 'To summit:'],
        [/⌛ T\/R:/g, '⌛ Round trip:'],
        [/(\u{1F3D4}\uFE0F?\s*)Topp:/gu, '$1Summit:'],
        [/(\d+)t (\d+)min/g, '$1h $2min'],
        [/(\d+) moh\b/g, '$1 m a.s.l.']
    ];

    function oversett(tekst) {
        if (!tekst) return tekst;
        var m = /^(\s*)([\s\S]*?)(\s*)$/.exec(tekst);
        var kjerne = m[2];
        if (!kjerne) return tekst;
        if (Object.prototype.hasOwnProperty.call(ORDBOK, kjerne)) return m[1] + ORDBOK[kjerne] + m[3];
        var ut = kjerne;
        for (var i = 0; i < REGLER.length; i++) ut = ut.replace(REGLER[i][0], REGLER[i][1]);
        return ut === kjerne ? tekst : m[1] + ut + m[3];
    }

    var lang = 'no';
    try {
        var url = new URLSearchParams(location.search).get('lang');
        var lagret = localStorage.getItem('lang');
        lang = (url === 'en' || url === 'no') ? url : (lagret === 'en' ? 'en' : 'no');
    } catch (_) { var u2 = /[?&]lang=en/.test(location.search); lang = u2 ? 'en' : 'no'; }

    var tekstMinne = new WeakMap();   // tekstnode  -> {no, en}
    var attrMinne = new WeakMap();    // element    -> { attr: {no, en} }
    var ATTR = ['title', 'placeholder', 'aria-label', 'alt'];
    var hopp = { SCRIPT: 1, STYLE: 1, TEXTAREA: 1, NOSCRIPT: 1 };
    var observer = null;

    function tekstNode(n) {
        var p = n.parentNode;
        if (p && hopp[p.nodeName]) return;
        var rec = tekstMinne.get(n), cur = n.nodeValue;
        if (rec && cur === rec.en) { if (lang === 'no') n.nodeValue = rec.no; return; }
        if (lang === 'en') {
            var en = oversett(cur);
            if (en !== cur) { tekstMinne.set(n, { no: cur, en: en }); n.nodeValue = en; }
            else tekstMinne.delete(n);
        } else tekstMinne.delete(n);
    }

    function attributter(el) {
        if (!el.getAttribute) return;
        var rek = attrMinne.get(el);
        for (var i = 0; i < ATTR.length; i++) {
            var a = ATTR[i];
            if (!el.hasAttribute(a)) continue;
            var cur = el.getAttribute(a), r = rek && rek[a];
            if (r && cur === r.en) { if (lang === 'no') el.setAttribute(a, r.no); continue; }
            if (lang === 'en') {
                var en = oversett(cur);
                if (en !== cur) {
                    if (!rek) { rek = {}; attrMinne.set(el, rek); }
                    rek[a] = { no: cur, en: en };
                    el.setAttribute(a, en);
                } else if (rek) delete rek[a];
            } else if (rek) delete rek[a];
        }
    }

    function gjennom(rot) {
        if (!rot) return;
        if (rot.nodeType === 3) { tekstNode(rot); return; }
        if (rot.nodeType !== 1 && rot.nodeType !== 9 && rot.nodeType !== 11) return;
        if (rot.nodeType === 1) { if (hopp[rot.nodeName]) return; attributter(rot); }
        var tw = document.createTreeWalker(rot, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT, null);
        var n;
        while ((n = tw.nextNode())) {
            if (n.nodeType === 3) tekstNode(n); else if (!hopp[n.nodeName]) attributter(n);
        }
    }

    function start() {
        if (observer) return;
        observer = new MutationObserver(function (muts) {
            for (var i = 0; i < muts.length; i++) {
                var m = muts[i];
                if (m.type === 'characterData') tekstNode(m.target);
                else if (m.type === 'attributes') attributter(m.target);
                else for (var j = 0; j < m.addedNodes.length; j++) gjennom(m.addedNodes[j]);
            }
        });
        observer.observe(document.documentElement, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ATTR });
    }

    /* alert() og prompt() er ikke DOM, så de pakkes inn */
    var _alert = window.alert, _prompt = window.prompt;
    window.alert = function (m) { return _alert.call(window, lang === 'en' ? oversett(String(m)) : m); };
    window.prompt = function (m, d) { return _prompt.call(window, lang === 'en' ? oversett(String(m)) : m, d); };

    function oppdaterKnapp() {
        var b = document.getElementById('langBtn');
        if (!b) return;
        var kode = b.querySelector('.lang-code');
        if (kode) kode.textContent = lang === 'en' ? 'NO' : 'EN';
        b.setAttribute('aria-label', lang === 'en' ? 'Bytt til norsk' : 'Switch to English');
        b.setAttribute('title', lang === 'en' ? 'Bytt til norsk' : 'Switch to English');
    }

    function sett(nytt) {
        lang = nytt;
        try { localStorage.setItem('lang', lang); } catch (_) {}
        document.documentElement.lang = lang === 'en' ? 'en' : 'no';
        if (observer) observer.disconnect();
        gjennom(document.documentElement);
        observer = null; start();
        oppdaterKnapp();
        try { document.dispatchEvent(new CustomEvent('langchange', { detail: lang })); } catch (_) {}
    }

    window.__lang = function () { return lang; };
    window.__oversett = oversett;
    window.__setLang = sett;

    function init() {
        var b = document.getElementById('langBtn');
        if (b) b.addEventListener('click', function () { sett(lang === 'en' ? 'no' : 'en'); });
        document.documentElement.lang = lang === 'en' ? 'en' : 'no';
        if (lang === 'en') gjennom(document.documentElement);
        start();
        oppdaterKnapp();
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
    </script>
</body>
