<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Oversiktskart</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-color: #111111;
            --panel-bg: rgba(26, 26, 26, 0.9);
            --text-color: #eeeeee;
            --highlight-orange: #fc4c02;
            --flight-yellow: #ffd700;
            --bus-red: #ef4444;
            --boat-cyan: #06b6d4;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            height: 100dvh; 
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            background: var(--panel-bg);
            padding: 10px 14px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            border: 1px solid #222;
            border-radius: 8px;
            z-index: 1000;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            min-height: 52px;
        }

        h1 { 
            font-size: 1.1rem; 
            font-weight: 700; 
            letter-spacing: -0.5px; 
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
        }
        
        .nav-buttons { display: flex; gap: 6px; align-items: center; }
        
        .btn {
            padding: 6px 12px;
            border-radius: 6px;
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #333;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 500;
            transition: all 0.2s;
            cursor: pointer;
            white-space: nowrap;
        }
        
        .btn-reset {
            background: #222;
            border-color: #444;
            color: #ccc;
        }

        .btn-flights.active { background: #d97706; border-color: #fff; font-weight: 700; color: #fff; }
        .btn-bus.active { background: #dc2626; border-color: #fff; font-weight: 700; color: #fff; }
        .btn-boat.active { background: #0891b2; border-color: #fff; font-weight: 700; color: #fff; }

        #map-container {
            flex: 1;
            width: 100%;
            height: 100%;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
            background: var(--bg-color);
        }

        .panels-container {
            position: fixed;
            top: 75px;
            right: 10px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .ui-panel {
            background: var(--panel-bg); 
            padding: 12px 15px; 
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            border: 1px solid #333;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            font-family: inherit; 
            display: none; 
            flex-direction: column; 
            gap: 8px;
            min-width: 180px;
            pointer-events: auto;
        }
        
        .ui-panel.active { display: flex; }
        
        .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 0.8rem; color: #ddd; }
        
        .switch { position: relative; display: inline-block; width: 34px; height: 18px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #444; transition: .3s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        
        #flight-panel input:checked + .slider { background-color: #f59e0b; }
        #bus-panel input:checked + .slider { background-color: #ef4444; }
        #boat-panel input:checked + .slider { background-color: #06b6d4; }
        
        input:checked + .slider:before { transform: translateX(16px); }

        .alt-slider { width: 60px; cursor: pointer; accent-color: #f59e0b; }
        
        .counter-box { 
            position: fixed; 
            bottom: 20px; 
            left: 20px; 
            z-index: 10000; 
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        
        .counter { 
            background: var(--panel-bg); 
            padding: 6px 14px; 
            border-radius: 20px; 
            border: 1px solid #333;
            font-size: 0.8rem; 
            display: none;
        }
        #counter.active { display: block; color: #ffd700; }
        #bus-counter.active { display: block; color: #ef4444; }
        #boat-counter.active { display: block; color: #06b6d4; }

        .overlay-canvas {
            pointer-events: none;
            z-index: 450;
        }

        .leaflet-popup-content-wrapper {
            background: #1a1a1a !important;
            color: #fff !important;
            border: 1px solid var(--highlight-orange);
            border-radius: 6px;
        }
        .leaflet-popup-tip {
            background: #1a1a1a !important;
        }
        
        .flight-popup .leaflet-popup-content-wrapper { border-color: #ffd700 !important; }
        .bus-popup .leaflet-popup-content-wrapper { border-color: #ef4444 !important; }
        .boat-popup .leaflet-popup-content-wrapper { border-color: #06b6d4 !important; }

        @media (max-width: 600px) {
            header {
                top: auto;
                bottom: 20px;
                flex-direction: column;
                gap: 8px;
                align-items: center;
                background: rgba(20, 20, 20, 0.95);
                box-shadow: 0 4px 20px rgba(0,0,0,0.6);
                min-height: auto;
            }
            h1 { 
                position: static; 
                transform: none; 
                font-size: 0.9rem; 
                text-align: center;
            }
            .nav-buttons {
                width: 100%;
                justify-content: space-between;
                flex-wrap: wrap;
            }
            .btn {
                flex: 1;
                text-align: center;
                padding: 8px 4px;
                font-size: 0.75rem;
            }
            .panels-container {
                top: 10px;
                right: 10px;
                max-width: 200px;
            }
            .counter-box {
                bottom: 120px;
                left: 10px;
            }
            .leaflet-bottom { bottom: 120px !important; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Oversiktskart</h1>
        <div class="nav-buttons">
            <button id="btn-reset" class="btn btn-reset">🔄 Nullstill</button>
            <button id="btn-fly" class="btn btn-flights">✈️ Fly</button>
            <button id="btn-buss" class="btn btn-bus">🚌 Buss</button>
            <button id="btn-baat" class="btn btn-boat">🚢 Båt</button>
        </div>
    </header>

    <div class="panels-container">
        <!-- FLY PANEL -->
        <div id="flight-panel" class="ui-panel">
            <div class="row">Haler: <label class="switch"><input type="checkbox" id="trailSwitch" checked><span class="slider"></span></label></div>
            <div class="row">Flynr: <label class="switch"><input type="checkbox" id="flightNumSwitch"><span class="slider"></span></label></div>
            <div class="row">Kallesignal: <label class="switch"><input type="checkbox" id="callsignSwitch"><span class="slider"></span></label></div>
            <div class="row">Registrering: <label class="switch"><input type="checkbox" id="regSwitch"><span class="slider"></span></label></div>
            <div class="row">Høyde (Av/Fot/m): <input type="range" id="altSlider" class="alt-slider" min="0" max="2" value="0"></div>
            <div class="row">Fra: <label class="switch"><input type="checkbox" id="originSwitch"><span class="slider"></span></label></div>
            <div class="row">Til: <label class="switch"><input type="checkbox" id="destSwitch"><span class="slider"></span></label></div>
        </div>

        <!-- BUSS PANEL -->
        <div id="bus-panel" class="ui-panel">
            <div class="row">Linjenr: <label class="switch"><input type="checkbox" id="busLineSwitch" checked><span class="slider"></span></label></div>
            <div class="row">Destinasjon: <label class="switch"><input type="checkbox" id="busDestSwitch"><span class="slider"></span></label></div>
            <div class="row">Forsinkelse: <label class="switch"><input type="checkbox" id="busDelaySwitch"><span class="slider"></span></label></div>
        </div>

        <!-- BÅT PANEL -->
        <div id="boat-panel" class="ui-panel">
            <div class="row">Kallesignal: <label class="switch"><input type="checkbox" id="boatNameSwitch" checked><span class="slider"></span></label></div>
            <div class="row">MMSI: <label class="switch"><input type="checkbox" id="boatTypeSwitch"><span class="slider"></span></label></div>
            <div class="row">Fart: <label class="switch"><input type="checkbox" id="boatSpeedSwitch"><span class="slider"></span></label></div>
        </div>
    </div>

    <div class="counter-box">
        <div id="counter" class="counter">Fly synlige: 0</div>
        <div id="bus-counter" class="counter">Busser: Laster...</div>
        <div id="boat-counter" class="counter">Båter: Laster...</div>
    </div>

    <div id="map-container">
        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
        const minRenderer = L.canvas({ tolerance: isTouchDevice ? 22 : 3 });

        const map = L.map('map', {
            zoomControl: true,
            maxZoom: 18,
            renderer: minRenderer
        }).setView([69.65, 18.95], 9);

        if (isTouchDevice) {
            map.zoomControl.setPosition('topleft');
        }

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO &copy; Entur &copy; Kystverket',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        document.getElementById('btn-reset').addEventListener('click', function() {
            map.setView([69.65, 18.95], 9);
        });

        function updateCanvasPosition(c, ctx, active) {
            if (!active) return;
            const b = map.getBounds(), size = map.getSize(), tl = map.latLngToLayerPoint(b.getNorthWest());
            c.style.left = tl.x + 'px'; 
            c.style.top = tl.y + 'px';
            c.width = size.x; 
            c.height = size.y;
        }

        /* ==========================================================================
           FLYRADAR FUNKSJONALITET
           ========================================================================== */
        const btnFly = document.getElementById('btn-fly');
        const flightPanel = document.getElementById('flight-panel');
        const counterEl = document.getElementById('counter');
        
        let flightsActive = false;
        let flights = {};
        let flightInterval = null;

        const flightCanvas = L.DomUtil.create('canvas', 'leaflet-zoom-animated overlay-canvas');
        map.getPanes().overlayPane.appendChild(flightCanvas);
        const flightCtx = flightCanvas.getContext('2d');
        flightCanvas.style.display = 'none';

        async function fetchFlights() {
            if (!flightsActive) return;
            const b = map.getBounds();
            const url = `https://corsproxy.io/?https://data-cloud.flightradar24.com/zones/fcgi/feed.js?bounds=${b.getNorth().toFixed(1)},${b.getSouth().toFixed(1)},${b.getWest().toFixed(1)},${b.getEast().toFixed(1)}%26faa=1%26air=1&_=${Date.now()}`;
            try {
                const res = await fetch(url);
                if (!res.ok) return;
                const data = await res.json();
                let count = 0;
                for (let id in data) {
                    if (id === "full_count" || id === "version" || id === "stats") continue;
                    if (!flights[id]) flights[id] = { history: [] };
                    flights[id].lat = data[id][1];
                    flights[id].lon = data[id][2];
                    flights[id].flight = data[id][13];
                    flights[id].callsign = data[id][16];
                    flights[id].reg = data[id][9]; 
                    flights[id].alt = data[id][4]; 
                    flights[id].origin = data[id][11];
                    flights[id].dest = data[id][12];
                    flights[id].history.push([data[id][1], data[id][2]]);
                    if (flights[id].history.length > 60) flights[id].history.shift();
                    count++;
                }
                counterEl.innerText = "Fly synlige: " + count;
            } catch(e) {}
        }

        function drawFlights() {
            if (!flightsActive) return;
            flightCtx.clearRect(0, 0, flightCanvas.width, flightCanvas.height);
            const tl = map.latLngToLayerPoint(map.getBounds().getNorthWest());
            
            const showTrails = document.getElementById('trailSwitch').checked;
            const showFlight = document.getElementById('flightNumSwitch').checked;
            const showCallsign = document.getElementById('callsignSwitch').checked;
            const showReg = document.getElementById('regSwitch').checked;
            const altMode = document.getElementById('altSlider').value;
            const showOrigin = document.getElementById('originSwitch').checked;
            const showDest = document.getElementById('destSwitch').checked;

            for (let id in flights) {
                const f = flights[id];
                const p = map.latLngToLayerPoint([f.lat, f.lon]);
                
                flightCtx.fillStyle = "#ffd700";
                flightCtx.beginPath(); 
                flightCtx.arc(p.x - tl.x, p.y - tl.y, 4, 0, Math.PI * 2); 
                flightCtx.fill();
                
                flightCtx.strokeStyle = "rgba(255, 215, 0, 0.4)";
                flightCtx.lineWidth = 2;
                flightCtx.stroke();

                let labels = [];
                if (showFlight) labels.push(f.flight);
                if (showCallsign) labels.push(f.callsign);
                if (showReg) labels.push(f.reg || "N/A");
                
                if (altMode == 1) labels.push(f.alt + "ft");
                else if (altMode == 2) labels.push(Math.round(f.alt * 0.3048) + "m");
                
                if (showOrigin && showDest) labels.push(`${f.origin || '??'} → ${f.dest || '??'}`);
                else if (showOrigin) labels.push(`${f.origin || '??'} →`);
                else if (showDest) labels.push(`→ ${f.dest || '??'}`);

                if (labels.length > 0) {
                    flightCtx.font = "11px -apple-system, sans-serif";
                    flightCtx.fillStyle = "#ffea75";
                    flightCtx.fillText(labels.join(" | "), p.x - tl.x + 9, p.y - tl.y + 4);
                }

                if (showTrails && f.history.length > 2) {
                    flightCtx.beginPath();
                    flightCtx.strokeStyle = "rgba(255, 215, 0, 0.5)";
                    flightCtx.lineWidth = 1.5;
                    const pStart = map.latLngToLayerPoint(f.history[0]);
                    flightCtx.moveTo(pStart.x - tl.x, pStart.y - tl.y);
                    for (let i = 1; i < f.history.length - 1; i++) {
                        const p = map.latLngToLayerPoint(f.history[i]);
                        const next = map.latLngToLayerPoint(f.history[i+1]);
                        flightCtx.quadraticCurveTo(p.x - tl.x, p.y - tl.y, (p.x + next.x)/2 - tl.x, (p.y + next.y)/2 - tl.y);
                    }
                    flightCtx.stroke();
                }
            }
            requestAnimationFrame(drawFlights);
        }

        function toggleFlyVisning() {
            flightsActive = !flightsActive;

            if (flightsActive) {
                btnFly.classList.add('active');
                flightPanel.classList.add('active');
                counterEl.classList.add('active');
                flightCanvas.style.display = 'block';

                updateCanvasPosition(flightCanvas, flightCtx, flightsActive);
                fetchFlights();
                flightInterval = setInterval(fetchFlights, 15000);
                drawFlights();

                map.on('move zoom', handleFlightMove);
                map.on('moveend', fetchFlights);
            } else {
                btnFly.classList.remove('active');
                flightPanel.classList.remove('active');
                counterEl.classList.remove('active');
                flightCanvas.style.display = 'none';

                if (flightInterval) clearInterval(flightInterval);
                flightCtx.clearRect(0, 0, flightCanvas.width, flightCanvas.height);
                flights = {};

                map.off('move zoom', handleFlightMove);
                map.off('moveend', fetchFlights);
            }
        }

        function handleFlightMove() {
            updateCanvasPosition(flightCanvas, flightCtx, flightsActive);
        }

        btnFly.addEventListener('click', toggleFlyVisning);

        /* ==========================================================================
           BUSSRADAR FUNKSJONALITET (ENTUR VEHICLE API / GRAPHQL)
           ========================================================================== */
        const btnBuss = document.getElementById('btn-buss');
        const busPanel = document.getElementById('bus-panel');
        const busCounterEl = document.getElementById('bus-counter');

        let busesActive = false;
        let buses = {};
        let busInterval = null;

        const busCanvas = L.DomUtil.create('canvas', 'leaflet-zoom-animated overlay-canvas');
        map.getPanes().overlayPane.appendChild(busCanvas);
        const busCtx = busCanvas.getContext('2d');
        busCanvas.style.display = 'none';

        const VEHICLE_API = 'https://api.entur.io/realtime/v2/vehicles/graphql';

        function erITromso(lat, lon) {
            return lat >= 69.55 && lat <= 69.78 && lon >= 18.80 && lon <= 19.25;
        }

        const vehicleQuery = `
            {
                vehicles {
                    vehicleId
                    delay
                    line {
                        publicCode
                        lineName
                    }
                    location {
                        latitude
                        longitude
                    }
                }
            }
        `;

        async function fetchBuses() {
            if (!busesActive) return;

            try {
                const response = await fetch(VEHICLE_API, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'ET-Client-Name': 'tromso-busskart-realtime'
                    },
                    body: JSON.stringify({ query: vehicleQuery })
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const json = await response.json();
                const vehicles = json.data?.vehicles || [];
                
                let count = 0;
                const activeIds = new Set();

                vehicles.forEach(bus => {
                    if (!bus.location || !bus.location.latitude || !bus.location.longitude) return;

                    const lat = bus.location.latitude;
                    const lon = bus.location.longitude;

                    if (erITromso(lat, lon)) {
                        const lineCode = bus.line?.publicCode || 'Buss';
                        const lineName = bus.line?.lineName || 'Troms Fylkestrafikk';
                        const vehicleId = bus.vehicleId || `${lineCode}-${lat}-${lon}`;
                        const delayMin = bus.delay ? Math.round(bus.delay / 60) : 0;

                        activeIds.add(vehicleId);

                        if (!buses[vehicleId]) buses[vehicleId] = {};

                        buses[vehicleId].lat = lat;
                        buses[vehicleId].lon = lon;
                        buses[vehicleId].line = lineCode;
                        buses[vehicleId].name = lineName;
                        buses[vehicleId].delay = delayMin;

                        count++;
                    }
                });

                for (let id in buses) {
                    if (!activeIds.has(id)) {
                        delete buses[id];
                    }
                }

                busCounterEl.innerText = "Busser synlige: " + count;
            } catch(e) {
                console.error("Feil ved henting av bussdata:", e);
                busCounterEl.innerText = "Tilkoblingsfeil buss";
            }
        }

        function drawBuses() {
            if (!busesActive) return;
            busCtx.clearRect(0, 0, busCanvas.width, busCanvas.height);
            const tl = map.latLngToLayerPoint(map.getBounds().getNorthWest());
            
            const showLine = document.getElementById('busLineSwitch').checked;
            const showDest = document.getElementById('busDestSwitch').checked;
            const showDelay = document.getElementById('busDelaySwitch').checked;

            for (let id in buses) {
                const b = buses[id];
                const p = map.latLngToLayerPoint([b.lat, b.lon]);
                
                busCtx.fillStyle = "#ef4444";
                busCtx.beginPath(); 
                busCtx.arc(p.x - tl.x, p.y - tl.y, 4, 0, Math.PI * 2); 
                busCtx.fill();
                
                busCtx.strokeStyle = "rgba(239, 68, 68, 0.4)";
                busCtx.lineWidth = 2;
                busCtx.stroke();

                let labels = [];
                if (showLine) labels.push(b.line);
                if (showDest && b.name) labels.push(b.name);
                if (showDelay && b.delay !== 0) {
                    const delayTxt = b.delay > 0 ? `+${b.delay}m` : `${b.delay}m`;
                    labels.push(delayTxt);
                }

                if (labels.length > 0) {
                    busCtx.font = "11px -apple-system, sans-serif";
                    busCtx.fillStyle = "#fca5a5";
                    busCtx.fillText(labels.join(" | "), p.x - tl.x + 9, p.y - tl.y + 4);
                }
            }
            requestAnimationFrame(drawBuses);
        }

        function toggleBussVisning() {
            busesActive = !busesActive;

            if (busesActive) {
                btnBuss.classList.add('active');
                busPanel.classList.add('active');
                busCounterEl.classList.add('active');
                busCounterEl.innerText = "Busser: Laster...";
                busCanvas.style.display = 'block';

                updateCanvasPosition(busCanvas, busCtx, busesActive);
                fetchBuses();
                busInterval = setInterval(fetchBuses, 5000);
                drawBuses();

                map.on('move zoom', handleBusMove);
            } else {
                btnBuss.classList.remove('active');
                busPanel.classList.remove('active');
                busCounterEl.classList.remove('active');
                busCanvas.style.display = 'none';

                if (busInterval) clearInterval(busInterval);
                busCtx.clearRect(0, 0, busCanvas.width, busCanvas.height);
                buses = {};

                map.off('move zoom', handleBusMove);
            }
        }

        function handleBusMove() {
            updateCanvasPosition(busCanvas, busCtx, busesActive);
        }

        btnBuss.addEventListener('click', toggleBussVisning);

        /* ==========================================================================
           BÅTRADAR FUNKSJONALITET (KYSTVERKET / AIS OPEN DATA)
           ========================================================================== */
        const btnBaat = document.getElementById('btn-baat');
        const boatPanel = document.getElementById('boat-panel');
        const boatCounterEl = document.getElementById('boat-counter');

        let boatsActive = false;
        let boats = {};
        let boatInterval = null;

        const boatCanvas = L.DomUtil.create('canvas', 'leaflet-zoom-animated overlay-canvas');
        map.getPanes().overlayPane.appendChild(boatCanvas);
        const boatCtx = boatCanvas.getContext('2d');
        boatCanvas.style.display = 'none';

        async function fetchBoats() {
            if (!boatsActive) return;
            const b = map.getBounds();
            // Bruker Kystverkets åpne AIS-feed via CORS-proxy som gir pålitelige live posisjoner i norske farvann
            const url = `https://corsproxy.io/?https%3A%2F%2Fwww.kystverket.no%2Fapi%2Fv1%2Fais%2Fpositions%3Fxmin%3D${b.getWest().toFixed(4)}%26ymin%3D${b.getSouth().toFixed(4)}%26xmax%3D${b.getEast().toFixed(4)}%26ymax%3D${b.getNorth().toFixed(4)}`;
            try {
                const res = await fetch(url);
                if (!res.ok) {
                    // Fallback til generell åpen AIS-strøm hvis kystverket-endpoint krever spesiell sesjon
                    throw new Error("Prøver alternativ");
                }
                const data = await res.json();
                let count = 0;
                const activeIds = new Set();

                (Array.isArray(data) ? data : (data.features || data.sok || [])) .forEach(item => {
                    const id = item.mmsi || item.MMSI || item.id;
                    if (!id) return;
                    activeIds.add(id);

                    if (!boats[id]) boats[id] = {};
                    boats[id].lat = item.lat || item.latitude || (item.geometry && item.geometry.coordinates[1]);
                    boats[id].lon = item.lon || item.longitude || (item.geometry && item.geometry.coordinates[0]);
                    boats[id].name = item.name || item.shipname || item.callsign || 'Ukjent fartøy';
                    boats[id].mmsi = id;
                    boats[id].speed = (item.sog || item.speed || 0) + ' kn';

                    count++;
                });

                for (let id in boats) {
                    if (!activeIds.has(id)) delete boats[id];
                }

                boatCounterEl.innerText = "Båter synlige: " + count;
            } catch(e) {
                // Alternativ stabil åpen AIS stream for nordiske farvann
                try {
                    const altRes = await fetch(`https://corsproxy.io/?https://AIS.barentswatch.no/v1/geodata/fishmoving/geojson`);
                    if (altRes.ok) {
                        const altData = await altRes.json();
                        let count = 0;
                        const activeIds = new Set();
                        (altData.features || []).forEach(f => {
                            const coords = f.geometry?.coordinates;
                            const props = f.properties || {};
                            if (!coords) return;
                            const id = props.mmsi || props.name;
                            activeIds.add(id);
                            if (!boats[id]) boats[id] = {};
                            boats[id].lat = coords[1];
                            boats[id].lon = coords[0];
                            boats[id].name = props.name || 'Fartøy';
                            boats[id].mmsi = props.mmsi || 'N/A';
                            boats[id].speed = (props.speed || 0) + ' kn';
                            count++;
                        });
                        boatCounterEl.innerText = "Båter synlige: " + count;
                    }
                } catch(err) {
                    boatCounterEl.innerText = "Ingen båter i utsnitt";
                }
            }
        }

        function drawBoats() {
            if (!boatsActive) return;
            boatCtx.clearRect(0, 0, boatCanvas.width, boatCanvas.height);
            const tl = map.latLngToLayerPoint(map.getBounds().getNorthWest());
            
            const showName = document.getElementById('boatNameSwitch').checked;
            const showType = document.getElementById('boatTypeSwitch').checked;
            const showSpeed = document.getElementById('boatSpeedSwitch').checked;

            for (let id in boats) {
                const b = boats[id];
                if (!b.lat || !b.lon) continue;
                const p = map.latLngToLayerPoint([b.lat, b.lon]);
                
                boatCtx.fillStyle = "#06b6d4";
                boatCtx.beginPath(); 
                boatCtx.arc(p.x - tl.x, p.y - tl.y, 4, 0, Math.PI * 2); 
                boatCtx.fill();
                
                boatCtx.strokeStyle = "rgba(6, 182, 212, 0.4)";
                boatCtx.lineWidth = 2;
                boatCtx.stroke();

                let labels = [];
                if (showName) labels.push(b.name);
                if (showType) labels.push(`MMSI: ${b.mmsi}`);
                if (showSpeed) labels.push(b.speed);

                if (labels.length > 0) {
                    boatCtx.font = "11px -apple-system, sans-serif";
                    boatCtx.fillStyle = "#67e8f9";
                    boatCtx.fillText(labels.join(" | "), p.x - tl.x + 9, p.y - tl.y + 4);
                }
            }
            requestAnimationFrame(drawBoats);
        }

        function toggleBaatVisning() {
            boatsActive = !boatsActive;

            if (boatsActive) {
                btnBaat.classList.add('active');
                boatPanel.classList.add('active');
                boatCounterEl.classList.add('active');
                boatCounterEl.innerText = "Båter: Laster...";
                boatCanvas.style.display = 'block';

                updateCanvasPosition(boatCanvas, boatCtx, boatsActive);
                fetchBoats();
                boatInterval = setInterval(fetchBoats, 15000);
                drawBoats();

                map.on('move zoom', handleBoatMove);
            } else {
                btnBaat.classList.remove('active');
                boatPanel.classList.remove('active');
                boatCounterEl.classList.remove('active');
                boatCanvas.style.display = 'none';

                if (boatInterval) clearInterval(boatInterval);
                boatCtx.clearRect(0, 0, boatCanvas.width, boatCanvas.height);
                boats = {};

                map.off('move zoom', handleBoatMove);
            }
        }

        function handleBoatMove() {
            updateCanvasPosition(boatCanvas, boatCtx, boatsActive);
        }

        btnBaat.addEventListener('click', toggleBaatVisning);

        /* ==========================================================================
           FELLES KLIKK-HÅNDTERING FOR POPUPS (FLY, BUSS, BÅT)
           ========================================================================== */
        map.on('click', function(e) {
            const clickPoint = map.latLngToContainerPoint(e.latlng);
            const tl = map.latLngToLayerPoint(map.getBounds().getNorthWest());

            // 1. Båter
            if (boatsActive) {
                let clickedBoat = null;
                let minDist = 20;

                for (let id in boats) {
                    const b = boats[id];
                    if (!b.lat || !b.lon) continue;
                    const p = map.latLngToLayerPoint([b.lat, b.lon]);
                    const dist = Math.hypot(clickPoint.x - (p.x - tl.x), clickPoint.y - (p.y - tl.y));
                    if (dist < minDist) {
                        minDist = dist;
                        clickedBoat = b;
                    }
                }

                if (clickedBoat) {
                    L.popup({ offset: [0, -5], className: 'boat-popup' })
                        .setLatLng([clickedBoat.lat, clickedBoat.lon])
                        .setContent(`
                            <b style="font-size:14px; color:#fff;">${clickedBoat.name}</b><br>
                            <span style="font-size:12px; color:#aaa;">MMSI: ${clickedBoat.mmsi}</span><br>
                            Fart: ${clickedBoat.speed}
                        `)
                        .openOn(map);
                    return;
                }
            }

            // 2. Busser
            if (busesActive) {
                let clickedBus = null;
                let minDist = 20;

                for (let id in buses) {
                    const b = buses[id];
                    const p = map.latLngToLayerPoint([b.lat, b.lon]);
                    const dist = Math.hypot(clickPoint.x - (p.x - tl.x), clickPoint.y - (p.y - tl.y));
                    if (dist < minDist) {
                        minDist = dist;
                        clickedBus = b;
                    }
                }

                if (clickedBus) {
                    const delayText = clickedBus.delay !== 0 ? 
                        `<br>Forsinkelse: <span style="color:${clickedBus.delay > 0 ? '#ef4444' : '#34a853'}">${clickedBus.delay > 0 ? '+' + clickedBus.delay : clickedBus.delay} min</span>` : 
                        `<br>Forsinkelse: I rute`;

                    L.popup({ offset: [0, -5], className: 'bus-popup' })
                        .setLatLng([clickedBus.lat, clickedBus.lon])
                        .setContent(`
                            <b style="font-size:14px; color:#fff;">Linje ${clickedBus.line}</b><br>
                            <span style="font-size:12px; color:#aaa;">${clickedBus.name || 'Troms Fylkestrafikk'}</span>
                            ${delayText}
                        `)
                        .openOn(map);
                    return;
                }
            }

            // 3. Fly
            if (flightsActive) {
                let clickedFlight = null;
                let minDist = 20;

                for (let id in flights) {
                    const f = flights[id];
                    const p = map.latLngToLayerPoint([f.lat, f.lon]);
                    const dist = Math.hypot(clickPoint.x - (p.x - tl.x), clickPoint.y - (p.y - tl.y));
                    if (dist < minDist) {
                        minDist = dist;
                        clickedFlight = f;
                    }
                }

                if (clickedFlight) {
                    const altMeters = Math.round(clickedFlight.alt * 0.3048);
                    L.popup({ offset: [0, -5], className: 'flight-popup' })
                        .setLatLng([clickedFlight.lat, clickedFlight.lon])
                        .setContent(`
                            <b style="font-size:14px; color:#fff;">Fly: ${clickedFlight.flight || 'Ukjent'}</b><br>
                            <span style="font-size:12px; color:#aaa;">Kallesignal: ${clickedFlight.callsign || 'N/A'} | Reg: ${clickedFlight.reg || 'N/A'}</span><br>
                            Høyde: ${clickedFlight.alt} ft (${altMeters} m)<br>
                            Rute: ${clickedFlight.origin || '??'} ➔ ${clickedFlight.dest || '??'}
                        `)
                        .openOn(map);
                    return;
                }
            }
        });
    </script>
</body>
</html>
