<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Toppturer - Oversiktskart</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #000;
            --muted: #6b6b6b;
            --map-bg: #ededeb;
            --winter-bg: #dde9f2;
            --winter-ink: #3f6f93;
            --summer-bg: #e6efd8;
            --summer-ink: #5f7f3b;
            /* Sekundviseren på et jernbaneur */
            --second-hand: #e30613;
            --stier-orange: #f59e0b;
            --poi-yellow: #eab308;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: "Jost", "Helvetica Neue", Arial, sans-serif;
            font-weight: 300;
            background: #fff;
            color: var(--ink);
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        button { font-family: inherit; }

        header {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            background: #fff;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px 16px;
            border: 1px solid var(--ink);
            border-radius: 0;
            z-index: 1000;
            min-height: 52px;
        }

        h1 {
            font-size: 26px;
            font-weight: 200;
            letter-spacing: -.02em;
            line-height: 1.1;
        }

        .nav-buttons { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 12px;
            border: 1px solid var(--ink);
            border-radius: 0;
            background: #fff;
            color: var(--ink);
            font-size: 14px;
            font-weight: 400;
            cursor: pointer;
            white-space: nowrap;
            transition: background .3s ease, color .3s ease;
        }
        .btn svg { width: 17px; height: 17px; flex: none; fill: none; stroke: currentColor; stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; }
        .btn:hover { background: var(--map-bg); }
        .btn-winter:hover { background: var(--winter-bg); }
        .btn-summer:hover { background: var(--summer-bg); }

        .btn.active, .btn.active:hover { background: var(--ink); color: #fff; }
        .btn-winter.active, .btn-winter.active:hover { background: var(--winter-ink); border-color: var(--winter-ink); }
        .btn-summer.active, .btn-summer.active:hover { background: var(--summer-ink); border-color: var(--summer-ink); }

        #map-container {
            flex: 1;
            width: 100%;
            height: 100%;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
            background: #fff;
        }

        /* Hvitt kart med svarte streker: Kartverkets gråtonekart presset mot hvitt og svart */
        .bw-tiles { filter: grayscale(1) contrast(1.6) brightness(1.08); }

        /* STATUSLINJE OG PROGRESJONSBAR */
        #loading-status {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #fff;
            padding: 8px 14px;
            border: 1px solid var(--ink);
            border-radius: 0;
            font-size: 13px;
            font-weight: 400;
            z-index: 1000;
            pointer-events: none;
            transition: opacity 0.4s ease;
            white-space: nowrap;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 7px;
            min-width: 230px;
        }

        .status-header { display: flex; align-items: center; gap: 8px; }

        .progress-bar-container {
            width: 100%;
            height: 2px;
            background: rgba(0,0,0,.12);
            overflow: hidden;
            display: none;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--second-hand);
            transition: width 0.3s ease;
        }

        .progress-bar.indeterminate {
            width: 50%;
            animation: progress-slide 1.2s infinite ease-in-out;
        }

        @keyframes progress-slide {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(200%); }
        }

        .spinner {
            width: 12px;
            height: 12px;
            border: 1px solid rgba(0,0,0,.15);
            border-top-color: var(--second-hand);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: inline-block;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        @media (prefers-reduced-motion: reduce) {
            .progress-bar.indeterminate, .spinner { animation: none; }
        }

        .panels-container {
            position: fixed;
            top: 75px;
            right: 10px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .ui-panel {
            background: #fff;
            padding: 12px 15px;
            border-radius: 0;
            border: 1px solid var(--ink);
            font-family: inherit;
            display: none;
            flex-direction: column;
            gap: 10px;
            min-width: 180px;
            pointer-events: auto;
        }

        .ui-panel.active { display: flex; }

        .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 14px; font-weight: 400; color: var(--ink); }

        .switch { position: relative; display: inline-block; width: 36px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; inset: 0; background-color: #fff; border: 1px solid var(--ink); transition: .3s; }
        .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 3px; top: 3px; background-color: var(--ink); transition: .3s; }
        input:checked + .slider { background-color: var(--ink); }
        input:checked + .slider:before { background-color: #fff; transform: translateX(16px); }

        .counter-box {
            position: fixed;
            bottom: 20px;
            left: 60px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .counter {
            background: #fff;
            padding: 6px 14px;
            border: 1px solid var(--ink);
            border-radius: 0;
            font-size: 13px;
            font-weight: 400;
            display: none;
        }
        #bus-counter.active { display: block; color: var(--ink); }

        .overlay-canvas { pointer-events: none; z-index: 450; }

        /* Leaflet-kontroller, popups og verktøytips i samme stil */
        .leaflet-bar { border: 1px solid var(--ink) !important; border-radius: 0 !important; box-shadow: none !important; }
        .leaflet-bar a, .leaflet-bar a:hover { background: #fff; color: var(--ink); border-bottom: 1px solid var(--ink); border-radius: 0 !important; font-family: inherit; font-weight: 300; }
        .leaflet-bar a:last-child { border-bottom: 0; }
        .leaflet-bar a:hover { background: var(--map-bg); }
        .leaflet-control-attribution { background: rgba(255,255,255,.85) !important; color: var(--muted); font-family: inherit; }
        .leaflet-control-attribution a { color: var(--ink); }

        .leaflet-popup-content-wrapper {
            background: #fff !important;
            color: var(--ink) !important;
            border: 1px solid var(--ink);
            border-radius: 0;
            box-shadow: none;
            font-family: inherit;
            font-weight: 400;
        }
        .leaflet-popup-tip { background: #fff !important; box-shadow: 0 0 0 1px var(--ink); }
        .leaflet-container a.leaflet-popup-close-button { color: var(--ink); }

        .leaflet-tooltip {
            background: #fff;
            color: var(--ink);
            border: 1px solid var(--ink);
            border-radius: 0;
            box-shadow: none;
            font-family: inherit;
            font-weight: 400;
        }
        .leaflet-tooltip-top:before { border-top-color: var(--ink); }

        .popup-link-btn {
            display: inline-block;
            margin-top: 8px;
            padding: 6px 12px;
            background: #fff;
            color: var(--ink) !important;
            border: 1px solid var(--ink);
            text-decoration: none;
            font-weight: 400;
            font-size: 13px;
            text-align: center;
            transition: background .3s ease;
        }
        .popup-link-btn:hover { background: var(--map-bg); }

        /* Tegnforklaring for bratthet */
        .legend {
            background: #fff;
            padding: 10px 12px;
            line-height: 1.5;
            color: var(--ink);
            border: 1px solid var(--ink);
            border-radius: 0;
            box-shadow: none;
            font-family: inherit;
            font-size: 13px;
            font-weight: 400;
            text-align: left;
        }
        .legend h4 { margin: 0 0 6px 0; font-size: 14px; font-weight: 500; }
        .legend-item { display: flex; align-items: center; margin-bottom: 3px; }
        .color-box { width: 16px; height: 16px; margin-right: 8px; border: 1px solid rgba(0,0,0,.2); }

        /* Marker område for å zoome (bare der det finnes mus) */
        .btn-marker { display: none; }
        @media (hover: hover) and (pointer: fine) { .btn-marker { display: inline-flex; } }
        #map-container.marker-modus, #map-container.marker-modus * { cursor: crosshair !important; }
        .marker-boks { position: absolute; z-index: 800; border: 1px solid var(--ink); background: rgba(0, 0, 0, .07); pointer-events: none; }
        .lagret-hoyre { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); }
        .lagret-tom { font: inherit; font-size: 12px; background: #fff; color: var(--ink); border: 1px solid var(--ink); padding: 2px 8px; cursor: pointer; }
        .lagret-tom:hover { background: var(--map-bg); }

        /* Fjelltopper: flyttbare navn med linje til toppen */
        #peaks-canvas-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 450; }
        #labels-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 500; }

        .peak-label {
            position: absolute;
            pointer-events: auto;
            cursor: move;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            display: inline-flex;
            align-items: center;
            width: fit-content;
            background: #fff;
            border: 1px solid var(--ink);
            padding: 3px 8px;
            font-size: 12px;
            font-weight: 400;
            letter-spacing: .04em;
            text-transform: uppercase;
            white-space: nowrap;
            line-height: 1.2;
            color: var(--ink);
        }
        .peak-label.no-frame { background: transparent; border-color: transparent; text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 2px #fff; }
        .peak-label .pl-ele { margin-left: 6px; color: var(--muted); }

        .pl-btn {
            position: absolute;
            top: -9px;
            width: 17px;
            height: 17px;
            display: none;
            align-items: center;
            justify-content: center;
            background: #fff;
            border: 1px solid var(--ink);
            color: var(--ink);
            font-size: 11px;
            line-height: 1;
            letter-spacing: 0;
            cursor: pointer;
        }
        .pl-btn:hover { background: var(--map-bg); }
        .pl-del { right: -9px; }
        .pl-set { right: 10px; }
        .peak-label:hover .pl-btn { display: flex; }
        @media (hover: none) { .pl-btn { display: flex; width: 22px; height: 22px; top: -11px; } .pl-del { right: -11px; } .pl-set { right: 13px; } }

        .pl-menu {
            display: none;
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            flex-direction: column;
            gap: 6px;
            min-width: 160px;
            padding: 8px;
            background: #fff;
            border: 1px solid var(--ink);
            text-transform: none;
            letter-spacing: 0;
            cursor: default;
            z-index: 5;
        }
        .pl-menu.open { display: flex; }
        .pl-menu .pl-title { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
        .pl-menu .pl-opt { padding: 5px 8px; border: 1px solid var(--ink); background: #fff; color: var(--ink); font: inherit; font-size: 13px; font-weight: 400; text-align: left; cursor: pointer; }
        .pl-menu .pl-opt:hover { background: var(--map-bg); }

        .seg { display: flex; gap: 4px; }
        .seg button { flex: 1; padding: 5px 8px; border: 1px solid var(--ink); background: #fff; color: var(--ink); font: inherit; font-size: 13px; font-weight: 400; cursor: pointer; white-space: nowrap; transition: background .3s ease, color .3s ease; }
        .seg button:hover { background: var(--map-bg); }
        .seg button.active, .seg button.active:hover { background: var(--ink); color: #fff; }
        .row.hint { font-size: 12px; font-weight: 300; color: var(--muted); }

        @media (max-width: 1000px) {
            h1 { font-size: 22px; }
        }

        @media (max-width: 600px) {
            header {
                top: auto;
                bottom: 20px;
                flex-direction: column;
                gap: 8px;
                align-items: stretch;
                min-height: auto;
            }
            h1 { font-size: 20px; text-align: center; }
            .nav-buttons { width: 100%; justify-content: center; flex-wrap: nowrap; }
            .btn { flex: 1; justify-content: center; padding: 9px 4px; }
            .btn .lbl { display: none; }
            #loading-status { bottom: auto; top: 20px; }
            .panels-container { top: 10px; right: 10px; max-width: 200px; }
            .counter-box { bottom: 120px; left: 56px; }
            .leaflet-bottom { bottom: 120px !important; }
        }
        .btn-lang .lang-code { font-size: 13px; letter-spacing: .04em; }
        @media (max-width: 600px) { .btn-lang { flex: 0 0 auto; padding: 9px 7px; } .btn-lang svg { display: none; } }
    </style>
</head>
<body>

    <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><path id="arm" d="M22 22V3.5M22 9.5l-4.3-2.5M22 9.5l4.3-2.5M22 15l-3.2-1.9M22 15l3.2-1.9M22 6.5l-1.6-2M22 6.5l1.6-2" fill="none" stroke="currentColor"/></defs></svg>

    <header>
        <h1>Toppturer</h1>
        <div class="nav-buttons">
            <button id="btn-reset" class="btn btn-reset" title="Nullstill"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5"/></svg><span class="lbl">Nullstill</span></button>
            <button id="btn-vinter" class="btn btn-winter" title="Vinter"><svg viewBox="0 0 44 44" aria-hidden="true"><use href="#arm"/><use href="#arm" transform="rotate(60 22 22)"/><use href="#arm" transform="rotate(120 22 22)"/><use href="#arm" transform="rotate(180 22 22)"/><use href="#arm" transform="rotate(240 22 22)"/><use href="#arm" transform="rotate(300 22 22)"/></svg><span class="lbl">Vinter</span></button>
            <button id="btn-sommer" class="btn btn-summer" title="Sommer"><svg viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="7"/><path d="M22 4v6M22 34v6M4 22h6M34 22h6M9.3 9.3l4.2 4.2M30.5 30.5l4.2 4.2M9.3 34.7l4.2-4.2M30.5 13.5l4.2-4.2"/></svg><span class="lbl">Sommer</span></button>
            <button id="btn-stier" class="btn btn-stier" title="Stier"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19c5 0 3-7 8-7s3-7 8-7"/></svg><span class="lbl">Stier</span></button>
            <button id="btn-poi" class="btn btn-poi" title="Severdigheter"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s6-5.5 6-10a6 6 0 1 0-12 0c0 4.5 6 10 6 10z"/><circle cx="12" cy="11" r="2"/></svg><span class="lbl">Severdigheter</span></button>
            <button id="btn-fjell" class="btn btn-fjell" title="Fjelltopper"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20L12 5l9 15z"/><path d="M8.5 13l3.5 2 3.5-2"/></svg><span class="lbl">Fjelltopper</span></button>
            <button id="btn-marker" class="btn btn-marker" title="Marker et område du vil zoome til (dra en firkant med musen)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8V3h5M16 3h5v5M21 16v5h-5M8 21H3v-5" stroke-dasharray="0"/><circle cx="11" cy="11" r="3.5"/><path d="M13.6 13.6L17 17"/></svg><span class="lbl">Marker</span></button>
            <button id="btn-lagret" class="btn btn-lagret" title="Lagret data"><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/></svg><span class="lbl">Lagret</span></button>
            <button id="btn-topo" class="btn btn-topo" title="Topografi"><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="12" rx="9" ry="6"/><ellipse cx="12" cy="12" rx="5.5" ry="3.5"/><ellipse cx="12" cy="12" rx="2" ry="1.2"/></svg><span class="lbl">Topo</span></button>
            <button id="btn-bratthet" class="btn btn-bratthet" title="Bratthet"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 20l7-12 4 7 3-4 6 9z"/></svg><span class="lbl">Bratthet</span></button>
            <button id="btn-buss" class="btn btn-bus" title="Buss"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="13" rx="2"/><path d="M5 11h14M8 20v-3M16 20v-3"/></svg><span class="lbl">Buss</span></button>
            <button id="langBtn" type="button" class="btn btn-lang" title="Switch to English" aria-label="Switch to English"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg><span class="lang-code">EN</span></button>
        </div>
    </header>

    <div class="panels-container">
        <!-- FJELLTOPPER PANEL -->
        <div id="fjell-panel" class="ui-panel">
            <div class="row">Linje: <div class="seg"><button type="button" data-stil="corner" class="active">Vinkel</button><button type="button" data-stil="arc">Bue</button><button type="button" data-stil="straight">Rett</button></div></div>
            <div class="row">Ramme: <label class="switch"><input type="checkbox" id="fjellFrameSwitch" checked><span class="slider"></span></label></div>
            <div class="row hint">Dra navnene for å flytte dem</div>
        </div>

        <!-- LAGRET DATA PANEL -->
        <div id="lagret-panel" class="ui-panel">
            <div class="row hint">Lagret i nettleseren (30 dager), slik at det ikke må lastes ned på nytt</div>
            <div class="row">Stier: <span class="lagret-hoyre"><span id="lagret-n-stier">…</span><button type="button" class="lagret-tom" data-ns="stier">Tøm</button></span></div>
            <div class="row">Severdigheter: <span class="lagret-hoyre"><span id="lagret-n-poi">…</span><button type="button" class="lagret-tom" data-ns="poi">Tøm</button></span></div>
            <div class="row">Fjelltopper: <span class="lagret-hoyre"><span id="lagret-n-fjell">…</span><button type="button" class="lagret-tom" data-ns="fjell">Tøm</button></span></div>
            <div class="row">Bare lagret data: <label class="switch"><input type="checkbox" id="kunLagretSwitch"><span class="slider"></span></label></div>
            <div class="row"><button type="button" class="lagret-tom" data-ns="alle">Tøm alt</button></div>
        </div>

        <!-- BRATTHET PANEL -->
        <div id="bratthet-panel" class="ui-panel">
            <div class="row">Bratthetsskala: <label class="switch"><input type="checkbox" id="bratthetLegendSwitch"><span class="slider"></span></label></div>
        </div>

        <!-- BUSS PANEL -->
        <div id="bus-panel" class="ui-panel">
            <div class="row">Linjenr: <label class="switch"><input type="checkbox" id="busLineSwitch" checked><span class="slider"></span></label></div>
            <div class="row">Destinasjon: <label class="switch"><input type="checkbox" id="busDestSwitch"><span class="slider"></span></label></div>
            <div class="row">Forsinkelse: <label class="switch"><input type="checkbox" id="busDelaySwitch"><span class="slider"></span></label></div>
        </div>
    </div>

    <div class="counter-box">
        <div id="bus-counter" class="counter">Busser: Laster...</div>
    </div>

    <div id="map-container">
        <div id="map"></div>
        <canvas id="peaks-canvas-layer"></canvas>
        <div id="labels-layer"></div>
        <div id="loading-status">
            <div class="status-header">
                <span class="spinner" id="loading-spinner"></span>
                <span id="loading-text">Leser inn spor...</span>
            </div>
            <div class="progress-bar-container" id="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>

    <script>
        /* ===== FEILSØKING: viser på skjermen hva som skjer (fjern dette blokken når alt virker) ===== */
        (function () {
            const boks = document.createElement('div');
            boks.id = 'diag-box';
            boks.style.cssText = 'display:none;position:fixed;right:8px;bottom:40px;z-index:99999;width:min(420px,92vw);max-height:42vh;flex-direction:column;background:#fff;border:1px solid #000;font:11px/1.35 monospace;color:#000;box-shadow:0 2px 8px rgba(0,0,0,.25)';
            boks.innerHTML = '<div style="display:flex;gap:6px;padding:4px 6px;border-bottom:1px solid #000;align-items:center"><b style="flex:1">Feilsøking</b><button id="diag-test" style="font:inherit;cursor:pointer">Test tilkobling</button><button id="diag-copy" style="font:inherit;cursor:pointer">Kopier</button><button id="diag-x" style="font:inherit;cursor:pointer">×</button></div><div id="diag-log" style="overflow:auto;padding:4px 6px;white-space:pre-wrap;word-break:break-all"></div>';
