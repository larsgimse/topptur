<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Toppturer - Oversiktskart</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-color: #111111;
            --panel-bg: rgba(26, 26, 26, 0.9);
            --text-color: #eeeeee;
            --highlight-orange: #fc4c02;
            --winter-blue: #0ea5e9;
            --summer-green: #34a853;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            height: 100dvh; 
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            background: var(--panel-bg);
            padding: 10px 14px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            border: 1px solid #222;
            border-radius: 8px;
            z-index: 1000;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            min-height: 52px;
        }

        h1 { 
            font-size: 1.1rem; 
            font-weight: 700; 
            letter-spacing: -0.5px; 
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
        }
        
        .nav-buttons { display: flex; gap: 6px; align-items: center; }
        
        .btn {
            padding: 6px 12px;
            border-radius: 6px;
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #333;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 500;
            transition: all 0.2s;
            cursor: pointer;
            white-space: nowrap;
        }
        
        .btn-reset {
            background: #222;
            border-color: #444;
            color: #ccc;
        }

        .btn-winter.active { background: var(--winter-blue) !important; border-color: #fff; font-weight: 700; }
        .btn-summer.active { background: var(--summer-green) !important; border-color: #fff; font-weight: 700; }

        #map-container {
            flex: 1;
            width: 100%;
            height: 100%;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
            background: var(--bg-color);
        }

        #loading-status {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(26, 26, 26, 0.95);
            padding: 8px 14px;
            border-radius: 20px;
            border: 1px solid #333;
            font-size: 0.8rem;
            z-index: 1000;
            pointer-events: none;
            transition: opacity 0.5s ease;
            white-space: nowrap;
        }

        .leaflet-popup-content-wrapper {
            background: #1a1a1a !important;
            color: #fff !important;
            border: 1px solid var(--highlight-orange);
            border-radius: 6px;
        }
        .leaflet-popup-tip {
            background: #1a1a1a !important;
        }
        .popup-link-btn {
            display: inline-block;
            margin-top: 8px;
            padding: 6px 12px;
            background: var(--highlight-orange);
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px;
            text-align: center;
        }

        @media (max-width: 600px) {
            header {
                top: auto;
                bottom: 20px;
                flex-direction: column;
                gap: 8px;
                align-items: center;
                background: rgba(20, 20, 20, 0.95);
                box-shadow: 0 4px 20px rgba(0,0,0,0.6);
                min-height: auto;
            }
            h1 { 
                position: static; 
                transform: none; 
                font-size: 0.9rem; 
                text-align: center;
            }
            .nav-buttons {
                width: 100%;
                justify-content: space-between;
            }
            .btn {
                flex: 1;
                text-align: center;
                padding: 10px 5px;
                font-size: 0.8rem;
            }
            #loading-status {
                bottom: auto;
                top: 20px;
            }
            .leaflet-bottom { bottom: 110px !important; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Toppturer</h1>
        <div class="nav-buttons">
            <button id="btn-reset" class="btn btn-reset">🔄 Nullstill</button>
            <button id="btn-vinter" class="btn btn-winter">❄️ Vinter</button>
            <button id="btn-sommer" class="btn btn-summer">☀️ Sommer</button>
        </div>
    </header>

    <div id="map-container">
        <div id="map"></div>
        <div id="loading-status">Henter sesongdatabaser...</div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>

    <script>
        const GITHUB_USER = "larsgimse"; 
        const GITHUB_REPO = "topptur"; 

        // Listene vi fyller automatisk ved å skrape nettsidene dine
        const vinterTopper = new Set();
        const sommerTopper = new Set();

        const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
        const minRenderer = L.canvas({ tolerance: isTouchDevice ? 22 : 3 });
        const map = L.map('map', { zoomControl: true, maxZoom: 18, renderer: minRenderer }).setView([69.65, 18.95], 9);

        if (isTouchDevice) map.zoomControl.setPosition('topleft');

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        const gpxOptions = {
            async: true,
            polyline_options: { color: '#ffffff', opacity: 0.4, weight: 1.4, lineCap: 'round' },
            marker_options: { startIconUrl: null, endIconUrl: null, shadowUrl: null }
        };

        let loadedCount = 0;
        let totalFiles = 0;
        const lagredeSpor = [];

        function zoomTilAktiveSpor() {
            const aktiveBounds = L.latLngBounds();
            let harAktive = false;

            lagredeSpor.forEach(item => {
                if (map.hasLayer(item.layer)) {
                    const layerBounds = item.layer.getBounds();
                    if (layerBounds.isValid()) {
                        aktiveBounds.extend(layerBounds);
                        harAktive = true;
                    }
                }
            });

            if (harAktive && aktiveBounds.isValid()) {
                map.fitBounds(aktiveBounds, { padding: isTouchDevice ? [40, 100] : [40, 40] });
            }
        }

        function sjekkFremdrift() {
            loadedCount++;
            document.getElementById('progress').textContent = loadedCount;
            if (loadedCount === totalFiles) {
                zoomTilAktiveSpor();
                const statusEl = document.getElementById('loading-status');
                statusEl.style.opacity = '0';
                setTimeout(() => statusEl.remove(), 500);
            }
        }

        // Hjelpefunksjon for å vaske filnavnet (fjerner "2026_03_27" og ".gpx", sitter igjen med "Bentsjordtinden")
        function rensFjellnavn(filnavn) {
            let navn = filnavn.replace(/\.gpx$/i, '');
            // Fjerner datoer som "2026_03_27_" eller "2026-03-27-" i starten av filen
            navn = navn.replace(/^\d{4}[_\-]\d{2}[_\-]\d{2}[_\-]?/, '');
            navn = navn.replace(/_/g, ' ').trim();
            return navn;
        }

        // Skraper vinter.html og sommer.html for å finne ut hvilke fjell som hører til hvor
        async function hentSesongTabeller() {
            try {
                // Hent og skann vintertopper
                const resVinter = await fetch('https://larsgimse.github.io/topptur/vinter.html');
                if (resVinter.ok) {
                    const htmlText = await resVinter.text();
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(htmlText, 'text/html');
                    // Antar toppene ligger i <h2>, <h3> eller i elementer med klassen .fjellnavn
                    const headings = doc.querySelectorAll('h2, h3, .topp-tittel');
                    headings.forEach(h => {
                        const tittel = h.textContent.trim().toLowerCase();
                        if (tittel) vinterTopper.add(tittel);
                    });
                }

                // Hent og skann sommertopper
                const resSommer = await fetch('https://larsgimse.github.io/topptur/sommer.html');
                if (resSommer.ok) {
                    const htmlText = await resSommer.text();
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(htmlText, 'text/html');
                    const headings = doc.querySelectorAll('h2, h3, .topp-tittel');
                    headings.forEach(h => {
                        const tittel = h.textContent.trim().toLowerCase();
                        if (tittel) sommerTopper.add(tittel);
                    });
                }
            } catch (feil) {
                console.warn("Kunne ikke hente sesongsider for automatisk kategorisering, bruker fallback:", feil);
            }

            // Start innlasting av kartspor etter at databasene er sjekket
            skannGitHubMappe();
        }

        // Henter listen over filer dynamisk fra GitHub API
        async function skannGitHubMappe() {
            const apiURL = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/gpx`;
            
            try {
                const response = await fetch(apiURL);
                if (!response.ok) throw new Error("Klarte ikke å skanne GPX-mappen på GitHub.");
                const filer = await response.json();
                
                const gpxFiler = filer.filter(f => f.name.toLowerCase().endsWith('.gpx'));
                totalFiles = gpxFiler.length;
                
                const statusEl = document.getElementById('loading-status');
                statusEl.innerHTML = `Laster GPX-spor... <span id="progress">0</span>/<span id="total">${totalFiles}</span>`;

                if (totalFiles === 0) {
                    statusEl.textContent = "Fant ingen GPX-filer i /gpx-mappen.";
                    return;
                }

                gpxFiler.forEach(file => {
                    lastInnGPX(file.name);
                });

            } catch (feil) {
                console.error("Feil ved skanning av mappe:", feil);
                document.getElementById('loading-status').textContent = "Kunne ikke skanne mappen automatisk.";
            }
        }

        function lastInnGPX(filnavn) {
            const filsti = './gpx/' + filnavn;
            const rentNavn = rensFjellnavn(filnavn);
            const søkeNavn = rentNavn.toLowerCase();

            // Automatisk kategorisering basert på de skrapte nettsidene dine
            let type = 'vinter'; // default fallback
            if (sommerTopper.has(søkeNavn) || søkeNavn.includes('sommer')) {
                type = 'sommer';
            } else if (vinterTopper.has(søkeNavn)) {
                type = 'vinter';
            }

            const info = {
                navn: rentNavn,
                type: type
            };

            const track = new L.GPX(filsti, gpxOptions);
            
            track.on('loaded', function(e) {
                const layer = e.target;
                
                lagredeSpor.push({ layer: layer, type: info.type });

                if (!isTouchDevice) {
                    layer.bindTooltip(`${info.navn}`, { sticky: true });
                    layer.on('mouseover', function() { layer.setStyle({ color: '#fc4c02', weight: 4.0, opacity: 1.0 }); layer.bringToFront(); });
                    layer.on('mouseout', function() { layer.setStyle({ color: '#ffffff', weight: 1.4, opacity: 0.4 }); });
                    layer.on('click', () => åpneTurSide(info));
                } else {
                    const url = `${info.type}.html?fjell=${encodeURIComponent(info.navn)}`;
                    layer.bindPopup(`<b style="font-size:14px; color:#fff;">${info.navn}</b><br><a href="${url}" class="popup-link-btn">Se detaljer ➔</a>`, { closeButton: false });
                }
                sjekkFremdrift();
            });

            track.on('error', function() {
                console.warn(`Feil under lasting/parsing av GPX: ${filnavn}`);
                sjekkFremdrift();
            });

            track.addTo(map);
        }

        function åpneTurSide(info) {
            window.location.href = `${info.type}.html?fjell=${encodeURIComponent(info.navn)}`;
        }

        // --- FILTRERING LOGIKK ---
        const btnVinter = document.getElementById('btn-vinter');
        const btnSommer = document.getElementById('btn-sommer');
        const btnReset = document.getElementById('btn-reset');

        function nullstillKnapper() {
            btnVinter.classList.remove('active');
            btnSommer.classList.remove('active');
        }

        btnVinter.addEventListener('click', () => {
            nullstillKnapper();
            btnVinter.classList.add('active');
            filtrerTurer('vinter');
        });

        btnSommer.addEventListener('click', () => {
            nullstillKnapper();
            btnSommer.classList.add('active');
            filtrerTurer('sommer');
        });

        btnReset.addEventListener('click', function() {
            nullstillKnapper();
            lagredeSpor.forEach(item => {
                if (!map.hasLayer(item.layer)) {
                    map.addLayer(item.layer);
                }
            });
            zoomTilAktiveSpor();
        });

        function filtrerTurer(type) {
            lagredeSpor.forEach(item => {
                if (item.type === type) {
                    if (!map.hasLayer(item.layer)) {
                        map.addLayer(item.layer);
                    }
                } else {
                    if (map.hasLayer(item.layer)) {
                        map.removeLayer(item.layer);
                    }
                }
            });
            zoomTilAktiveSpor();
        }

        // Start hele prosessen ved å først sjekke nettsidene, så skanne GPX-mappen
        hentSesongTabeller();
    </script>
</body>
</html>
