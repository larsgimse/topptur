<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Toppturer - Oversiktskart</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-color: #111111;
            --panel-bg: rgba(26, 26, 26, 0.9);
            --text-color: #eeeeee;
            --highlight-orange: #fc4c02;
            --winter-blue: #0ea5e9;
            --summer-green: #34a853;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            height: 100dvh; 
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            background: var(--panel-bg);
            padding: 10px 14px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            border: 1px solid #222;
            border-radius: 8px;
            z-index: 1000;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            min-height: 52px;
        }

        h1 { 
            font-size: 1.1rem; 
            font-weight: 700; 
            letter-spacing: -0.5px; 
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
        }
        
        .nav-buttons { display: flex; gap: 6px; align-items: center; }
        
        .btn {
            padding: 6px 12px;
            border-radius: 6px;
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #333;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 500;
            transition: all 0.2s;
            cursor: pointer;
            white-space: nowrap;
        }
        
        .btn-reset {
            background: #222;
            border-color: #444;
            color: #ccc;
        }

        .btn-winter.active { background: var(--winter-blue); border-color: #fff; font-weight: 700; }
        .btn-summer.active { background: var(--summer-green); border-color: #fff; font-weight: 700; }

        #map-container {
            flex: 1;
            width: 100%;
            height: 100%;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
            background: var(--bg-color);
        }

        #loading-status {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(26, 26, 26, 0.95);
            padding: 8px 14px;
            border-radius: 20px;
            border: 1px solid #333;
            font-size: 0.8rem;
            z-index: 1000;
            pointer-events: none;
            transition: opacity 0.5s ease;
            white-space: nowrap;
        }

        .leaflet-popup-content-wrapper {
            background: #1a1a1a !important;
            color: #fff !important;
            border: 1px solid var(--highlight-orange);
            border-radius: 6px;
        }
        .leaflet-popup-tip {
            background: #1a1a1a !important;
        }
        .popup-link-btn {
            display: inline-block;
            margin-top: 8px;
            padding: 6px 12px;
            background: var(--highlight-orange);
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px;
            text-align: center;
        }

        @media (max-width: 600px) {
            header {
                top: auto;
                bottom: 20px;
                flex-direction: column;
                gap: 8px;
                align-items: center;
                background: rgba(20, 20, 20, 0.95);
                box-shadow: 0 4px 20px rgba(0,0,0,0.6);
                min-height: auto;
            }
            h1 { 
                position: static; 
                transform: none; 
                font-size: 0.9rem; 
                text-align: center;
            }
            .nav-buttons {
                width: 100%;
                justify-content: space-between;
            }
            .btn {
                flex: 1;
                text-align: center;
                padding: 10px 5px;
                font-size: 0.8rem;
            }
            #loading-status {
                bottom: auto;
                top: 20px;
            }
            .leaflet-bottom { bottom: 110px !important; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Toppturer</h1>
        <div class="nav-buttons">
            <button id="btn-reset" class="btn btn-reset">🔄 Nullstill</button>
            <button id="btn-vinter" class="btn btn-winter">❄️ Vinter</button>
            <button id="btn-sommer" class="btn btn-summer">☀️ Sommer</button>
        </div>
    </header>

    <div id="map-container">
        <div id="map"></div>
        <div id="loading-status">Skanner GitHub for GPX-filer... <span id="progress">0</span>/<span id="total">0</span></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>

    <script>
        // ==========================================
        //  FYLL INN DINE DETALJER FOR DIN GITHUB HER:
        // ==========================================
        const GITHUB_USER = "DITT_BRUKERNAVN"; // Erstatt med ditt brukernavn på GitHub
        const GITHUB_REPO = "DITT_REPOSITORIE"; // Erstatt med navnet på prosjekt-mappen din på GitHub

        // En tabell for å koble filnavnene dine mot fine visningsnavn og sesong (siden vi skanner råfiler)
        // Koden bruker denne listen til å gi fine navn. Filer som ikke ligger i listen får filnavnet som tittel automatisk.
        const turDatabase = {
            "2026_03_27.gpx": { navn: "884", type: "vinter" },
            "2026_04_03.gpx": { navn: "Bentsjordtinden", type: "vinter" },
            "2026_01_10.gpx": { navn: "Buren", type: "vinter" },
            "2026_03_26.gpx": { navn: "Burshammeren", type: "vinter" },
            "2025_04_22.gpx": { navn: "Fagerfjellet", type: "vinter" },
            "2025_05_25.gpx": { navn: "Gabrielfjellet", type: "vinter" },
            "2025_12_06.gpx": { navn: "Gorzelvtinden", type: "vinter" },
            "2026_04_06.gpx": { navn: "Gråtinden", type: "vinter" },
            "2024_04_28.gpx": { navn: "Klemmartindan", type: "vinter" },
            "2026_04_08.gpx": { navn: "Langfjellaksla", type: "vinter" },
            "2024_04_21.gpx": { navn: "Middagstinden", type: "vinter" },
            "2026_03_28.gpx": { navn: "Rema 1000", type: "vinter" },
            "2026_03_15.gpx": { navn: "Skittentinden", type: "vinter" },
            "2026_03_16.gpx": { navn: "Sollidalsaksla", type: "vinter" },
            "2026_03_08.gpx": { navn: "Steinskartinden", type: "vinter" },
            "2024_04_06.gpx": { navn: "Stormheimfjellet", type: "vinter" },
            "2025_05_08.gpx": { navn: "Storstolpan", type: "vinter" },
            "2024_03_26.gpx": { navn: "Stortinden", type: "vinter" },
            "2025_05_24.gpx": { navn: "Straumsaksla", type: "vinter" },
            "2026_04_05.gpx": { navn: "Svartnestinden", type: "vinter" },
            "2026_05_14.gpx": { navn: "Tromsdalstinden", type: "vinter" },
            "2023_12_29.gpx": { navn: "Tverrfjellet", type: "vinter" },
            "2025_10_06.gpx": { navn: "Buren (Sommer)", type: "sommer" },
            "2024_08_03.gpx": { navn: "Djeveltanna", type: "sommer" },
            "2025_08_03.gpx": { navn: "Djupdalgruver", type: "sommer" },
            "2025_07_14.gpx": { navn: "Hamperokken", type: "sommer" },
            "2023_05_17.gpx": { navn: "Hillesøy", type: "sommer" },
            "2025_02_28.gpx": { navn: "Kløftbakken", type: "sommer" },
            "2020_07_24.gpx": { navn: "Mjeldskartinden", type: "sommer" },
            "2025_09_25.gpx": { navn: "Orvasstinden", type: "sommer" },
            "2025_08_11.gpx": { navn: "Rødtinden", type: "sommer" },
            "2020_08_21.gpx": { navn: "Skamtinden", type: "sommer" },
            "2025_07_31.gpx": { navn: "Soria Moria traversen", type: "sommer" },
            "2023_09_24.gpx": { navn: "Steinskartinden (Sommer)", type: "sommer" },
            "2024_10_19.gpx": { navn: "Stor Blåmann", type: "sommer" },
            "2021_10_03.gpx": { navn: "Store Hollendaren", type: "sommer" },
            "2022_10_01.gpx": { navn: "Tromsdalstinden (Sommer)", type: "sommer" },
            "2021_09_19.gpx": { navn: "Vengsøytraversen", type: "sommer" }
        };

        const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
        const minRenderer = L.canvas({ tolerance: isTouchDevice ? 22 : 3 });
        const map = L.map('map', { zoomControl: true, maxZoom: 18, renderer: minRenderer }).setView([69.65, 18.95], 9);

        if (isTouchDevice) map.zoomControl.setPosition('topleft');

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        const gpxOptions = {
            async: true,
            polyline_options: { color: '#ffffff', opacity: 0.4, weight: 1.4, lineCap: 'round' },
            marker_options: { startIconUrl: null, endIconUrl: null, shadowUrl: null }
        };

        let loadedCount = 0;
        let totalFiles = 0;
        const bounds = L.latLngBounds();
        const lagredeSpor = [];

        function zoomTilAktiveSpor() {
            const aktiveBounds = L.latLngBounds();
            lagredeSpor.forEach(item => { if (map.hasLayer(item.layer)) aktiveBounds.extend(item.layer.getBounds()); });
            if (aktiveBounds.isValid()) map.fitBounds(aktiveBounds, { padding: isTouchDevice ? [40, 100] : [40, 40] });
        }

        function sjekkFremdrift() {
            loadedCount++;
            document.getElementById('progress').textContent = loadedCount;
            if (loadedCount === totalFiles) {
                zoomTilAktiveSpor();
                const statusEl = document.getElementById('loading-status');
                statusEl.style.opacity = '0';
                setTimeout(() => statusEl.remove(), 500);
            }
        }

        // Henter listen over filer dynamisk fra GitHub API
        async function skannGitHubMappe() {
            const apiURL = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/gpx`;
            
            try {
                const response = await fetch(apiURL);
                if (!response.ok) throw new Error("Klarte ikke å hente fillisten fra GitHub Pages API");
                const filer = await response.json();
                
                // Filtrer ut bare .gpx-filer
                const gpxFiler = filer.filter(f => f.name.toLowerCase().endsWith('.gpx'));
                totalFiles = gpxFiler.length;
                document.getElementById('total').textContent = totalFiles;
                document.getElementById('loading-status').innerHTML = `Laster GPX-spor... <span id="progress">0</span>/<span id="total">${totalFiles}</span>`;

                if (totalFiles === 0) {
                    document.getElementById('loading-status').textContent = "Ingen GPX-filer funnet i mappen.";
                    return;
                }

                gpxFiler.forEach(file => {
                    lastInnGPX(file.name);
                });

            } catch (feil) {
                console.error("Feil ved skanning av GitHub-mappe:", feil);
                document.getElementById('loading-status').textContent = "Kunne ikke hente filer automatisk. Sjekk brukernavn og repo-navn i koden.";
            }
        }

        function lastInnGPX(filnavn) {
            const filsti = './gpx/' + filnavn;
            
            // Sjekk om filen er registrert i databasen vår, hvis ikke lager vi et generisk objekt
            const info = turDatabase[filnavn] || { 
                navn: filnavn.replace('.gpx', '').replace(/_/g, ' '), // Gjør "2026_03_27" til "2026 03 27"
                type: 'vinter' // Standard fall-back-type
            };

            const track = new L.GPX(filsti, gpxOptions);
            
            track.on('loaded', function(e) {
                const layer = e.target;
                lagredeSpor.push({ layer: layer, type: info.type });
                if (layer.getBounds().isValid()) bounds.extend(layer.getBounds());

                if (!isTouchDevice) {
                    layer.bindTooltip(`${info.navn}`, { sticky: true });
                    layer.on('mouseover', function() { layer.setStyle({ color: '#fc4c02', weight: 4.0, opacity: 1.0 }); layer.bringToFront(); });
                    layer.on('mouseout', function() { layer.setStyle({ color: '#ffffff', weight: 1.4, opacity: 0.4 }); });
                    layer.on('click', () => åpneTurSide(info));
                } else {
                    const url = `${info.type === "sommer" ? "sommer.html" : "vinter.html"}?fjell=${encodeURIComponent(info.navn.replace(" (Sommer)", ""))}`;
                    layer.bindPopup(`<b style="font-size:14px; color:#fff;">${info.navn}</b><br><a href="${url}" class="popup-link-btn">Se detaljer ➔</a>`, { closeButton: false });
                }
                sjekkFremdrift();
            });

            track.on('error', function() {
                console.warn(`Feil under parsing av: ${filnavn}`);
                sjekkFremdrift();
            });

            track.addTo(map);
        }

        function åpneTurSide(info) {
            window.location.href = `${info.type === "sommer" ? "sommer.html" : "vinter.html"}?fjell=${encodeURIComponent(info.navn.replace(" (Sommer)", ""))}`;
        }

        document.getElementById('btn-vinter').addEventListener('click', () => filtrerTurer('vinter'));
        document.getElementById('btn-sommer').addEventListener('click', () => filtrerTurer('sommer'));
        document.getElementById('btn-reset').addEventListener('click', function() {
            lagredeSpor.forEach(item => { if (!map.hasLayer(item.layer)) map.addLayer(item.layer); });
            zoomTilAktiveSpor();
        });

        function filtrerTurer(type) {
            lagredeSpor.forEach(item => { item.type === type ? map.addLayer(item.layer) : map.removeLayer(item.layer); });
            zoomTilAktiveSpor();
        }

        // Start skanningen av GitHub-mappen automatisk når siden åpnes
        skannGitHubMappe();
    </script>
</body>
</html>
