        const OVERPASS_SERVERE = [
            'https://overpass-api.de/api/interpreter',
            'https://overpass.private.coffee/api/interpreter',
            'https://overpass.kumi.systems/api/interpreter'
        ];

        const OVERPASS_VENTETID_FOR_NESTE = 12000;   // start neste server først hvis forrige ikke har svart på 12 s

        async function overpassHent(query, klientTimeoutMs = 90000, signal = null, info = null) {
            // Spør én server. Er den treg (12 s) eller feiler den, startes neste. Første gyldige svar vinner.
            // Dette skåner serverne i stedet for å spørre alle samtidig.
            if (signal && signal.aborted) throw new DOMException('Avbrutt', 'AbortError');
            const samlet = new AbortController();
            const ytre = () => samlet.abort();
            if (signal) signal.addEventListener('abort', ytre, { once: true });

            const kjor = async url => {
                const host = new URL(url).hostname;
                if (window.diagLogg) window.diagLogg('overpass: spør ' + host);
                const c = new AbortController();
                const timer = setTimeout(() => { if (window.diagLogg) window.diagLogg('overpass: ' + host + ' ingen svar etter ' + (klientTimeoutMs / 1000) + ' s', true); c.abort(); }, klientTimeoutMs);
                const videre = () => c.abort();
                samlet.signal.addEventListener('abort', videre, { once: true });
                try {
                    const res = await fetch(url + '?data=' + encodeURIComponent(query), { signal: c.signal });
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    const json = await res.json();
                    if (json.remark && /error|timed out|out of memory/i.test(json.remark) && !(json.elements && json.elements.length)) {
                        throw new Error('tidsavbrudd på serveren');
                    }
                    if (window.diagLogg) window.diagLogg('overpass: ' + host + ' ga ' + (json.elements ? json.elements.length : 0) + ' elementer');
                    if (info) info(host, null);
                    return json;
                } catch (e) {
                    throw new Error(host + ': ' + (e.name === 'AbortError' ? 'tidsavbrudd' : e.message));
                } finally {
                    clearTimeout(timer);
                    samlet.signal.removeEventListener('abort', videre);
                }
            };

            try {
                return await new Promise((resolve, reject) => {
                    let neste = 0, feilet = 0, ferdig = false, hedge = null;
                    const feil = [];
                    const avslutt = () => { ferdig = true; clearTimeout(hedge); };
                    const start = () => {
                        clearTimeout(hedge);
                        if (ferdig || neste >= OVERPASS_SERVERE.length) return;
                        const url = OVERPASS_SERVERE[neste++];
                        kjor(url).then(
                            json => { if (ferdig) return; avslutt(); resolve(json); },
                            e => {
                                feil.push(e.message); feilet++;
                                if (ferdig) return;
                                if (feilet >= OVERPASS_SERVERE.length) { avslutt(); reject(new Error('Overpass svarer ikke (' + feil.join('; ') + ')')); }
                                else start();       // feilet: prøv neste med en gang
                            });
                        if (neste < OVERPASS_SERVERE.length) hedge = setTimeout(start, OVERPASS_VENTETID_FOR_NESTE);
                    };
                    samlet.signal.addEventListener('abort', () => { if (!ferdig) { avslutt(); reject(new DOMException('Avbrutt', 'AbortError')); } }, { once: true });
                    start();
                });
            } finally {
                samlet.abort();   // stopp de som ikke vant
                if (signal) signal.removeEventListener('abort', ytre);
            }
        }

        /* ==========================================================================
           FELLES: laster OSM-data bare for fliser innenfor synlig kartutsnitt
           - Kartet deles i faste fliser. Bare fliser i utsnittet som ikke er lastet, hentes.
           - Ny panorering/zoom avbryter pågående henting (i stedet for å vente på den).
           - Allerede lastede fliser hentes ikke på nytt, og fliser langt unna fjernes.
           ========================================================================== */
        const FLIS_ZOOM = 12;          // fliseinndeling (ca. 10 x 5 km på Østlandet)
        const FLIS_PER_RUNDE = 4;      // maks antall fliser per Overpass-spørring
        const FLIS_N = Math.pow(2, FLIS_ZOOM);

        function flisLon(x) { return x / FLIS_N * 360 - 180; }
        function flisLat(y) { return Math.atan(Math.sinh(Math.PI * (1 - 2 * y / FLIS_N))) * 180 / Math.PI; }
        function flisXFraLon(lon) { return Math.floor((lon + 180) / 360 * FLIS_N); }
        function flisYFraLat(lat) {
            const r = lat * Math.PI / 180;
            return Math.floor((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * FLIS_N);
        }
        function flisForBounds(b) {
            const x0 = flisXFraLon(b.getWest()), x1 = flisXFraLon(b.getEast());
            const y0 = flisYFraLat(b.getNorth()), y1 = flisYFraLat(b.getSouth());
            const liste = [];
            for (let x = x0; x <= x1; x++) {
                for (let y = y0; y <= y1; y++) {
                    liste.push({
                        key: x + '/' + y, x, y,
                        s: flisLat(y + 1), w: flisLon(x), n: flisLat(y), e: flisLon(x + 1)
                    });
                }
            }
            return liste;
        }
        const bboxTekst = f => `(${f.s.toFixed(5)},${f.w.toFixed(5)},${f.n.toFixed(5)},${f.e.toFixed(5)})`;

        /* Hurtiglager i nettleseren (minne + IndexedDB, 7 dager). Overlever av/på og omlasting av siden. */
        const FlisCache = (() => {
            const mem = new Map();
            const TTL = 30 * 24 * 3600 * 1000;
            let dbPromise = null;
            function apne() {
                if (!dbPromise) dbPromise = new Promise(res => {
                    const gi = setTimeout(() => res(null), 1500);   // henger IndexedDB, bruker vi bare minnet
                    const ferdig = v => { clearTimeout(gi); res(v); };
                    try {
                        const r = indexedDB.open('oversikt-cache-v2', 1);
                        r.onupgradeneeded = () => r.result.createObjectStore('fliser');
                        r.onsuccess = () => { try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {} ferdig(r.result); };
                        r.onerror = () => ferdig(null);
                        r.onblocked = () => ferdig(null);
                    } catch (e) { ferdig(null); }
                });
                return dbPromise;
            }
            async function hent(ns, keys) {
                const ut = new Map(), rest = [], na = Date.now();
                keys.forEach(k => {
                    const m = mem.get(ns + ':' + k);
                    if (m && na - m.t < TTL) ut.set(k, m.els); else rest.push(k);
                });
                if (rest.length) {
                    const fraDb = async () => {
                        const db = await apne();
                        if (!db) return;
                        await Promise.all(rest.map(k => new Promise(res => {
                            try {
                                const rq = db.transaction('fliser').objectStore('fliser').get(ns + ':' + k);
                                rq.onsuccess = () => {
                                    const v = rq.result;
                                    if (v && na - v.t < TTL) { mem.set(ns + ':' + k, v); ut.set(k, v.els); }
                                    res();
                                };
                                rq.onerror = () => res();
                            } catch (e) { res(); }
                        })));
                    };
                    // Aldri la hurtiglageret blokkere selve nedlastingen
                    await Promise.race([fraDb().catch(() => {}), new Promise(r => setTimeout(r, 1500))]);
                }
                return ut;
            }
            function lagre(ns, key, els) {
                const v = { t: Date.now(), els };
                mem.set(ns + ':' + key, v);
                apne().then(db => {
                    if (!db) return;
                    try { db.transaction('fliser', 'readwrite').objectStore('fliser').put(v, ns + ':' + key); } catch (e) {}
                });
            }
            async function antall(ns) {
                const p = ns + ':';
                const db = await apne();
                if (!db) { let n = 0; mem.forEach((v, k) => { if (k.startsWith(p)) n++; }); return n; }
                return new Promise(res => {
                    try {
                        const rq = db.transaction('fliser').objectStore('fliser').getAllKeys(IDBKeyRange.bound(p, p + '\uffff'));
                        rq.onsuccess = () => res(rq.result.length);
                        rq.onerror = () => res(0);
                    } catch (e) { res(0); }
                });
            }
            async function tom(ns) {
                const p = ns + ':';
                Array.from(mem.keys()).forEach(k => { if (k.startsWith(p)) mem.delete(k); });
                const db = await apne();
                if (!db) return;
                await new Promise(res => {
                    try {
                        const tx = db.transaction('fliser', 'readwrite');
                        tx.objectStore('fliser').delete(IDBKeyRange.bound(p, p + '\uffff'));
                        tx.oncomplete = () => res(); tx.onerror = () => res(); tx.onabort = () => res();
                    } catch (e) { res(); }
                });
            }
            return { hent, lagre, antall, tom };
        })();

        // «Bare lagret data»: ingen nedlasting, bare det som allerede er lagret i nettleseren
        let kunLagret = false;

        const sekTekst = ms => (ms / 1000).toFixed(1).replace('.', ',') + ' s';

        function lagFlisLaster(o) {
            // o: { gruppe, eier, navn, farge, minZoom, lavZoomTekst, lasterTekst, ferdigTekst,
            //      erAktiv(), bygQuery(bboxer), punkter(el), tegn(el) }
            const lastet = new Map();      // flis-nøkkel -> Set med element-id'er (det som er tegnet nå)
            const elementer = new Map();   // element-id -> { lag, fliser:Set }
            let abort = null, timer = null;

            function fjernFlis(key) {
                const ids = lastet.get(key);
                lastet.delete(key);
                if (!ids) return;
                ids.forEach(id => {
                    const e = elementer.get(id);
                    if (!e) return;
                    e.fliser.delete(key);
                    if (e.fliser.size === 0) { o.gruppe.removeLayer(e.lag); elementer.delete(id); }
                });
            }

            // Tegner innholdet til én flis (fra nett eller hurtiglager)
            function visFlis(flis, els) {
                const ids = new Set();
                els.forEach(el => {
                    const id = el.type + el.id;
                    let e = elementer.get(id);
                    if (!e) {
                        const lag = o.tegn(el);
                        if (!lag) return;
                        o.gruppe.addLayer(lag);
                        e = { lag, fliser: new Set() };
                        elementer.set(id, e);
                    }
                    e.fliser.add(flis.key);
                    ids.add(id);
                });
                lastet.set(flis.key, ids);
            }

            async function hent() {
                if (!o.erAktiv()) return;
                if (map.getZoom() < o.minZoom) {
                    if (abort) { abort.abort(); abort = null; }
                    if (o.lavZoomTekst) {
                        visStatusFor(o.eier, o.lavZoomTekst, 100, false, o.farge);
                        skjultStatus(2000);
                    }
                    return;
                }

                const b = map.getBounds();
                const synlige = flisForBounds(b);

                // Fjern fra kartet fliser som ligger langt utenfor utsnittet (de blir værende i hurtiglageret)
                const holdFast = new Set(flisForBounds(b.pad(1)).map(f => f.key));
                Array.from(lastet.keys()).forEach(k => { if (!holdFast.has(k)) fjernFlis(k); });

                const mangler = synlige.filter(f => !lastet.has(f.key));
                if (mangler.length === 0) return;

                // Nærmest sentrum først
                const c = b.getCenter();
                const sx = flisXFraLon(c.lng), sy = flisYFraLat(c.lat);
                mangler.sort((a, z) => (Math.abs(a.x - sx) + Math.abs(a.y - sy)) - (Math.abs(z.x - sx) + Math.abs(z.y - sy)));

                if (abort) abort.abort();    // ny henting avløser pågående
                const kontroll = new AbortController();
                abort = kontroll;
                const t0 = Date.now();
                let ticker = null;
                // Stopp statusoppdatering med en gang henting avbrytes (knapp av, nytt utsnitt)
                kontroll.signal.addEventListener('abort', () => clearInterval(ticker), { once: true });

                try {
                    // 1. Hurtiglager
                    visStatusFor(o.eier, `Sjekker hurtiglager for ${o.navn} (${mangler.length} fliser)...`, null, true, o.farge);
                    const lagret = await FlisCache.hent(o.eier, mangler.map(f => f.key));
                    if (kontroll.signal.aborted) return;
                    let fraLager = 0;
                    mangler.forEach(f => { if (lagret.has(f.key)) { visFlis(f, lagret.get(f.key)); fraLager++; } });
                    const nett = mangler.filter(f => !lagret.has(f.key));

                    if (nett.length === 0) {
                        visStatusFor(o.eier, `${elementer.size} ${o.navn} vist fra lagret (ingen nedlasting nødvendig)`, 100, false, o.farge);
                        skjultStatus(1800);
                        return;
                    }

                    if (kunLagret) {
                        visStatusFor(o.eier, `${elementer.size} ${o.navn} vist fra lagret · ${nett.length} fliser er ikke lagret («Bare lagret data» er på)`, 100, false, o.farge);
                        skjultStatus(3500);
                        return;
                    }

                    // 2. Nedlasting av resten (flere spørringer samtidig, lagres etter hvert som de blir ferdige)
                    let ferdige = 0, aktive = 0;
                    const vis = () => {
                        if (kontroll.signal.aborted || !o.erAktiv()) return;
                        const deler = [`${o.lasterTekst}: ${ferdige} av ${nett.length} fliser ferdig`];
                        if (aktive) deler.push(`${aktive} spørring${aktive > 1 ? 'er' : ''} venter på Overpass`);
                        if (fraLager) deler.push(`${fraLager} fra lagret`);
                        deler.push(`${elementer.size} ${o.navn} så langt`);
                        deler.push(sekTekst(Date.now() - t0));
                        visStatusFor(o.eier, deler.join(' · '), Math.round(ferdige / nett.length * 100), false, o.farge);
                    };
                    ticker = setInterval(vis, 1000);

                    const perRunde = o.perRunde || FLIS_PER_RUNDE;
                    const runder = [];
                    for (let i = 0; i < nett.length; i += perRunde) runder.push(nett.slice(i, i + perRunde));
                    let neste = 0, stoppet = false, forsteFeil = null;

                    const arbeider = async () => {
                        while (!stoppet && !kontroll.signal.aborted) {
                            const i = neste++;
                            if (i >= runder.length) return;
                            const runde = runder[i];
                            aktive++; vis();
                            let json;
                            try {
                                json = await overpassHent(o.bygQuery(runde.map(bboxTekst)), 90000, kontroll.signal);
                            } catch (e) {
                                stoppet = true; forsteFeil = forsteFeil || e; return;
                            } finally { aktive--; }
                            if (kontroll.signal.aborted || !o.erAktiv()) return;

                            const rundeNokler = new Set(runde.map(f => f.key));
                            const perFlis = new Map(runde.map(f => [f.key, []]));
                            (json.elements || []).forEach(el => {
                                const treff = new Set();
                                let sisteKey = null;
                                o.punkter(el).forEach(([lat, lon]) => {
                                    const key = flisXFraLon(lon) + '/' + flisYFraLat(lat);
                                    if (key !== sisteKey) { sisteKey = key; if (rundeNokler.has(key)) treff.add(key); }
                                });
                                if (treff.size === 0) treff.add(runde[0].key);
                                treff.forEach(k => perFlis.get(k).push(el));
                            });

                            // Lagre med en gang (overlever omlasting) og tegn
                            runde.forEach(f => {
                                const els = perFlis.get(f.key);
                                FlisCache.lagre(o.eier, f.key, els);
                                visFlis(f, els);
                            });
                            ferdige += runde.length;
                            vis();
                            if (window.oppdaterLagret) window.oppdaterLagret();
                        }
                    };
                    await Promise.all(Array.from({ length: Math.min(o.samtidig || 2, runder.length) }, arbeider));
                    if (kontroll.signal.aborted) return;
                    if (forsteFeil) throw new Error(forsteFeil.message + ' · det som er hentet er lagret, trykk igjen for å fortsette');
                    visStatusFor(o.eier,
                        `${o.ferdigTekst} ${elementer.size} ${o.navn} · ${nett.length} fliser hentet på ${sekTekst(Date.now() - t0)}` +
                        (fraLager ? `, ${fraLager} fra hurtiglager` : '') + ' · lagret i nettleseren',
                        100, false, o.farge);
                    skjultStatus(2500);
                } catch (err) {
                    if (kontroll.signal.aborted) return;
                    console.warn('Henting feilet (' + o.eier + '):', err);
                    visStatusFor(o.eier, `Feil ved henting av ${o.navn}: ` + err.message, 100, false, 'red');
                    skjultStatus(3500);
                } finally {
                    if (ticker) clearInterval(ticker);
                    if (abort === kontroll) abort = null;
                }
            }

            function planlegg(forsinkelse = 350) {
                clearTimeout(timer);
                timer = setTimeout(hent, forsinkelse);
            }
            function stopp() {
                clearTimeout(timer);
                if (abort) { abort.abort(); abort = null; }
                skjulStatusFor(o.eier);
                setTimeout(() => skjulStatusFor(o.eier), 50);   // fanger en melding som rakk å bli skrevet like etter
            }
            // Fjerner fra kartet; hurtiglageret beholdes slik at av/på ikke krever ny nedlasting
            function tom() {
                stopp();
                lastet.clear();
                elementer.clear();
                o.gruppe.clearLayers();
            }
            return { planlegg, stopp, tom };
        }

        /* ==========================================================================
           1. STIER & TRÅKK
           ========================================================================== */
        const STIER_MIN_ZOOM = 12;
        const btnStier = document.getElementById('btn-stier');
        let stierActive = false;
        const stierLayerGroup = L.layerGroup();

        function tegnSti(el) {
            if (!el.geometry || el.geometry.length < 2) return null;
            const latlngs = el.geometry.map(pt => [pt.lat, pt.lon]);
            const tags = el.tags || {};

            const stitype = tags.highway === 'path' ? 'Sti / Tråkk' : (tags.highway === 'track' ? 'Traktorvei' : 'Gangvei');
            const tittel = formaterNavn(tags, stitype);
            const underlag = tags.surface ? `<br>Underlag: <b>${tags.surface}</b>` : '';
            const vanskegrad = tags.sac_scale ? `<br>Gradering: <b>${tags.sac_scale.replace('_', ' ')}</b>` : '';
            const merking = tags.marked === 'yes' ? '<br>Merking: <b>Ja (Rød/Blå)</b>' : '';

            const line = L.polyline(latlngs, { color: '#f59e0b', weight: 1.2, opacity: 0.9 });
            line.bindPopup(`
                <div class="trail-popup">
                    <b style="font-size:14px; color:#d97706;">${tittel}</b><br>
                    <span style="font-size:12px; color:#6b6b6b;">${stitype}</span>
                    ${underlag}
                    ${vanskegrad}
                    ${merking}
                </div>
            `, { className: 'trail-popup' });
            line.on('mouseover', function() { line.setStyle({ color: '#d97706', weight: 3, opacity: 1 }); });
            line.on('mouseout', function() { line.setStyle({ color: '#f59e0b', weight: 1.2, opacity: 0.9 }); });
            return line;
        }

        const stierLaster = lagFlisLaster({
            gruppe: stierLayerGroup,
            eier: 'stier',
            navn: 'stier',
            farge: 'var(--stier-orange)',
            minZoom: STIER_MIN_ZOOM,
            lavZoomTekst: `Zoom inn nærmere (nivå ${STIER_MIN_ZOOM}) for å laste stier...`,
            lasterTekst: 'Henter stier og tråkk fra OpenStreetMap',
            ferdigTekst: 'Ferdig:',
            perRunde: 3,
            samtidig: 2,
            erAktiv: () => stierActive,
            bygQuery: bb => `[out:json][timeout:60];(${bb.map(x => `way["highway"~"^(path|footway|track)$"]${x};`).join('')});out geom qt;`,
            punkter: el => (el.geometry || []).map(p => [p.lat, p.lon]),
            tegn: tegnSti
        });
        const hentStierStreker = () => stierLaster.planlegg();

        function toggleStier() {
            stierActive = !stierActive;
            if (stierActive) {
                btnStier.classList.add('active');
                stierLayerGroup.addTo(map);
                map.on('moveend', hentStierStreker);
                if (map.getZoom() < STIER_MIN_ZOOM) {
                    visStatusFor('stier', 'Zoomer inn for å laste stier...', 100, false, 'var(--stier-orange)');
                    skjultStatus(2500);
                    map.setZoom(STIER_MIN_ZOOM);   // moveend starter lastingen
                } else {
                    stierLaster.planlegg(0);
                }
            } else {
                btnStier.classList.remove('active');
                map.off('moveend', hentStierStreker);
                stierLaster.tom();
                map.removeLayer(stierLayerGroup);
            }
        }

        btnStier.addEventListener('click', toggleStier);

        /* ==========================================================================
           2. SEVERDIGHETER & POIs
           ========================================================================== */
        const POI_MIN_ZOOM = 11;
        const btnPoi = document.getElementById('btn-poi');
        let poiActive = false;
        const poiLayerGroup = L.layerGroup();

        function tegnPoi(node) {
            if (typeof node.lat !== 'number' || typeof node.lon !== 'number') return null;
            const tags = node.tags || {};
            let poiType = "Severdighet";
            let ikon = "📍";

            if (tags.mountain_pass === "yes") { poiType = "Fjellpass / Skard"; ikon = "🏔️"; }
            else if (tags.tourism === "viewpoint") { poiType = "Utsiktspunkt"; ikon = "👁️"; }
            else if (tags.tourism === "alpine_hut" || tags.tourism === "wilderness_hut") { poiType = "Turisthytte / Koie"; ikon = "🏠"; }
            else if (tags.shelter_type || tags.amenity === "shelter") { poiType = "Gapahuk / Ly"; ikon = "⛺"; }

            const navn = tags.name || poiType;
            const hoyde = tags.ele ? `<br>Høyde: <b>${tags.ele} m.o.h.</b>` : '';

            const marker = L.circleMarker([node.lat, node.lon], {
                radius: 6, fillColor: '#eab308', color: '#000000', weight: 1.5, opacity: 1, fillOpacity: 0.9
            });
            marker.bindPopup(`
                <div class="poi-popup">
                    <b style="font-size:14px; color:#a16207;">${ikon} ${navn}</b><br>
                    <span style="font-size:12px; color:#6b6b6b;">${poiType}</span>
                    ${hoyde}
                </div>
            `, { className: 'poi-popup' });
            return marker;
        }

        const poiLaster = lagFlisLaster({
            gruppe: poiLayerGroup,
            eier: 'poi',
            navn: 'severdigheter',
            farge: 'var(--poi-yellow)',
            minZoom: POI_MIN_ZOOM,
            lavZoomTekst: null,
            lasterTekst: 'Henter fjellpass og severdigheter',
            ferdigTekst: 'Ferdig:',
            erAktiv: () => poiActive,
            bygQuery: bb => `[out:json][timeout:60];(${bb.map(x =>
                `node["mountain_pass"="yes"]${x};node["tourism"~"^(viewpoint|alpine_hut|wilderness_hut|shelter)$"]${x};node["amenity"="shelter"]${x};`
            ).join('')});out tags geom;`,
            punkter: el => (typeof el.lat === 'number' ? [[el.lat, el.lon]] : []),
            tegn: tegnPoi
        });
        const hentPoiData = () => poiLaster.planlegg();

        function togglePoi() {
            poiActive = !poiActive;
            if (poiActive) {
                btnPoi.classList.add('active');
                poiLayerGroup.addTo(map);
                poiLaster.planlegg(0);
                map.on('moveend', hentPoiData);
            } else {
                btnPoi.classList.remove('active');
                map.off('moveend', hentPoiData);
                poiLaster.tom();
                map.removeLayer(poiLayerGroup);
            }
        }

        btnPoi.addEventListener('click', togglePoi);

        /* ==========================================================================
           FJELLTOPPER (fra enkel.html): hentes fra Kartverket (stedsnavn) med OSM som reserve.
           Navnene kan dras rundt, og funksjonen krever at kartet ikke er zoomet for langt ut.
           ========================================================================== */
        const FJELL_MIN_ZOOM = 11;
        const fjellKnapp = document.getElementById('btn-fjell');
        const fjellPanel = document.getElementById('fjell-panel');
        const fjellCanvas = document.getElementById('peaks-canvas-layer');
        const fjellCtx = fjellCanvas.getContext('2d');
        const fjellLag = document.getElementById('labels-layer');
        const fjellRammeBryter = document.getElementById('fjellFrameSwitch');

        let fjellAktiv = false;
        let fjellListe = [];
        const fjellFjernet = new Set();   // toppene brukeren har slettet, så de ikke kommer tilbake ved panorering
        let fjellLinjeStil = 'corner';
        let fjellRammer = true;
        let fjellAbort = null;
        let fjellTimer = null;
        let fjellW = 0, fjellH = 0, fjellZ = 10;

        const LINJE_STILER = [
            { id: 'corner', tekst: 'Vinkel' },
            { id: 'arc', tekst: 'Bue' },
            { id: 'straight', tekst: 'Rett' }
        ];

        function fjellSynlig() { return map.getZoom() >= FJELL_MIN_ZOOM; }
        function fjellNokkel(p) { return `${p.name}|${p.lat.toFixed(3)}|${p.lon.toFixed(3)}`; }

        function fjellTilpassCanvas() {
            const boks = fjellCanvas.parentElement;
            fjellW = boks.clientWidth;
            fjellH = boks.clientHeight;
            const dpr = window.devicePixelRatio || 1;
            fjellCanvas.width = Math.round(fjellW * dpr);
            fjellCanvas.height = Math.round(fjellH * dpr);
            fjellCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
            fjellTegnLinjer();
        }

        function fjellMalpunkt(anker, x, y, w, h) {
            if (anker.x < x) return { x: x, y: y + h / 2 };
            if (anker.x > x + w) return { x: x + w, y: y + h / 2 };
            if (anker.y < y) return { x: x + w / 2, y: y };
            return { x: x + w / 2, y: y + h };
        }

        function fjellTegnLinje(anker, mal, stil) {
            fjellCtx.beginPath();
            fjellCtx.setLineDash([3, 3]);
            fjellCtx.strokeStyle = '#000000';
            fjellCtx.lineWidth = 1;
            fjellCtx.moveTo(anker.x, anker.y);
            if (stil === 'arc') {
                fjellCtx.quadraticCurveTo(anker.x + (mal.x - anker.x) * 0.8, anker.y, mal.x, mal.y);
            } else if (stil === 'straight') {
                fjellCtx.lineTo(mal.x, mal.y);
            } else {
                fjellCtx.lineTo(mal.x, anker.y);
                fjellCtx.lineTo(mal.x, mal.y);
            }
            fjellCtx.stroke();
            fjellCtx.setLineDash([]);
        }

        function fjellTegnLinjer() {
            fjellCtx.clearRect(0, 0, fjellW, fjellH);
            if (!fjellAktiv || fjellListe.length === 0 || !fjellSynlig()) return;
            fjellListe.forEach(p => {
                const anker = map.latLngToContainerPoint([p.lat, p.lon]);
                const x = anker.x + p.relX;
                const y = anker.y + p.relY;
                const mal = fjellMalpunkt(anker, x, y, p.element.offsetWidth || 50, p.element.offsetHeight || 20);
                fjellTegnLinje(anker, mal, p.customStyle || fjellLinjeStil);

                // Prikk på toppen
                fjellCtx.beginPath();
                fjellCtx.arc(anker.x, anker.y, 3.5, 0, Math.PI * 2);
                fjellCtx.fillStyle = '#000000';
                fjellCtx.fill();
                fjellCtx.lineWidth = 1.5;
                fjellCtx.strokeStyle = '#ffffff';
                fjellCtx.stroke();
            });
        }

        function fjellOppdaterPosisjoner() {
            const synlig = fjellAktiv && fjellSynlig();
            fjellLag.style.display = synlig ? '' : 'none';
            if (synlig) {
                fjellListe.forEach(p => {
                    const pt = map.latLngToContainerPoint([p.lat, p.lon]);
                    p.element.style.left = `${pt.x + p.relX}px`;
                    p.element.style.top = `${pt.y + p.relY}px`;
                });
            }
            fjellTegnLinjer();
        }

        function fjellGjorFlyttbar(el, p) {
            let drag = null;
            el.addEventListener('pointerdown', (e) => {
                if (e.target.closest('.pl-btn, .pl-menu')) return;
                drag = { x: e.clientX, y: e.clientY, relX: p.relX, relY: p.relY };
                el.style.zIndex = ++fjellZ;
                el.setPointerCapture(e.pointerId);
                e.preventDefault();
            });
            el.addEventListener('pointermove', (e) => {
                if (!drag) return;
                p.relX = drag.relX + (e.clientX - drag.x);
                p.relY = drag.relY + (e.clientY - drag.y);
                fjellOppdaterPosisjoner();
            });
            const slutt = (e) => {
                if (!drag) return;
                drag = null;
                try { el.releasePointerCapture(e.pointerId); } catch (_) {}
            };
            el.addEventListener('pointerup', slutt);
            el.addEventListener('pointercancel', slutt);
        }

        function fjellOpprett(peak, nokkel) {
            const el = document.createElement('div');
            el.className = 'peak-label' + (fjellRammer ? '' : ' no-frame');

            const navn = document.createElement('span');
            navn.textContent = peak.name;
            el.appendChild(navn);
            if (peak.elevation) {
                const hoyde = document.createElement('span');
                hoyde.className = 'pl-ele';
                hoyde.textContent = Math.round(peak.elevation) + ' m';
                el.appendChild(hoyde);
            }

            const p = { key: nokkel, navn: peak.name, lat: peak.lat, lon: peak.lon, relX: 25, relY: -20, element: el, customStyle: null };

            // Slett og innstillinger
            const slett = document.createElement('span');
            slett.className = 'pl-btn pl-del';
            slett.title = 'Fjern';
            slett.textContent = '×';
            slett.addEventListener('click', (e) => {
                e.stopPropagation();
                el.remove();
                fjellFjernet.add(nokkel);
                fjellListe = fjellListe.filter(x => x !== p);
                fjellTegnLinjer();
            });

            const innst = document.createElement('span');
            innst.className = 'pl-btn pl-set';
            innst.title = 'Innstillinger';
            innst.textContent = '⚙';

            const meny = document.createElement('div');
            meny.className = 'pl-menu';

            const rammeTittel = document.createElement('div');
            rammeTittel.className = 'pl-title';
            rammeTittel.textContent = 'Ramme';
            const rammeKnapp = document.createElement('button');
            rammeKnapp.type = 'button';
            rammeKnapp.className = 'pl-opt';
            p.oppdaterRammeTekst = () => { rammeKnapp.textContent = el.classList.contains('no-frame') ? 'Vis ramme' : 'Skjul ramme'; };
            p.oppdaterRammeTekst();
            rammeKnapp.addEventListener('click', (e) => {
                e.stopPropagation();
                el.classList.toggle('no-frame');
                p.oppdaterRammeTekst();
                meny.classList.remove('open');
            });

            const stilTittel = document.createElement('div');
            stilTittel.className = 'pl-title';
            stilTittel.textContent = 'Linje';
            const stilGruppe = document.createElement('div');
            stilGruppe.className = 'seg';
            const stilKnapper = LINJE_STILER.map(st => {
                const b = document.createElement('button');
                b.type = 'button';
                b.textContent = st.tekst;
                b.addEventListener('click', (e) => {
                    e.stopPropagation();
                    p.customStyle = st.id;
                    stilKnapper.forEach((k, i) => k.classList.toggle('active', LINJE_STILER[i].id === st.id));
                    fjellTegnLinjer();
                    meny.classList.remove('open');
                });
                stilGruppe.appendChild(b);
                return b;
            });

            meny.append(rammeTittel, rammeKnapp, stilTittel, stilGruppe);
            innst.addEventListener('click', (e) => {
                e.stopPropagation();
                const aktiv = p.customStyle || fjellLinjeStil;
                stilKnapper.forEach((k, i) => k.classList.toggle('active', LINJE_STILER[i].id === aktiv));
                document.querySelectorAll('.pl-menu.open').forEach(m => { if (m !== meny) m.classList.remove('open'); });
                meny.classList.toggle('open');
            });

            el.append(slett, innst, meny);
            fjellLag.appendChild(el);
            fjellListe.push(p);
            fjellGjorFlyttbar(el, p);
        }

        document.addEventListener('click', () => {
            document.querySelectorAll('.pl-menu.open').forEach(m => m.classList.remove('open'));
        });

        // Legger bare til topper som ikke finnes fra før, slik at flyttede navn blir stående
        function fjellLeggTil(liste) {
            let nye = 0;
            liste.forEach(peak => {
                const nokkel = fjellNokkel(peak);
                if (fjellFjernet.has(nokkel) || fjellListe.some(x => x.key === nokkel)) return;
                // Samme topp fra både Kartverket og OSM (litt ulike koordinater)
                if (fjellListe.some(x => x.navn === peak.name
                    && Math.abs(x.lat - peak.lat) < 0.01 && Math.abs(x.lon - peak.lon) < 0.02)) return;
                fjellOpprett(peak, nokkel);
                nye++;
            });
            fjellOppdaterPosisjoner();
            return nye;
        }

        // ---- Fra index-2 (fungerer der): enkel henting uten ekstra filtrering ----
        function parseKartverketGeonorge(data) {
            if (!data || !data.navn) return [];
            return data.navn.map(item => ({
                name: item.stedsnavn?.[0]?.skrivemåte || item.stedsnavn,
                lat: item.representasjonspunkt?.nord,
                lon: item.representasjonspunkt?.øst,
                elevation: item.meterOverHavet || item.stedsnavn?.[0]?.meterOverHavet
            })).filter(p => typeof p.name === 'string' && p.name && p.lat && p.lon)
               .map(p => ({ ...p, lat: Number(p.lat), lon: Number(p.lon) }));
        }

        function parseOverpass(data) {
            if (!data || !data.elements) return [];
            return data.elements
                .filter(el => typeof el.lat === 'number' && typeof el.lon === 'number')
                .map(el => ({
                    name: el.tags?.name || 'Ukjent topp',
                    lat: el.lat,
                    lon: el.lon,
                    elevation: el.tags?.ele ? parseInt(el.tags.ele) : null
                }));
        }

        // Fjerner navn langt utenfor utsnittet (men ikke de brukeren har flyttet på)
        function fjellRyddUtenfor(b) {
            const ramme = b.pad(1);
            fjellListe = fjellListe.filter(p => {
                const urort = p.relX === 25 && p.relY === -20 && !p.customStyle;
                if (urort && !ramme.contains([p.lat, p.lon])) { p.element.remove(); return false; }
                return true;
            });
        }

        async function fjellHent() {
            if (!fjellAktiv || !fjellSynlig()) return;
            const kontroll = { aborted: false, abort() { this.aborted = true; } };
            if (fjellAbort) fjellAbort.abort();      // en ny henting avløser en som pågår
            fjellAbort = kontroll;
            const gammel = () => kontroll.aborted || !fjellAktiv;
            const b = map.getBounds();
            const fliser = flisForBounds(b);
            const t0 = Date.now();
            fjellRyddUtenfor(b);

            if (fliser.length > 40) {
                fjellAbort = null;
                visStatusFor('fjell', 'Zoom litt inn for å hente fjelltopper...', 100, false, 'var(--ink)');
                skjultStatus(2500);
                return;
            }

            // 1. Lagret: vises med en gang
            visStatusFor('fjell', `Sjekker lagret for fjelltopper (${fliser.length} fliser)...`, null, true, 'var(--ink)');
            let lagret;
            try { lagret = await FlisCache.hent('fjell', fliser.map(f => f.key)); } catch (_) { lagret = new Map(); }
            if (gammel()) return;
            const alle = [];
            lagret.forEach(l => alle.push(...l));
            const vistListe = liste => fjellLeggTil(liste.slice().sort((x, y) => (y.elevation || 0) - (x.elevation || 0)).slice(0, 150));
            let nye = vistListe(alle);

            const mangler = fliser.filter(f => !lagret.has(f.key));
            if (mangler.length === 0) {
                fjellAbort = null;
                visStatusFor('fjell', `${fjellListe.length} fjelltopper vist fra lagret (ingen nedlasting nødvendig)`, 100, false, 'var(--ink)');
                skjultStatus(1800);
                return;
            }
            if (kunLagret) {
                fjellAbort = null;
                visStatusFor('fjell', `${fjellListe.length} fjelltopper vist fra lagret · ${mangler.length} fliser er ikke lagret («Bare lagret data» er på)`, 100, false, 'var(--ink)');
                skjultStatus(3500);
                return;
            }

            // 2. Resten fra OpenStreetMap (Overpass kan bruke over ett minutt)
            const vis = () => { if (!gammel()) visStatusFor('fjell', `Henter fjelltopper fra OpenStreetMap: ${mangler.length} av ${fliser.length} fliser · ${sekTekst(Date.now() - t0)} (kan ta opptil ett minutt)`, null, true, 'var(--ink)'); };
            vis();
            const ticker = setInterval(vis, 1000);
            try {
                const mb = L.latLngBounds(mangler.map(f => [f.s, f.w]).concat(mangler.map(f => [f.n, f.e])));
                const q = `[out:json][timeout:60];node["natural"="peak"]["name"](${mb.getSouth().toFixed(5)},${mb.getWest().toFixed(5)},${mb.getNorth().toFixed(5)},${mb.getEast().toFixed(5)});out 3000;`;
                const hentet = parseOverpass(await overpassHent(q, 90000, null));
                // Lagres alltid (også tomme fliser), selv om du har flyttet kartet i mellomtiden
                const perFlis = new Map(mangler.map(f => [f.key, []]));
                hentet.forEach(pk => {
                    const arr = perFlis.get(flisXFraLon(pk.lon) + '/' + flisYFraLat(pk.lat));
                    if (arr) arr.push(pk);
                });
                perFlis.forEach((arr, key) => FlisCache.lagre('fjell', key, arr));
                if (window.oppdaterLagret) window.oppdaterLagret();
                if (gammel()) return;
                nye += vistListe(hentet);
                fjellAbort = null;
                visStatusFor('fjell',
                    (nye > 0 ? `${nye} nye fjelltopper lagt til` : 'Ingen nye fjelltopper her') +
                    ` · ${mangler.length} fliser hentet på ${sekTekst(Date.now() - t0)}` + (lagret.size ? `, ${lagret.size} fra lagret` : '') + ' · lagret i nettleseren',
                    100, false, 'var(--ink)');
                skjultStatus(2500);
            } catch (err) {
                if (gammel()) return;
                fjellAbort = null;
                console.error('Overpass feilet:', err);
                visStatusFor('fjell', 'Fant ikke flere fjelltopper. ' + err.message, 100, false, 'red');
                skjultStatus(6000);
            } finally {
                clearInterval(ticker);
            }
        }

        function fjellAvbrytHenting() {
            clearTimeout(fjellTimer);
            if (fjellAbort) { fjellAbort.abort(); fjellAbort = null; }
            skjulStatusFor('fjell');
        }

        function fjellSlaAv() {
            fjellAktiv = false;
            fjellAvbrytHenting();
            fjellKnapp.classList.remove('active');
            fjellPanel.classList.remove('active');
            fjellListe.forEach(p => p.element.remove());
            fjellListe = [];
            fjellFjernet.clear();
            fjellOppdaterPosisjoner();
        }

        fjellKnapp.addEventListener('click', () => {
            if (fjellAktiv) { fjellSlaAv(); return; }
            fjellAktiv = true;
            fjellKnapp.classList.add('active');
            fjellPanel.classList.add('active');
            if (!fjellSynlig()) {
                // Kartet er for langt ute: zoom inn, så hentes toppene når zoomen er ferdig (moveend)
                visStatusFor('fjell', 'Zoomer inn for å hente fjelltopper...', 100, false, 'var(--ink)');
                skjultStatus(2500);
                map.setZoom(FJELL_MIN_ZOOM);
                return;
            }
            fjellOppdaterPosisjoner();
            fjellHent();
        });

        // Linjetype og ramme for alle navn (overstyrer valg på enkeltnavn, som i enkel.html)
        fjellPanel.querySelectorAll('.seg button').forEach(knapp => {
            knapp.addEventListener('click', () => {
                fjellLinjeStil = knapp.dataset.stil;
                fjellPanel.querySelectorAll('.seg button').forEach(k => k.classList.toggle('active', k === knapp));
                fjellListe.forEach(p => { p.customStyle = null; });
                fjellTegnLinjer();
            });
        });
        fjellRammeBryter.addEventListener('change', () => {
            fjellRammer = fjellRammeBryter.checked;
            fjellListe.forEach(p => {
                p.element.classList.toggle('no-frame', !fjellRammer);
                p.oppdaterRammeTekst();
            });
        });

        map.on('move zoom', fjellOppdaterPosisjoner);
        map.on('moveend', () => {
            fjellOppdaterPosisjoner();
            if (!fjellAktiv) return;
            if (!fjellSynlig()) {
                fjellAvbrytHenting();
                visStatusFor('fjell', 'Zoom inn nærmere for å vise fjelltopper...', 100, false, 'var(--ink)');
                skjultStatus(2000);
                return;
            }
            clearTimeout(fjellTimer);
            fjellTimer = setTimeout(fjellHent, 500);
        });

        new ResizeObserver(fjellTilpassCanvas).observe(document.getElementById('map-container'));
        fjellTilpassCanvas();

        /* ==========================================================================
           MARKER OMRÅDE FOR Å ZOOME (pc): trykk «Marker», dra en firkant, kartet zoomer til den.
           Shift + dra gjør det samme uten å trykke på knappen.
           ========================================================================== */
        const btnMarker = document.getElementById('btn-marker');
        const kartBeholder = document.getElementById('map-container');
        let markerModus = false, markerStart = null, markerBoks = null;

        function markerAvbryt() {
            if (markerBoks) { markerBoks.remove(); markerBoks = null; }
            markerStart = null;
        }
        function markerSlaPa(pa) {
            markerModus = pa;
            btnMarker.classList.toggle('active', pa);
            kartBeholder.classList.toggle('marker-modus', pa);
            if (pa) {
                map.dragging.disable();
                visStatus('Dra en firkant over området du vil zoome til · Esc avbryter', 100, false, 'var(--ink)');
                skjultStatus(3500);
            } else {
                map.dragging.enable();
                markerAvbryt();
            }
        }
        function markerPunkt(e) {
            const r = map.getContainer().getBoundingClientRect();
            return {
                x: Math.min(Math.max(e.clientX - r.left, 0), r.width),
                y: Math.min(Math.max(e.clientY - r.top, 0), r.height)
            };
        }
        function markerTegn(p) {
            if (!markerBoks || !markerStart) return;
            markerBoks.style.left = Math.min(markerStart.x, p.x) + 'px';
            markerBoks.style.top = Math.min(markerStart.y, p.y) + 'px';
            markerBoks.style.width = Math.abs(p.x - markerStart.x) + 'px';
            markerBoks.style.height = Math.abs(p.y - markerStart.y) + 'px';
        }

        btnMarker.addEventListener('click', () => markerSlaPa(!markerModus));

        // Fanges før kartet og navnene, så de ikke begynner å dra mens du markerer
        kartBeholder.addEventListener('mousedown', e => {
            if (!markerModus || e.button !== 0 || e.target.closest('.leaflet-control')) return;
            e.preventDefault();
            e.stopPropagation();
            markerStart = markerPunkt(e);
            markerBoks = document.createElement('div');
            markerBoks.className = 'marker-boks';
            kartBeholder.appendChild(markerBoks);
            markerTegn(markerStart);
        }, true);
        window.addEventListener('mousemove', e => { if (markerStart) markerTegn(markerPunkt(e)); });
        window.addEventListener('mouseup', e => {
            if (!markerStart) return;
            const a = markerStart, b = markerPunkt(e);
            markerAvbryt();
            if (Math.abs(b.x - a.x) < 12 || Math.abs(b.y - a.y) < 12) return;   // for liten: prøv igjen
            const sw = map.containerPointToLatLng(L.point(Math.min(a.x, b.x), Math.max(a.y, b.y)));
            const ne = map.containerPointToLatLng(L.point(Math.max(a.x, b.x), Math.min(a.y, b.y)));
            markerSlaPa(false);
            skjultStatus(200);
            map.fitBounds(L.latLngBounds(sw, ne));
        });
        document.addEventListener('keydown', e => { if (e.key === 'Escape' && markerModus) { markerSlaPa(false); skjultStatus(200); } });

        /* ==========================================================================
           LAGRET DATA: se hva som er lagret, tøm, eller bruk bare det som er lagret
           ========================================================================== */
        const btnLagret = document.getElementById('btn-lagret');
        const lagretPanel = document.getElementById('lagret-panel');
        const LAGRET_NAVN = ['stier', 'poi', 'fjell'];

        async function oppdaterLagret() {
            for (const ns of LAGRET_NAVN) {
                let n = 0;
                try { n = await FlisCache.antall(ns); } catch (_) {}
                const el = document.getElementById('lagret-n-' + ns);
                if (el) el.textContent = n + ' fliser';
            }
        }
        window.oppdaterLagret = oppdaterLagret;

        btnLagret.addEventListener('click', () => {
            const pa = !lagretPanel.classList.contains('active');
            lagretPanel.classList.toggle('active', pa);
            btnLagret.classList.toggle('active', pa);
            if (pa) oppdaterLagret();
        });

        function lasteOmIgjen() {
            if (stierActive) stierLaster.planlegg(0);
            if (poiActive) poiLaster.planlegg(0);
            if (fjellAktiv) fjellHent();
        }

        lagretPanel.querySelectorAll('.lagret-tom').forEach(knapp => {
            knapp.addEventListener('click', async () => {
                const valg = knapp.dataset.ns === 'alle' ? LAGRET_NAVN : [knapp.dataset.ns];
                for (const ns of valg) await FlisCache.tom(ns);
                if (valg.includes('stier')) stierLaster.tom();
                if (valg.includes('poi')) poiLaster.tom();
                if (valg.includes('fjell')) {
                    fjellListe.forEach(p => p.element.remove());
                    fjellListe = [];
                    fjellFjernet.clear();
                    fjellOppdaterPosisjoner();
                }
                await oppdaterLagret();
                if (!kunLagret) lasteOmIgjen();
            });
        });

        document.getElementById('kunLagretSwitch').addEventListener('change', e => {
            kunLagret = e.target.checked;
            if (!kunLagret) lasteOmIgjen();
        });
        oppdaterLagret();

        /* ==========================================================================
           GPX INNLASTING FOR TOPPER (MED PROGRESJONSBAR)
           ========================================================================== */
        const gpxOptions = {
            async: true,
            polyline_options: {
                color: KLOKKE_RØD,
                opacity: 0.8,
                weight: 1.6,
                lineCap: 'round'
            },
            marker_options: { startIconUrl: null, endIconUrl: null, shadowUrl: null }
        };

        let loadedCount = 0;
        let totalFiles = 0;
        let isFinishedLoading = false;
        const bounds = L.latLngBounds();
        const lagredeSpor = [];

        async function hentTopper(url, type) {
            try {
                const response = await fetch(url);
                if (!response.ok) return [];
                const data = await response.json();
                return data.map(topp => ({
                    id: topp.id,
                    navn: topp.navn,
                    fil: topp.fil,
                    ekstraSpor: topp.ekstraSpor || [],
                    type: type
                }));
            } catch (error) {
                console.warn("Kunne ikke laste data fra " + url, error);
                return [];
            }
        }

        function byggSporliste(topper) {
            const sporMap = new Map();

            const leggTil = (fil, type, eier) => {
                if (!fil) return;
                if (!sporMap.has(fil)) sporMap.set(fil, { fil: fil, type: type, eiere: [] });
                const spor = sporMap.get(fil);
                if (!spor.eiere.some(e => e.id === eier.id && e.type === eier.type && e.ekstraTittel === eier.ekstraTittel)) {
                    spor.eiere.push(eier);
                }
            };

            topper.forEach(t => leggTil(t.fil, t.type, { id: t.id, navn: t.navn, type: t.type, ekstraTittel: null }));
            topper.forEach(t => {
                t.ekstraSpor.forEach(es => leggTil(es.fil, t.type, { id: t.id, navn: t.navn, type: t.type, ekstraTittel: es.tittel || null }));
            });

            return Array.from(sporMap.values());
        }

        function eierUrl(eier) {
            const målside = eier.type === "sommer" ? "sommer.html" : "vinter.html";
            return `${målside}?fjell=${encodeURIComponent(eier.id || eier.navn)}`;
        }

        function eierTittel(eier) {
            return eier.ekstraTittel ? `${eier.navn} – ${eier.ekstraTittel}` : eier.navn;
        }

        function zoomTilAktiveSpor() {
            const aktiveBounds = L.latLngBounds();
            lagredeSpor.forEach(item => {
                if (map.hasLayer(item.layer)) {
                    aktiveBounds.extend(item.layer.getBounds());
                }
            });
            if (aktiveBounds.isValid()) {
                map.fitBounds(aktiveBounds, { padding: isTouchDevice ? [40, 100] : [40, 40] });
            }
        }

        function sjekkFremdrift() {
            if (isFinishedLoading) return;
            loadedCount++;
            
            const prosent = (loadedCount / totalFiles) * 100;
            visStatus(`Laster inn spor... ${loadedCount}/${totalFiles}`, prosent, false, 'var(--second-hand)');

            if (loadedCount >= totalFiles) {
                isFinishedLoading = true;
                zoomTilAktiveSpor();
                visStatus(`Alle ${totalFiles} spor er lastet inn!`, 100, false, 'var(--second-hand)');
                skjultStatus(1500);
            }
        }

        const GPX_TIMEOUT_MS = 20000;
        const feilede = [];

        function leggTilInteraksjon(layer, topp) {
            const typeTekst = topp.type === "vinter" ? "Vintertopp" : "Sommertopp";
            const ikon = topp.type === "vinter" ? "❄" : "☀️";
            const url = eierUrl(topp.eiere[0]);

            const tooltipHtml = topp.eiere.map(e => `<b>${eierTittel(e)}</b>`).join('<br>');
            const popupHtml = topp.eiere.map(e => `
                    <b style="font-size:14px; color:#000;">${eierTittel(e)}</b><br>
                    <a href="${eierUrl(e)}" class="popup-link-btn">Se detaljer ➔</a>`).join('<br>');

            if (!isTouchDevice) {
                layer.bindTooltip(`
                    ${tooltipHtml}<br>
                    <span style="font-size:11px; color:#6b6b6b; font-weight:normal;">${ikon} ${typeTekst}</span>
                `, {
                    sticky: true,
                    className: 'track-tooltip',
                    direction: 'top',
                    offset: [0, -10]
                });

                layer.on('mouseover', function() {
                    layer.setStyle({ color: '#000000', weight: 4.0, opacity: 1.0 });
                    layer.bringToFront();
                });

                layer.on('mouseout', function() {
                    layer.setStyle(sporStil());
                    layer.closeTooltip();
                });

                layer.on('click', function() {
                    window.location.href = url;
                });
            } else {
                layer.bindPopup(`
                    ${popupHtml}<br>
                    <span style="font-size:11px; color:#6b6b6b;">${ikon} ${typeTekst}</span>
                `, { closeButton: false, offset: [0, -5], className: 'mountain-popup' });

                layer.on('popupopen', function() {
                    layer.setStyle({ color: '#000000', opacity: 1.0, weight: 3.0 });
                });
                layer.on('popupclose', function() {
                    layer.setStyle(sporStil());
                });
            }
        }

        function lastEnkeltopp(topp) {
            return new Promise((resolve) => {
                let fullført = false;
                const controller = new AbortController();

                const ferdig = (feil) => {
                    if (fullført) return;
                    fullført = true;
                    clearTimeout(timer);
                    if (feil) {
                        feilede.push(topp.fil);
                        console.warn(`GPX-spor hoppet over: gpx/${topp.fil} – ${feil}`);
                    }
                    sjekkFremdrift();
                    resolve();
                };

                const timer = setTimeout(() => {
                    controller.abort();
                    ferdig('tidsavbrudd');
                }, GPX_TIMEOUT_MS);

                (async () => {
                    try {
                        const res = await fetch('gpx/' + topp.fil, { signal: controller.signal });
                        if (!res.ok) { ferdig(`HTTP ${res.status}`); return; }

                        const tekst = (await res.text()).replace(/^\uFEFF/, '').trim();
                        if (!tekst.startsWith('<')) { ferdig('ikke gyldig XML/GPX'); return; }

                        const track = new L.GPX(tekst, gpxOptions);

                        track.on('loaded', function(e) {
                            try {
                                const layer = e.target;
                                lagredeSpor.push({ layer: layer, type: topp.type });
                                layer.setStyle(sporStil());
                                if (aktivtFilter && topp.type !== aktivtFilter) map.removeLayer(layer);

                                const gpxBounds = layer.getBounds();
                                if (gpxBounds.isValid()) bounds.extend(gpxBounds);

                                leggTilInteraksjon(layer, topp);
                                ferdig();
                            } catch (err) {
                                ferdig('feil ved oppsett: ' + err.message);
                            }
                        });

                        track.on('error', function(e) {
                            ferdig('GPX-parsing feilet' + (e && e.err ? ': ' + e.err : ''));
                        });

                        track.addTo(map);
                    } catch (err) {
                        ferdig(err.name === 'AbortError' ? 'tidsavbrudd' : err.message);
                    }
                })();
            });
        }

        async function initialiserKart() {
            visStatus("Leser inn spor...", 0, false);
            const [vinterTopper, sommerTopper] = await Promise.all([
                hentTopper('vinter_topper.json', 'vinter'),
                hentTopper('sommer_topper.json', 'sommer')
            ]);

            const alleTopper = byggSporliste([...vinterTopper, ...sommerTopper]);

            totalFiles = alleTopper.length;

            if (totalFiles === 0) {
                visStatus("Ingen spor funnet.", 100, false);
                skjultStatus(2000);
                return;
            }

            const samtidige = isTouchDevice ? 4 : 10;

            const showLine = document.getElementById('busLineSwitch').checked;
            const showDest = document.getElementById('busDestSwitch').checked;
            const showDelay = document.getElementById('busDelaySwitch').checked;

            for (let id in buses) {
                const b = buses[id];
                const p = map.latLngToLayerPoint([b.lat, b.lon]);

                for (let id in buses) {
                    const b = buses[id];
                    const p = map.latLngToLayerPoint([b.lat, b.lon]);
                    const screenX = p.x - tl.x;
                    const screenY = p.y - tl.y;

                    const dist = Math.hypot(clickPoint.x - screenX, clickPoint.y - screenY);
                    if (dist < minDist) {
                        minDist = dist;

                    }

                if (clickedBus) {
                    const delayText = clickedBus.delay !== 0 ? 
                        `<br>Forsinkelse: <span style="color:${clickedBus.delay > 0 ? '#e30613' : '#5f7f3b'}">${clickedBus.delay > 0 ? '+' + clickedBus.delay : clickedBus.delay} min</span>` :

                        .setContent(`
                            <b style="font-size:14px; color:#000;">Linje ${clickedBus.line}</b><br>
                            <span style="font-size:12px; color:#6b6b6b;">${clickedBus.name || 'Troms Fylkestrafikk'}</span>
                            ${delayText}
                        `)
                        .openOn(map);
                    return;
                }
            }
        });

        function toggleBussVisning() {
            busesActive = !busesActive;

            if (busesActive) {
                btnBuss.classList.add('active');
                busPanel.classList.add('active');
                busCounterEl.classList.add('active');
                busCounterEl.innerText = "Busser: Laster...";
                busCanvas.style.display = 'block';

                updateCanvasPosition(busCanvas, busCtx, busesActive);

        var p = n.parentNode;
        if (p && hopp[p.nodeName]) return;
        var rec = tekstMinne.get(n), cur = n.nodeValue;
        if (rec && cur === rec.en) { if (lang === 'no') n.nodeValue = rec.no; return; }
        if (lang === 'en') {
            var en = oversett(cur);
            if (en !== cur) { tekstMinne.set(n, { no: cur, en: en }); n.nodeValue = en; }
            else tekstMinne.delete(n);
        } else tekstMinne.delete(n);
    }

    function attributter(el) {
        if (!el.getAttribute) return;
        var rek = attrMinne.get(el);
        for (var i = 0; i < ATTR.length; i++) {
            var a = ATTR[i];
            if (!el.hasAttribute(a)) continue;
            var cur = el.getAttribute(a), r = rek && rek[a];
            if (r && cur === r.en) { if (lang === 'no') el.setAttribute(a, r.no); continue; }
            if (lang === 'en') {
                var en = oversett(cur);
                if (en !== cur) {
                    if (!rek) { rek = {}; attrMinne.set(el, rek); }
                    rek[a] = { no: cur, en: en };
                    el.setAttribute(a, en);
                } else if (rek) delete rek[a];
            } else if (rek) delete rek[a];
        }
    }

    function gjennom(rot) {
        if (!rot) return;
        if (rot.nodeType === 3) { tekstNode(rot); return; }
        if (rot.nodeType !== 1 && rot.nodeType !== 9 && rot.nodeType !== 11) return;
        if (rot.nodeType === 1) { if (hopp[rot.nodeName]) return; attributter(rot); }
        var tw = document.createTreeWalker(rot, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT, null);
        var n;
        while ((n = tw.nextNode())) {
            if (n.nodeType === 3) tekstNode(n); else if (!hopp[n.nodeName]) attributter(n);
        }
    }

    function start() {
        if (observer) return;
        observer = new MutationObserver(function (muts) {
            for (var i = 0; i < muts.length; i++) {
                var m = muts[i];
                if (m.type === 'characterData') tekstNode(m.target);
                else if (m.type === 'attributes') attributter(m.target);
                else for (var j = 0; j < m.addedNodes.length; j++) gjennom(m.addedNodes[j]);
            }
        });
        observer.observe(document.documentElement, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ATTR });
    }

    /* alert() og prompt() er ikke DOM, så de pakkes inn */
    var _alert = window.alert, _prompt = window.prompt;
    window.alert = function (m) { return _alert.call(window, lang === 'en' ? oversett(String(m)) : m); };
    window.prompt = function (m, d) { return _prompt.call(window, lang === 'en' ? oversett(String(m)) : m, d); };

    function oppdaterKnapp() {
        var b = document.getElementById('langBtn');
        if (!b) return;
        var kode = b.querySelector('.lang-code');
        if (kode) kode.textContent = lang === 'en' ? 'NO' : 'EN';
        b.setAttribute('aria-label', lang === 'en' ? 'Bytt til norsk' : 'Switch to English');
        b.setAttribute('title', lang === 'en' ? 'Bytt til norsk' : 'Switch to English');
    }

    function sett(nytt) {
        lang = nytt;
        try { localStorage.setItem('lang', lang); } catch (_) {}
        document.documentElement.lang = lang === 'en' ? 'en' : 'no';
        if (observer) observer.disconnect();
        gjennom(document.documentElement);
        observer = null; start();
        oppdaterKnapp();
        try { document.dispatchEvent(new CustomEvent('langchange', { detail: lang })); } catch (_) {}
    }

    window.__lang = function () { return lang; };
    window.__oversett = oversett;
    window.__setLang = sett;

    function init() {
        var b = document.getElementById('langBtn');
        if (b) b.addEventListener('click', function () { sett(lang === 'en' ? 'no' : 'en'); });
        document.documentElement.lang = lang === 'en' ? 'en' : 'no';
        if (lang === 'en') gjennom(document.documentElement);
        start();
        oppdaterKnapp();
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
    </script>
</body>
</html>
