<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Toppturer - Oversiktskart</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-color: #111111;
            --panel-bg: #1a1a1a;
            --text-color: #eeeeee;
            --highlight-orange: #fc4c02;
            --winter-blue: #0ea5e9;
            --summer-green: #34a853;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            height: 100dvh; /* Safari iPhone-fiks */
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* STANDARD DESKTOP HEADER (Ingen overlapping med zoom-knapper) */
        header {
            background: var(--panel-bg);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
            z-index: 1000;
            flex-shrink: 0;
        }

        h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.5px; }
        
        .nav-buttons { display: flex; gap: 10px; align-items: center; }
        
        .btn {
            padding: 8px 14px;
            border-radius: 6px;
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #333;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s;
            cursor: pointer;
            white-space: nowrap;
        }
        .btn:hover { background: #3a3a3a; }
        
        .btn-reset {
            background: #222;
            border-color: #444;
            color: #ccc;
        }
        .btn-reset:hover {
            background: #2d2d2d;
            border-color: var(--highlight-orange);
            color: #fff;
        }

        .btn-winter.active { background: var(--winter-blue); border-color: #fff; font-weight: 700; }
        .btn-summer.active { background: var(--summer-green); border-color: #fff; font-weight: 700; }

        #map-container {
            flex: 1;
            position: relative;
            width: 100%;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 100%;
            background: var(--bg-color);
        }

        #loading-status {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(26, 26, 26, 0.9);
            padding: 10px 15px;
            border-radius: 6px;
            border: 1px solid #333;
            font-size: 0.85rem;
            z-index: 1000;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .track-tooltip {
            background: rgba(26, 26, 26, 0.95) !important;
            border: 1px solid var(--highlight-orange) !important;
            color: #ffffff !important;
            font-weight: 700;
            font-size: 13px;
            border-radius: 4px;
            padding: 4px 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            pointer-events: none;
        }

        .leaflet-popup-content-wrapper {
            background: #1a1a1a !important;
            color: #fff !important;
            border: 1px solid var(--highlight-orange);
            border-radius: 6px;
        }
        .leaflet-popup-tip {
            background: #1a1a1a !important;
        }
        .popup-link-btn {
            display: inline-block;
            margin-top: 8px;
            padding: 6px 12px;
            background: var(--highlight-orange);
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px;
            text-align: center;
        }

        /* MOBIL-STYLING (Flyttes trygt til bunnen, unna Safari-adressefeltet) */
        @media (max-width: 600px) {
            header {
                position: absolute;
                top: auto;
                bottom: 20px;
                left: 10px;
                right: 10px;
                border: 1px solid #222;
                border-radius: 8px;
                background: rgba(20, 20, 20, 0.95);
                box-shadow: 0 4px 20px rgba(0,0,0,0.6);
                backdrop-filter: blur(8px);
                -webkit-backdrop-filter: blur(8px);
                flex-direction: column;
                gap: 8px;
                padding: 10px;
                align-items: center;
            }
            h1 { font-size: 0.9rem; }
            .nav-buttons {
                width: 100%;
                justify-content: space-between;
            }
            .btn {
                flex: 1;
                text-align: center;
                padding: 10px 5px;
                font-size: 0.8rem;
            }
            #loading-status {
                bottom: auto;
                top: 20px;
                left: 50%;
                transform: translateX(-50%);
            }
        }
    </style>
</head>
