<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Toppturer - Oversiktskart</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-color: #111111;
            --panel-bg: rgba(26, 26, 26, 0.9);
            --text-color: #eeeeee;
            --highlight-orange: #fc4c02;
            --winter-blue: #0ea5e9;
            --summer-green: #34a853;
            --trails-purple: #a855f7;
            --dnt-cyan: #06b6d4;
            --bus-red: #ef4444;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            height: 100dvh; 
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            background: var(--panel-bg);
            padding: 10px 14px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            border: 1px solid #222;
            border-radius: 8px;
            z-index: 1000;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            min-height: 52px;
        }

        h1 { 
            font-size: 1.1rem; 
            font-weight: 700; 
            letter-spacing: -0.5px; 
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
        }
        
        .nav-buttons { display: flex; gap: 6px; align-items: center; }
        
        .btn {
            padding: 6px 12px;
            border-radius: 6px;
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #333;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 500;
            transition: all 0.2s;
            cursor: pointer;
            white-space: nowrap;
        }
        
        .btn-reset {
            background: #222;
            border-color: #444;
            color: #ccc;
        }

        .btn-winter.active { background: var(--winter-blue); border-color: #fff; font-weight: 700; }
        .btn-summer.active { background: var(--summer-green); border-color: #fff; font-weight: 700; }
        .btn-stier.active { background: var(--trails-purple); border-color: #fff; font-weight: 700; color: #fff; }
        .btn-dnt.active { background: var(--dnt-cyan); border-color: #fff; font-weight: 700; color: #fff; }
        .btn-bus.active { background: #dc2626; border-color: #fff; font-weight: 700; color: #fff; }

        #map-container {
            flex: 1;
            width: 100%;
            height: 100%;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
            background: var(--bg-color);
        }

        #loading-status {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(26, 26, 26, 0.95);
            padding: 10px 18px;
            border-radius: 24px;
            border: 1px solid #333;
            font-size: 0.85rem;
            z-index: 1000;
            pointer-events: none;
            transition: opacity 0.5s ease;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255,255,255,0.2);
            border-top-color: var(--highlight-orange);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .panels-container {
            position: fixed;
            top: 75px;
            right: 10px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .ui-panel {
            background: var(--panel-bg); 
            padding: 12px 15px; 
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            border: 1px solid #333;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            font-family: inherit; 
            display: none; 
            flex-direction: column; 
            gap: 8px;
            min-width: 180px;
            pointer-events: auto;
        }
        
        .ui-panel.active { display: flex; }
        
        .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 0.8rem; color: #ddd; }
        
        .switch { position: relative; display: inline-block; width: 34px; height: 18px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #444; transition: .3s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        
        #bus-panel input:checked + .slider { background-color: #ef4444; }
        
        input:checked + .slider:before { transform: translateX(16px); }
        
        .counter-box { 
            position: fixed; 
            bottom: 20px; 
            left: 20px; 
            z-index: 10000; 
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        
        .counter { 
            background: var(--panel-bg); 
            padding: 6px 14px; 
            border-radius: 20px; 
            border: 1px solid #333;
            font-size: 0.8rem; 
            display: none;
        }
        #bus-counter.active { display: block; color: #ef4444; }

        .overlay-canvas {
            pointer-events: none;
            z-index: 450;
        }

        .leaflet-popup-content-wrapper {
            background: #1a1a1a !important;
            color: #fff !important;
            border: 1px solid var(--highlight-orange);
            border-radius: 6px;
        }
        .leaflet-popup-tip {
            background: #1a1a1a !important;
        }
        
        .bus-popup .leaflet-popup-content-wrapper {
            border-color: #ef4444 !important;
        }
        .trail-popup .leaflet-popup-content-wrapper {
            border-color: var(--trails-purple) !important;
        }

        .popup-link-btn {
            display: inline-block;
            margin-top: 8px;
            padding: 6px 12px;
            background: var(--highlight-orange);
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px;
            text-align: center;
        }

        @media (max-width: 600px) {
            header {
                top: auto;
                bottom: 20px;
                flex-direction: column;
                gap: 8px;
                align-items: center;
                background: rgba(20, 20, 20, 0.95);
                box-shadow: 0 4px 20px rgba(0,0,0,0.6);
                min-height: auto;
            }
            h1 { 
                position: static; 
                transform: none; 
                font-size: 0.9rem; 
                text-align: center;
            }
            .nav-buttons {
                width: 100%;
                justify-content: space-between;
                flex-wrap: wrap;
            }
            .btn {
                flex: 1;
                text-align: center;
                padding: 8px 4px;
                font-size: 0.75rem;
            }
            #loading-status {
                bottom: auto;
                top: 20px;
            }
            .panels-container {
                top: 10px;
                right: 10px;
                max-width: 200px;
            }
            .counter-box {
                bottom: 120px;
                left: 10px;
            }
            .leaflet-bottom { bottom: 120px !important; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Toppturer</h1>
        <div class="nav-buttons">
            <button id="btn-reset" class="btn btn-reset">🔄 Nullstill</button>
            <button id="btn-vinter" class="btn btn-winter">❄ Vinter</button>
            <button id="btn-sommer" class="btn btn-summer">☀ Sommer</button>
            <button id="btn-stier" class="btn btn-stier">🗺️ Stier</button>
            <button id="btn-dnt" class="btn btn-dnt">🥾 Turløyper</button>
            <button id="btn-buss" class="btn btn-bus">🚌 Buss</button>
        </div>
    </header>

    <div class="panels-container">
        <!-- BUSS PANEL -->
        <div id="bus-panel" class="ui-panel">
            <div class="row">Linjenr: <label class="switch"><input type="checkbox" id="busLineSwitch" checked><span class="slider"></span></label></div>
            <div class="row">Destinasjon: <label class="switch"><input type="checkbox" id="busDestSwitch"><span class="slider"></span></label></div>
            <div class="row">Forsinkelse: <label class="switch"><input type="checkbox" id="busDelaySwitch"><span class="slider"></span></label></div>
        </div>
    </div>

    <div class="counter-box">
        <div id="bus-counter" class="counter">Busser: Laster...</div>
    </div>

    <div id="map-container">
        <div id="map"></div>
        <div id="loading-status">
            <span class="spinner"></span>
            <span id="loading-text">Leser inn spor...</span>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>

    <script>
        const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
        const minRenderer = L.canvas({ tolerance: isTouchDevice ? 22 : 3 });

        const map = L.map('map', {
            zoomControl: true,
            maxZoom: 18,
            renderer: minRenderer
        }).setView([69.65, 18.95], 9);

        if (isTouchDevice) {
            map.zoomControl.setPosition('topleft');
        }

        // CARTO Basemap mørkt kart
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png?key=cb1_2o3a_1_671194bbedbad28841272141', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a> &copy; Entur',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        /* ==========================================================================
           1. STIER & TRÅKK (OPENSTREETMAP VEKTORSTREKER MED POPUP)
           ========================================================================== */
        const btnStier = document.getElementById('btn-stier');
        let stierActive = false;
        let stierLayerGroup = L.layerGroup();
        let isFetchingStier = false;

        async function hentStierStreker() {
            if (!stierActive || isFetchingStier) return;
            if (map.getZoom() < 10) return; // Begrenser henvendelse til zoom-nivå 10+ for god ytelse

            const b = map.getBounds();
            const south = b.getSouth().toFixed(3);
            const west = b.getWest().toFixed(3);
            const north = b.getNorth().toFixed(3);
            const east = b.getEast().toFixed(3);

            const overpassUrl = `https://overpass-api.de/api/interpreter?data=[out:json][timeout:10];way["highway"~"path|footway|track"](${south},${west},${north},${east});out geom tags;`;

            isFetchingStier = true;

            try {
                let res = await fetch(overpassUrl);
                if (!res.ok) {
                    res = await fetch(`https://corsproxy.io/?${encodeURIComponent(overpassUrl)}`);
                }

                if (!res.ok) throw new Error("Feil ved hente stier");

                const json = await res.json();
                stierLayerGroup.clearLayers();

                if (json && json.elements) {
                    json.elements.forEach(el => {
                        if (el.geometry && el.geometry.length > 1) {
                            const latlngs = el.geometry.map(pt => [pt.lat, pt.lon]);
                            const tags = el.tags || {};

                            const stitype = tags.highway || 'sti';
                            const navn = tags.name || tags.ref || 'Umerket sti/tråkk';
                            const underlag = tags.surface ? `<br>Underlag: ${tags.surface}` : '';
                            const vanskegrad = tags.sac_scale ? `<br>Gradering: ${tags.sac_scale}` : '';

                            const line = L.polyline(latlngs, {
                                color: '#c084fc',
                                weight: 2.2,
                                opacity: 0.75,
                                dashArray: stitype === 'path' ? '4, 4' : null
                            });

                            line.bindPopup(`
                                <div class="trail-popup">
                                    <b style="font-size:14px; color:#c084fc;">${navn}</b><br>
                                    <span style="font-size:12px; color:#aaa;">Type: ${stitype}</span>
                                    ${underlag}
                                    ${vanskegrad}
                                </div>
                            `, { className: 'trail-popup' });

                            line.on('mouseover', function() {
                                line.setStyle({ color: '#f0abfc', weight: 4, opacity: 1 });
                            });
                            line.on('mouseout', function() {
                                line.setStyle({ color: '#c084fc', weight: 2.2, opacity: 0.75 });
                            });

                            stierLayerGroup.addLayer(line);
                        }
                    });
                }

                if (stierActive && !map.hasLayer(stierLayerGroup)) {
                    stierLayerGroup.addTo(map);
                }
            } catch (err) {
                console.warn("Kunne ikke hente sti-streker:", err);
            } finally {
                isFetchingStier = false;
            }
        }

        function toggleStier() {
            stierActive = !stierActive;
            if (stierActive) {
                btnStier.classList.add('active');
                stierLayerGroup.addTo(map);
                hentStierStreker();
                map.on('moveend zoomend', hentStierStreker);
            } else {
                btnStier.classList.remove('active');
                map.off('moveend zoomend', hentStierStreker);
                map.removeLayer(stierLayerGroup);
                stierLayerGroup.clearLayers();
            }
        }

        btnStier.addEventListener('click', toggleStier);

        /* ==========================================================================
           2. TURLØYPER & DNT-RUTER (WAYMARKED TRAILS OVERLAYSTREKER)
           ========================================================================== */
        const btnDnt = document.getElementById('btn-dnt');
        let dntActive = false;

        const dntTileLayer = L.tileLayer('https://tile.waymarkedtrails.org/hiking/{z}/{x}/{y}.png', {
            maxZoom: 18,
            opacity: 0.85,
            attribution: '&copy; <a href="https://hiking.waymarkedtrails.org">Waymarked Trails</a>'
        });

        function toggleDnt() {
            dntActive = !dntActive;
            if (dntActive) {
                btnDnt.classList.add('active');
                dntTileLayer.addTo(map);
            } else {
                btnDnt.classList.remove('active');
                map.removeLayer(dntTileLayer);
            }
        }

        btnDnt.addEventListener('click', toggleDnt);

        /* ==========================================================================
           GPX INNLASTING OG MELLOMHANDLING FOR TOPPER
           ========================================================================== */
        const gpxOptions = {
            async: true,
            polyline_options: {
                color: '#ffffff',
                opacity: 0.4,
                weight: 1.4,
                lineCap: 'round'
            },
            marker_options: { startIconUrl: null, endIconUrl: null, shadowUrl: null }
        };

        let loadedCount = 0;
        let totalFiles = 0;
        let isFinishedLoading = false;
        const bounds = L.latLngBounds();
        const lagredeSpor = [];

        async function hentTopper(url, type) {
            try {
                const response = await fetch(url);
                if (!response.ok) return [];
                const data = await response.json();
                return data.map(topp => ({
                    id: topp.id,
                    navn: topp.navn,
                    fil: topp.fil,
                    ekstraSpor: topp.ekstraSpor || [],
                    type: type
                }));
            } catch (error) {
                console.warn("Kunne ikke laste data fra " + url, error);
                return [];
            }
        }

        function byggSporliste(topper) {
            const sporMap = new Map();

            const leggTil = (fil, type, eier) => {
                if (!fil) return;
                if (!sporMap.has(fil)) sporMap.set(fil, { fil: fil, type: type, eiere: [] });
                const spor = sporMap.get(fil);
                if (!spor.eiere.some(e => e.id === eier.id && e.type === eier.type && e.ekstraTittel === eier.ekstraTittel)) {
                    spor.eiere.push(eier);
                }
            };

            topper.forEach(t => leggTil(t.fil, t.type, { id: t.id, navn: t.navn, type: t.type, ekstraTittel: null }));
            topper.forEach(t => {
                t.ekstraSpor.forEach(es => leggTil(es.fil, t.type, { id: t.id, navn: t.navn, type: t.type, ekstraTittel: es.tittel || null }));
            });

            return Array.from(sporMap.values());
        }

        function eierUrl(eier) {
            const målside = eier.type === "sommer" ? "sommer.html" : "vinter.html";
            return `${målside}?fjell=${encodeURIComponent(eier.id || eier.navn)}`;
        }

        function eierTittel(eier) {
            return eier.ekstraTittel ? `${eier.navn} – ${eier.ekstraTittel}` : eier.navn;
        }

        function zoomTilAktiveSpor() {
            const aktiveBounds = L.latLngBounds();
            lagredeSpor.forEach(item => {
                if (map.hasLayer(item.layer)) {
                    aktiveBounds.extend(item.layer.getBounds());
                }
            });
            if (aktiveBounds.isValid()) {
                map.fitBounds(aktiveBounds, { padding: isTouchDevice ? [40, 100] : [40, 40] });
            }
        }

        function sjekkFremdrift() {
            if (isFinishedLoading) return;
            loadedCount++;
            
            const statusText = document.getElementById('loading-text');
            if (statusText) {
                statusText.textContent = `Laster inn spor... ${loadedCount}/${totalFiles}`;
            }

            if (loadedCount >= totalFiles) {
                isFinishedLoading = true;
                zoomTilAktiveSpor();

                const statusEl = document.getElementById('loading-status');
                if (statusEl) {
                    const visningstid = feilede.length ? 6000 : 0;
                    if (feilede.length) {
                        document.getElementById('loading-text').textContent =
                            `${feilede.length} spor kunne ikke lastes (se konsollen for filnavn)`;
                        console.warn('Spor som feilet:', feilede);
                    }
                    setTimeout(() => {
                        statusEl.style.opacity = '0';
                        setTimeout(() => { if (statusEl) statusEl.remove(); }, 500);
                    }, visningstid);
                }
            }
        }

        const GPX_TIMEOUT_MS = 20000;
        const feilede = [];

        function leggTilInteraksjon(layer, topp) {
            const typeTekst = topp.type === "vinter" ? "Vintertopp" : "Sommertopp";
            const ikon = topp.type === "vinter" ? "❄" : "☀️";
            const url = eierUrl(topp.eiere[0]);

            const tooltipHtml = topp.eiere.map(e => `<b>${eierTittel(e)}</b>`).join('<br>');
            const popupHtml = topp.eiere.map(e => `
                    <b style="font-size:14px; color:#fff;">${eierTittel(e)}</b><br>
                    <a href="${eierUrl(e)}" class="popup-link-btn">Se detaljer ➔</a>`).join('<br>');

            if (!isTouchDevice) {
                layer.bindTooltip(`
                    ${tooltipHtml}<br>
                    <span style="font-size:11px; color:#aaa; font-weight:normal;">${ikon} ${typeTekst}</span>
                `, {
                    sticky: true,
                    className: 'track-tooltip',
                    direction: 'top',
                    offset: [0, -10]
                });

                layer.on('mouseover', function() {
                    layer.setStyle({ color: 'var(--highlight-orange)', weight: 4.0, opacity: 1.0 });
                    layer.bringToFront();
                });

                layer.on('mouseout', function() {
                    layer.setStyle({ color: '#ffffff', weight: 1.4, opacity: 0.4 });
                    layer.closeTooltip();
                });

                layer.on('click', function() {
                    window.location.href = url;
                });
            } else {
                layer.bindPopup(`
                    ${popupHtml}<br>
                    <span style="font-size:11px; color:#aaa;">${ikon} ${typeTekst}</span>
                `, { closeButton: false, offset: [0, -5], className: 'mountain-popup' });

                layer.on('popupopen', function() {
                    layer.setStyle({ color: 'var(--highlight-orange)', opacity: 1.0, weight: 3.0 });
                });
                layer.on('popupclose', function() {
                    layer.setStyle({ color: '#ffffff', opacity: 0.4, weight: 1.4 });
                });
            }
        }

        function lastEnkeltopp(topp) {
            return new Promise((resolve) => {
                let fullført = false;
                const controller = new AbortController();

                const ferdig = (feil) => {
                    if (fullført) return;
                    fullført = true;
                    clearTimeout(timer);
                    if (feil) {
                        feilede.push(topp.fil);
                        console.warn(`GPX-spor hoppet over: gpx/${topp.fil} – ${feil}`);
                    }
                    sjekkFremdrift();
                    resolve();
                };

                const timer = setTimeout(() => {
                    controller.abort();
                    ferdig('tidsavbrudd');
                }, GPX_TIMEOUT_MS);

                (async () => {
                    try {
                        const res = await fetch('gpx/' + topp.fil, { signal: controller.signal });
                        if (!res.ok) { ferdig(`HTTP ${res.status}`); return; }

                        const tekst = (await res.text()).replace(/^\uFEFF/, '').trim();
                        if (!tekst.startsWith('<')) { ferdig('ikke gyldig XML/GPX'); return; }

                        const track = new L.GPX(tekst, gpxOptions);

                        track.on('loaded', function(e) {
                            try {
                                const layer = e.target;
                                lagredeSpor.push({ layer: layer, type: topp.type });

                                const gpxBounds = layer.getBounds();
                                if (gpxBounds.isValid()) bounds.extend(gpxBounds);

                                leggTilInteraksjon(layer, topp);
                                ferdig();
                            } catch (err) {
                                ferdig('feil ved oppsett: ' + err.message);
                            }
                        });

                        track.on('error', function(e) {
                            ferdig('GPX-parsing feilet' + (e && e.err ? ': ' + e.err : ''));
                        });

                        track.addTo(map);
                    } catch (err) {
                        ferdig(err.name === 'AbortError' ? 'tidsavbrudd' : err.message);
                    }
                })();
            });
        }

        async function initialiserKart() {
            const [vinterTopper, sommerTopper] = await Promise.all([
                hentTopper('vinter_topper.json', 'vinter'),
                hentTopper('sommer_topper.json', 'sommer')
            ]);

            const alleTopper = byggSporliste([...vinterTopper, ...sommerTopper]);

            totalFiles = alleTopper.length;

            if (totalFiles === 0) {
                const statusEl = document.getElementById('loading-status');
                if (statusEl) statusEl.innerHTML = "Ingen spor funnet.";
                return;
            }

            document.getElementById('loading-text').textContent = `Laster inn spor... 0/${totalFiles}`;

            const samtidige = isTouchDevice ? 4 : 10;
            let neste = 0;
            const arbeider = async () => {
                while (neste < alleTopper.length) {
                    const spor = alleTopper[neste++];
                    await lastEnkeltopp(spor);
                }
            };
            await Promise.all(Array.from({ length: Math.min(samtidige, alleTopper.length) }, arbeider));
        }

        initialiserKart();

        // FILTRERING
        const btnVinter = document.getElementById('btn-vinter');
        const btnSommer = document.getElementById('btn-sommer');

        function filtrerTurer(valgtType) {
            btnVinter.classList.remove('active');
            btnSommer.classList.remove('active');

            if (valgtType === 'vinter') btnVinter.classList.add('active');
            if (valgtType === 'sommer') btnSommer.classList.add('active');

            lagredeSpor.forEach(item => {
                if (item.type === valgtType) {
                    if (!map.hasLayer(item.layer)) map.addLayer(item.layer);
                } else {
                    if (map.hasLayer(item.layer)) map.removeLayer(item.layer);
                }
            });
            zoomTilAktiveSpor();
        }

        btnVinter.addEventListener('click', () => filtrerTurer('vinter'));
        btnSommer.addEventListener('click', () => filtrerTurer('sommer'));

        document.getElementById('btn-reset').addEventListener('click', function() {
            btnVinter.classList.remove('active');
            btnSommer.classList.remove('active');

            lagredeSpor.forEach(item => {
                if (!map.hasLayer(item.layer)) map.addLayer(item.layer);
                item.layer.setStyle({ color: '#ffffff', weight: 1.4, opacity: 0.4 });
            });

            if (bounds.isValid()) {
                map.fitBounds(bounds, { padding: isTouchDevice ? [40, 100] : [40, 40] });
            }
        });

        /* ==========================================================================
           FELLES FUNKSJON FOR CANVAS POSISJON
           ========================================================================== */
        function updateCanvasPosition(c, ctx, active) {
            if (!active) return;
            const b = map.getBounds(), size = map.getSize(), tl = map.latLngToLayerPoint(b.getNorthWest());
            c.style.left = tl.x + 'px'; 
            c.style.top = tl.y + 'px';
            c.width = size.x; 
            c.height = size.y;
        }

        /* ==========================================================================
           BUSSRADAR FUNKSJONALITET (ENTUR VEHICLE API / GRAPHQL)
           ========================================================================== */
        const btnBuss = document.getElementById('btn-buss');
        const busPanel = document.getElementById('bus-panel');
        const busCounterEl = document.getElementById('bus-counter');

        let busesActive = false;
        let buses = {};
        let busInterval = null;

        const busCanvas = L.DomUtil.create('canvas', 'leaflet-zoom-animated overlay-canvas');
        map.getPanes().overlayPane.appendChild(busCanvas);
        const busCtx = busCanvas.getContext('2d');
        busCanvas.style.display = 'none';

        const VEHICLE_API = 'https://api.entur.io/realtime/v2/vehicles/graphql';

        function erITromso(lat, lon) {
            return lat >= 69.55 && lat <= 69.78 && lon >= 18.80 && lon <= 19.25;
        }

        const vehicleQuery = `
            {
                vehicles {
                    vehicleId
                    delay
                    line {
                        publicCode
                        lineName
                    }
                    location {
                        latitude
                        longitude
                    }
                }
            }
        `;

        async function fetchBuses() {
            if (!busesActive) return;

            try {
                const response = await fetch(VEHICLE_API, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'ET-Client-Name': 'tromso-busskart-realtime'
                    },
                    body: JSON.stringify({ query: vehicleQuery })
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const json = await response.json();
                const vehicles = json.data?.vehicles || [];
                
                let count = 0;
                const activeIds = new Set();

                vehicles.forEach(bus => {
                    if (!bus.location || !bus.location.latitude || !bus.location.longitude) return;

                    const lat = bus.location.latitude;
                    const lon = bus.location.longitude;

                    if (erITromso(lat, lon)) {
                        const lineCode = bus.line?.publicCode || 'Buss';
                        const lineName = bus.line?.lineName || 'Troms Fylkestrafikk';
                        const vehicleId = bus.vehicleId || `${lineCode}-${lat}-${lon}`;
                        const delayMin = bus.delay ? Math.round(bus.delay / 60) : 0;

                        activeIds.add(vehicleId);

                        if (!buses[vehicleId]) buses[vehicleId] = {};

                        buses[vehicleId].lat = lat;
                        buses[vehicleId].lon = lon;
                        buses[vehicleId].line = lineCode;
                        buses[vehicleId].name = lineName;
                        buses[vehicleId].delay = delayMin;

                        count++;
                    }
                });

                for (let id in buses) {
                    if (!activeIds.has(id)) {
                        delete buses[id];
                    }
                }

                busCounterEl.innerText = "Busser synlige: " + count;
            } catch(e) {
                console.error("Feil ved henting av bussdata:", e);
                busCounterEl.innerText = "Tilkoblingsfeil buss";
            }
        }

        function drawBuses() {
            if (!busesActive) return;
            busCtx.clearRect(0, 0, busCanvas.width, busCanvas.height);
            const tl = map.latLngToLayerPoint(map.getBounds().getNorthWest());
            
            const showLine = document.getElementById('busLineSwitch').checked;
            const showDest = document.getElementById('busDestSwitch').checked;
            const showDelay = document.getElementById('busDelaySwitch').checked;

            for (let id in buses) {
                const b = buses[id];
                const p = map.latLngToLayerPoint([b.lat, b.lon]);
                
                busCtx.fillStyle = "#ef4444";
                busCtx.beginPath(); 
                busCtx.arc(p.x - tl.x, p.y - tl.y, 4, 0, Math.PI * 2); 
                busCtx.fill();
                
                busCtx.strokeStyle = "rgba(239, 68, 68, 0.4)";
                busCtx.lineWidth = 2;
                busCtx.stroke();

                let labels = [];
                if (showLine) labels.push(b.line);
                if (showDest && b.name) labels.push(b.name);
                if (showDelay && b.delay !== 0) {
                    const delayTxt = b.delay > 0 ? `+${b.delay}m` : `${b.delay}m`;
                    labels.push(delayTxt);
                }

                if (labels.length > 0) {
                    busCtx.font = "11px -apple-system, sans-serif";
                    busCtx.fillStyle = "#fca5a5";
                    busCtx.fillText(labels.join(" | "), p.x - tl.x + 9, p.y - tl.y + 4);
                }
            }
            requestAnimationFrame(drawBuses);
        }

        map.on('click', function(e) {
            const clickPoint = map.latLngToContainerPoint(e.latlng);
            const tl = map.latLngToLayerPoint(map.getBounds().getNorthWest());

            if (busesActive) {
                let clickedBus = null;
                let minDist = 20;

                for (let id in buses) {
                    const b = buses[id];
                    const p = map.latLngToLayerPoint([b.lat, b.lon]);
                    const screenX = p.x - tl.x;
                    const screenY = p.y - tl.y;

                    const dist = Math.hypot(clickPoint.x - screenX, clickPoint.y - screenY);
                    if (dist < minDist) {
                        minDist = dist;
                        clickedBus = b;
                    }
                }

                if (clickedBus) {
                    const delayText = clickedBus.delay !== 0 ? 
                        `<br>Forsinkelse: <span style="color:${clickedBus.delay > 0 ? '#ef4444' : '#34a853'}">${clickedBus.delay > 0 ? '+' + clickedBus.delay : clickedBus.delay} min</span>` : 
                        `<br>Forsinkelse: I rute`;

                    L.popup({ offset: [0, -5], className: 'bus-popup' })
                        .setLatLng([clickedBus.lat, clickedBus.lon])
                        .setContent(`
                            <b style="font-size:14px; color:#fff;">Linje ${clickedBus.line}</b><br>
                            <span style="font-size:12px; color:#aaa;">${clickedBus.name || 'Troms Fylkestrafikk'}</span>
                            ${delayText}
                        `)
                        .openOn(map);
                    return;
                }
            }
        });

        function toggleBussVisning() {
            busesActive = !busesActive;

            if (busesActive) {
                btnBuss.classList.add('active');
                busPanel.classList.add('active');
                busCounterEl.classList.add('active');
                busCounterEl.innerText = "Busser: Laster...";
                busCanvas.style.display = 'block';

                updateCanvasPosition(busCanvas, busCtx, busesActive);
                fetchBuses();
                busInterval = setInterval(fetchBuses, 5000);
                drawBuses();

                map.on('move zoom', handleBusMove);
            } else {
                btnBuss.classList.remove('active');
                busPanel.classList.remove('active');
                busCounterEl.classList.remove('active');
                busCanvas.style.display = 'none';

                if (busInterval) clearInterval(busInterval);
                busCtx.clearRect(0, 0, busCanvas.width, busCanvas.height);
                buses = {};

                map.off('move zoom', handleBusMove);
            }

            map.setView([69.6492, 18.9553], 13);
        }

        function handleBusMove() {
            updateCanvasPosition(busCanvas, busCtx, busesActive);
        }

        btnBuss.addEventListener('click', toggleBussVisning);
    </script>
</body>
</html>
