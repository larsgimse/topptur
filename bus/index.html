<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>Live Buss Tromsø - GTFS-RT</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.rawgit.com/dcodeIO/protobuf.js/6.11.3/dist/protobuf.min.js"></script>
    <style>
        body { margin: 0; background: #000; }
        #map { height: 100vh; width: 100%; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map', { zoomControl: false }).setView([69.65, 18.95], 13);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

        let markers = {};

        async function fetchRealtimeBuses() {
            try {
                // 1. Hent binærdata
                const response = await fetch('https://api.entur.io/realtime/v1/gtfs/rt/vehicle-positions', {
                    headers: { 'ET-Client-Name': 'lars-tromso' }
                });
                const buffer = await response.arrayBuffer();

                // 2. Dekod binærdata ved bruk av Protobuf (bruker offentlig definisjon)
                const root = await protobuf.load("https://raw.githubusercontent.com/google/transit/master/gtfs-realtime/proto/gtfs-realtime.proto");
                const FeedMessage = root.lookupType("transit_realtime.FeedMessage");
                const message = FeedMessage.decode(new Uint8Array(buffer));
                const feed = FeedMessage.toObject(message, { longs: String, enums: String, bytes: String });

                // 3. Oppdater kart
                let activeIds = [];
                feed.entity.forEach(e => {
                    if (e.vehicle && e.vehicle.position) {
                        const id = e.vehicle.vehicle.id;
                        const lat = e.vehicle.position.latitude;
                        const lon = e.vehicle.position.longitude;
                        activeIds.push(id);

                        if (markers[id]) {
                            markers[id].setLatLng([lat, lon]);
                        } else {
                            markers[id] = L.circleMarker([lat, lon], {radius: 4, color: 'white', fillOpacity: 1}).addTo(map);
                        }
                    }
                });
            } catch (err) { console.error("Feil ved henting av GTFS-RT:", err); }
        }

        setInterval(fetchRealtimeBuses, 10000);
        fetchRealtimeBuses();
    </script>
</body>
</html>
