<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>Live Buss Tromsø</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; background: #000; }
        #map { height: 100vh; width: 100%; background: #000; }
    </style>
</head>
<body>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map', { zoomControl: false }).setView([69.65, 18.95], 13);
        
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

        let markers = {}; 

        async function fetchBuses() {
            // Vi bruker "TROM:Operator" som ID for Troms fylkestrafikk
            const query = `
            {
              vehiclePositions(filters: {operatorIds: ["TROM:Operator"]}) {
                vehicle { id }
                position { latitude longitude }
              }
            }`;

            try {
                const response = await fetch('https://api.entur.io/realtime/v1/gtfs/rt/vehicle-positions', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'ET-Client-Name': 'lars-tromso' 
                    },
                    body: JSON.stringify({ query })
                });

                const result = await response.json();
                
                if (!result.data || !result.data.vehiclePositions) {
                    console.error("Ingen data returnert fra API-et:", result);
                    return;
                }

                const buses = result.data.vehiclePositions;
                let activeIds = [];

                buses.forEach(v => {
                    const id = v.vehicle.id;
                    const pos = v.position;
                    if (!pos) return;
                    
                    activeIds.push(id);

                    if (markers[id]) {
                        markers[id].setLatLng([pos.latitude, pos.longitude]);
                    } else {
                        markers[id] = L.circleMarker([pos.latitude, pos.longitude], {
                            radius: 4,
                            color: 'white',
                            fillColor: 'white',
                            fillOpacity: 1
                        }).addTo(map);
                    }
                });

                Object.keys(markers).forEach(id => {
                    if (!activeIds.includes(id)) {
                        map.removeLayer(markers[id]);
                        delete markers[id];
                    }
                });
            } catch (error) {
                console.error("Feil ved henting:", error);
            }
        }
        
        fetchBuses();
        setInterval(fetchBuses, 5000);
    </script>
</body>
</html>
