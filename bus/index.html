<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>Live Buss Tromsø</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; background: #000; }
        #map { height: 100vh; width: 100%; background: #000; }
    </style>
</head>
<body>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialiser kart sentrert på Tromsøya
        const map = L.map('map', { zoomControl: false }).setView([69.65, 18.95], 13);
        
        // Legg til mørkt kartlag
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap & CARTO'
        }).addTo(map);

        // Objekt for å holde styr på markører
        let markers = {}; 

        async function fetchBuses() {
            const query = `
            {
              vehiclePositions(filters: {operatorIds: ["TROM"]}) {
                vehicle { id }
                position { latitude longitude }
              }
            }`;

            try {
                const response = await fetch('https://api.entur.io/realtime/v1/gtfs/rt/vehicle-positions', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'ET-Client-Name': 'lars-tromso' 
                    },
                    body: JSON.stringify({ query })
                });

                const result = await response.json();
                const buses = result.data.vehiclePositions;
                
                // Lag en liste over alle ID-er vi fikk i siste oppdatering
                let activeIds = [];

                buses.forEach(v => {
                    const id = v.vehicle.id;
                    const lat = v.position.latitude;
                    const lng = v.position.longitude;
                    activeIds.push(id);

                    if (markers[id]) {
                        // Oppdater eksisterende posisjon
                        markers[id].setLatLng([lat, lng]);
                    } else {
                        // Lag ny markør
                        markers[id] = L.circleMarker([lat, lng], {
                            radius: 4,
                            color: 'white',
                            fillColor: 'white',
                            fillOpacity: 1
                        }).addTo(map);
                    }
                });

                // Fjern busser som ikke lenger finnes i dataene
                Object.keys(markers).forEach(id => {
                    if (!activeIds.includes(id)) {
                        map.removeLayer(markers[id]);
                        delete markers[id];
                    }
                });

            } catch (error) {
                console.error("Kunne ikke hente bussdata:", error);
            }
        }
        
        // Hent data hvert 5. sekund
        fetchBuses();
        setInterval(fetchBuses, 5000);
    </script>
</body>
</html>
