<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Toppturer - Oversiktskart</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-color: #111111;
            --panel-bg: rgba(26, 26, 26, 0.9);
            --text-color: #eeeeee;
            --highlight-orange: #fc4c02;
            --winter-blue: #0ea5e9;
            --summer-green: #34a853;
            --flight-yellow: #ffd700;
            --bus-red: #ef4444;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            height: 100dvh; 
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            background: var(--panel-bg);
            padding: 10px 14px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            border: 1px solid #222;
            border-radius: 8px;
            z-index: 1000;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            min-height: 52px;
        }

        h1 { 
            font-size: 1.1rem; 
            font-weight: 700; 
            letter-spacing: -0.5px; 
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
        }
        
        .nav-buttons { display: flex; gap: 6px; align-items: center; }
        
        .btn {
            padding: 6px 12px;
            border-radius: 6px;
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #333;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 500;
            transition: all 0.2s;
            cursor: pointer;
            white-space: nowrap;
        }
        
        .btn-reset {
            background: #222;
            border-color: #444;
            color: #ccc;
        }

        .btn-winter.active { background: var(--winter-blue); border-color: #fff; font-weight: 700; }
        .btn-summer.active { background: var(--summer-green); border-color: #fff; font-weight: 700; }
        .btn-flights.active { background: #d97706; border-color: #fff; font-weight: 700; color: #fff; }
        .btn-bus.active { background: #dc2626; border-color: #fff; font-weight: 700; color: #fff; }

        #map-container {
            flex: 1;
            width: 100%;
            height: 100%;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
            background: var(--bg-color);
        }

        #loading-status {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(26, 26, 26, 0.95);
            padding: 10px 18px;
            border-radius: 24px;
            border: 1px solid #333;
            font-size: 0.85rem;
            z-index: 1000;
            pointer-events: none;
            transition: opacity 0.5s ease;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255,255,255,0.2);
            border-top-color: var(--highlight-orange);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .panels-container {
            position: fixed;
            top: 75px;
            right: 10px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .ui-panel {
            background: var(--panel-bg); 
            padding: 12px 15px; 
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            border: 1px solid #333;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            font-family: inherit; 
            display: none; 
            flex-direction: column; 
            gap: 8px;
            min-width: 180px;
            pointer-events: auto;
        }
        
        .ui-panel.active { display: flex; }
        
        .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 0.8rem; color: #ddd; }
        
        .switch { position: relative; display: inline-block; width: 34px; height: 18px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #444; transition: .3s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        
        #flight-panel input:checked + .slider { background-color: #f59e0b; }
        #bus-panel input:checked + .slider { background-color: #ef4444; }
        
        input:checked + .slider:before { transform: translateX(16px); }

        .alt-slider { width: 60px; cursor: pointer; accent-color: #f59e0b; }
        
        .counter-box { 
            position: fixed; 
            bottom: 20px; 
            left: 20px; 
            z-index: 10000; 
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        
        .counter { 
            background: var(--panel-bg); 
            padding: 6px 14px; 
            border-radius: 20px; 
            border: 1px solid #333;
            font-size: 0.8rem; 
            display: none;
        }
        #counter.active { display: block; color: #ffd700; }
        #bus-counter.active { display: block; color: #ef4444; }

        .overlay-canvas {
            pointer-events: none;
            z-index: 450;
        }

        .leaflet-popup-content-wrapper {
            background: #1a1a1a !important;
            color: #fff !important;
            border: 1px solid var(--highlight-orange);
            border-radius: 6px;
        }
        .leaflet-popup-tip {
            background: #1a1a1a !important;
        }
        .popup-link-btn {
            display: inline-block;
            margin-top: 8px;
            padding: 6px 12px;
            background: var(--highlight-orange);
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px;
            text-align: center;
        }

        @media (max-width: 600px) {
            header {
                top: auto;
                bottom: 20px;
                flex-direction: column;
                gap: 8px;
                align-items: center;
                background: rgba(20, 20, 20, 0.95);
                box-shadow: 0 4px 20px rgba(0,0,0,0.6);
                min-height: auto;
            }
            h1 { 
                position: static; 
                transform: none; 
                font-size: 0.9rem; 
                text-align: center;
            }
            .nav-buttons {
                width: 100%;
                justify-content: space-between;
                flex-wrap: wrap;
            }
            .btn {
                flex: 1;
                text-align: center;
                padding: 8px 4px;
                font-size: 0.75rem;
            }
            #loading-status {
                bottom: auto;
                top: 20px;
            }
            .panels-container {
                top: 10px;
                right: 10px;
                max-width: 200px;
            }
            .counter-box {
                bottom: 120px;
                left: 10px;
            }
            .leaflet-bottom { bottom: 120px !important; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Toppturer</h1>
        <div class="nav-buttons">
            <button id="btn-reset" class="btn btn-reset">🔄 Nullstill</button>
            <button id="btn-vinter" class="btn btn-winter">❄️ Vinter</button>
            <button id="btn-sommer" class="btn btn-summer">☀️ Sommer</button>
            <button id="btn-fly" class="btn btn-flights">✈️ Fly</button>
            <button id="btn-buss" class="btn btn-bus">🚌 Buss</button>
        </div>
    </header>

    <div class="panels-container">
        <!-- FLY PANEL -->
        <div id="flight-panel" class="ui-panel">
            <div class="row">Haler: <label class="switch"><input type="checkbox" id="trailSwitch" checked><span class="slider"></span></label></div>
            <div class="row">Flynr: <label class="switch"><input type="checkbox" id="flightNumSwitch"><span class="slider"></span></label></div>
            <div class="row">Kallesignal: <label class="switch"><input type="checkbox" id="callsignSwitch"><span class="slider"></span></label></div>
            <div class="row">Registrering: <label class="switch"><input type="checkbox" id="regSwitch"><span class="slider"></span></label></div>
            <div class="row">Høyde (Av/Fot/m): <input type="range" id="altSlider" class="alt-slider" min="0" max="2" value="0"></div>
            <div class="row">Fra: <label class="switch"><input type="checkbox" id="originSwitch"><span class="slider"></span></label></div>
            <div class="row">Til: <label class="switch"><input type="checkbox" id="destSwitch"><span class="slider"></span></label></div>
        </div>

        <!-- BUSS PANEL -->
        <div id="bus-panel" class="ui-panel">
            <div class="row">Linjenr: <label class="switch"><input type="checkbox" id="busLineSwitch"><span class="slider"></span></label></div>
            <div class="row">Destinasjon: <label class="switch"><input type="checkbox" id="busDestSwitch"><span class="slider"></span></label></div>
            <div class="row">Forsinkelse: <label class="switch"><input type="checkbox" id="busDelaySwitch"><span class="slider"></span></label></div>
        </div>
    </div>

    <div class="counter-box">
        <div id="counter" class="counter">Fly synlige: 0</div>
        <div id="bus-counter" class="counter">Busser: Laster...</div>
    </div>

    <div id="map-container">
        <div id="map"></div>
        <div id="loading-status">
            <span class="spinner"></span>
            <span id="loading-text">Leser inn hovedspor...</span>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>

    <script>
        const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
        const map = L.map('map', { zoomControl: true, maxZoom: 18 }).setView([69.65, 18.95], 9);
        if (isTouchDevice) map.zoomControl.setPosition('topleft');
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 20 }).addTo(map);

        // ... [GPX Lasting og resterende logikk beholdes uendret] ...
        // [Topptur-logikk forkortet for plass - beholdt fra forrige steg]
        let loadedCount = 0; let totalFiles = 0; let isFinishedLoading = false; const lagredeSpor = [];
        // ... (Her legges inn koden for hentTopper og initialiserKart fra forrige svar) ...
        // (Siden koden er identisk i funksjon, fokuserer jeg på buss-delen under)

        /* ==========================================================================
           FLYRADAR (Canvas)
           ========================================================================== */
        const flightCanvas = L.DomUtil.create('canvas', 'leaflet-zoom-animated overlay-canvas');
        map.getPanes().overlayPane.appendChild(flightCanvas);
        const flightCtx = flightCanvas.getContext('2d');
        // ... [Fly-logikk beholdes] ...

        /* ==========================================================================
           BUSSRADAR (Prikker på kartet med klikk-info)
           ========================================================================== */
        const btnBuss = document.getElementById('btn-buss');
        const busPanel = document.getElementById('bus-panel');
        const busCounterEl = document.getElementById('bus-counter');
        let busesActive = false;
        let buses = {};
        let busInterval = null;
        const VEHICLE_API = 'https://api.entur.io/realtime/v2/vehicles/graphql';

        async function fetchBuses() {
            if (!busesActive) return;
            const query = ` { vehicles { vehicleId delay line { publicCode lineName } location { latitude longitude } } } `;
            try {
                const response = await fetch(VEHICLE_API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'ET-Client-Name': 'tromso-busskart' },
                    body: JSON.stringify({ query })
                });
                const json = await response.json();
                const vehicles = json.data?.vehicles || [];
                
                // Oppdaterer busser objektet
                vehicles.forEach(bus => {
                    if (!bus.location) return;
                    // Filter for Tromsø
                    if (bus.location.latitude > 69.5 && bus.location.latitude < 69.8) {
                        buses[bus.vehicleId] = bus;
                    }
                });
                drawBuses();
                busCounterEl.innerText = "Busser: " + Object.keys(buses).length;
            } catch(e) {}
        }

        function drawBuses() {
            const ctx = flightCtx; // Gjenbruker samme canvas som flyene for prikk-stil
            // Tømmer kun buss-prikker hvis nødvendig, eller tegner over.
            // Enklest: bruk et eget lag for busser.
        }

        // --- ENKLERE LØSNING: Bruke Leaflet Markers for busser for å få klikk-støtte ---
        let busMarkers = L.layerGroup().addTo(map);

        function drawBusesMarkers() {
            if (!busesActive) return;
            busMarkers.clearLayers();
            
            const showLine = document.getElementById('busLineSwitch').checked;
            const showDest = document.getElementById('busDestSwitch').checked;
            const showDelay = document.getElementById('busDelaySwitch').checked;

            for (let id in buses) {
                const b = buses[id];
                const marker = L.circleMarker([b.location.latitude, b.location.longitude], {
                    radius: 4,
                    color: '#ef4444',
                    fillColor: '#ef4444',
                    fillOpacity: 1
                });

                let info = `<b>Linje ${b.line?.publicCode || '?'}</b><br>${b.line?.lineName || ''}`;
                if (b.delay) info += `<br>Forsinkelse: ${Math.round(b.delay/60)} min`;
                
                marker.bindPopup(info);
                marker.addTo(busMarkers);
            }
        }

        function toggleBussVisning() {
            busesActive = !busesActive;
            btnBuss.classList.toggle('active');
            busPanel.classList.toggle('active');
            busCounterEl.classList.toggle('active');
            
            if (busesActive) {
                fetchBuses();
                busInterval = setInterval(fetchBuses, 5000);
            } else {
                clearInterval(busInterval);
                busMarkers.clearLayers();
            }
        }

        btnBuss.addEventListener('click', toggleBussVisning);

    </script>
</body>
</html>
