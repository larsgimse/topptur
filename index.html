<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toppturer og Fjellturer</title>
    <style>
        :root {
            --winter-blue: #0ea5e9;
            --winter-dark: #0369a1;
            --summer-green: #22c55e;
            --summer-dark: #15803d;
            --bg-color: #f1f5f9;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center; 
            gap: 25px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            margin-top: 5vh; 
            padding-bottom: 50px;
        }

        h1 {
            color: #1e293b;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .btn {
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            padding: 0; 
            
            width: 180px; 
            height: 180px;
            
            font-size: 18px;
            font-weight: 700;
            text-decoration: none;
            color: white;
            border-radius: 15px;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease, border-bottom-width 0.1s ease; 
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            border: none;
            box-sizing: border-box; 
        }

        .btn span.emoji {
            font-size: 40px; 
            margin-top: 10px;
        }

        /* Container for det genererte SVG-omrisset */
        .btn .map-container {
            width: 70px;
            height: 70px;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn svg {
            width: 100%;
            height: 100%;
        }

        .btn svg path {
            fill: none;
            stroke: white; /* Hvitt omriss på øya */
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .btn:hover {
            transform: scale(1.08);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        .btn:active {
            transform: scale(0.98); 
            border-bottom-width: 0;  
            margin-top: 4px;         
        }

        .btn:focus {
            outline: 3px solid #94a3b8;
            outline-offset: 4px;
        }

        .btn-winter {
            background: linear-gradient(135deg, var(--winter-blue), var(--winter-dark));
            border-bottom: 4px solid #075985;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        .btn-summer {
            background: linear-gradient(135deg, var(--summer-green), var(--summer-dark));
            border-bottom: 4px solid #166534;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        /* NY STIL: Svart knapp med hvit 3D-kant nederst */
        .btn-map {
            background: linear-gradient(135deg, #1e293b, #0f172a); /* Mørkegrå / Svart */
            border-bottom: 4px solid #334155; /* Litt lysere kant i bunnen for 3D-effekt */
            text-shadow: 0 1px 2px rgba(0,0,0,0.4);
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 24px;
            }
            .btn {
                width: 150px;
                height: 150px;
                font-size: 16px;
            }
            .btn span.emoji {
                font-size: 32px;
            }
            .btn .map-container {
                width: 55px;
                height: 55px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Velg visning</h1>
        
        <a href="vinter.html" class="btn btn-winter">
            <span>Toppturer vinter</span>
            <span class="emoji">⛷️</span>
        </a>

        <a href="sommer.html" class="btn btn-summer">
            <span>Fjellturer sommer</span>
            <span class="emoji">⛰️</span>
        </a>

        <a href="oversikt.html" class="btn btn-map">
            <span>Omriss Tromsøya</span>
            <div class="map-container" id="tromso-map">
                </div>
        </a>
    </div>

    <script>
        // En enkel, innebygd versjon av Tromsøyas omriss (koordinater) 
        // Dette sikrer at kartet vises selv om nettleseren din blokkerer lokal .geojson-fil.
        const backupGeoJSON = {
            "type": "Feature",
            "geometry": {
                "type": "Polygon",
                "coordinates": [[
                    [18.91, 69.69], [18.94, 69.71], [18.98, 69.70], [19.03, 69.67], 
                    [19.02, 69.64], [18.97, 69.62], [18.92, 69.62], [18.89, 69.64], 
                    [18.88, 69.67], [18.91, 69.69]
                ]]
            }
        };

        function drawMap(geojson) {
            let coords = geojson.geometry ? geojson.geometry.coordinates : geojson.coordinates;
            let allPoints = Array.isArray(coords[0][0]) ? coords[0] : coords;

            const lons = allPoints.map(p => p[0]);
            const lats = allPoints.map(p => p[1]);
            const minLon = Math.min(...lons);
            const maxLon = Math.max(...lons);
            const minLat = Math.min(...lats);
            const maxLat = Math.max(...lats);

            const width = maxLon - minLon;
            const height = maxLat - minLat;

            const viewBoxWidth = 100;
            const viewBoxHeight = 100;

            function toSvgX(lon) { return ((lon - minLon) / width) * viewBoxWidth; }
            function toSvgY(lat) { return (1 - (lat - minLat) / height) * viewBoxHeight; }

            let pathData = "";
            allPoints.forEach((p, index) => {
                pathData += (index === 0 ? "M" : "L") + ` ${toSvgX(p[0])} ${toSvgY(p[1])} `;
            });
            pathData += "Z";

            document.getElementById('tromso-map').innerHTML = `
                <svg viewBox="0 0 ${viewBoxWidth} ${viewBoxHeight}">
                    <path d="${pathData}" />
                </svg>
            `;
        }

        // Prøv først å hente den ekte filen
        fetch('tromsoya.geojson')
            .then(response => response.json())
            .then(data => {
                // Hvis filen ble lastet suksessfullt, bruk dataene i den:
                let feature = data.type === "FeatureCollection" ? data.features[0] : data;
                drawMap(feature);
            })
            .catch(error => {
                console.log("Kjører lokalt eller fant ikke filen. Bruker innebygd omriss-data.");
                // Tegner opp backup-kartet umiddelbart i stedet for et emoji-ikon
                drawMap(backupGeoJSON);
            });
    </script>
</body>
</html>
