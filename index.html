<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toppturer og Fjellturer</title>
    <style>
        :root {
            --winter-blue: #0ea5e9;
            --winter-dark: #0369a1;
            --summer-green: #22c55e;
            --summer-dark: #15803d;
            --map-orange: #f97316;
            --map-dark: #c2410c;
            --bg-color: #f1f5f9;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center; 
            gap: 25px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            margin-top: 5vh; 
            padding-bottom: 50px;
        }

        h1 {
            color: #1e293b;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .btn {
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            padding: 0; 
            
            width: 180px; 
            height: 180px;
            
            font-size: 18px;
            font-weight: 700;
            text-decoration: none;
            color: white;
            border-radius: 15px;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease, border-bottom-width 0.1s ease; 
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            border: none;
            box-sizing: border-box; 
        }

        .btn span.emoji {
            font-size: 40px; 
            margin-top: 10px;
        }

        /* Container for det genererte SVG-omrisset */
        .btn .map-container {
            width: 60px;
            height: 60px;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn svg {
            width: 100%;
            height: 100%;
        }

        .btn svg path {
            fill: none;
            stroke: white;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .btn:hover {
            transform: scale(1.08);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        .btn:active {
            transform: scale(0.98); 
            border-bottom-width: 0;  
            margin-top: 4px;         
        }

        .btn:focus {
            outline: 3px solid #94a3b8;
            outline-offset: 4px;
        }

        .btn-winter {
            background: linear-gradient(135deg, var(--winter-blue), var(--winter-dark));
            border-bottom: 4px solid #075985;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        .btn-summer {
            background: linear-gradient(135deg, var(--summer-green), var(--summer-dark));
            border-bottom: 4px solid #166534;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        .btn-map {
            background: linear-gradient(135deg, var(--map-orange), var(--map-dark));
            border-bottom: 4px solid #9a3412;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 24px;
            }
            .btn {
                width: 150px;
                height: 150px;
                font-size: 16px;
            }
            .btn span.emoji, .btn .map-container {
                font-size: 32px;
                width: 50px;
                height: 50px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Velg visning</h1>
        
        <a href="vinter.html" class="btn btn-winter">
            <span>Toppturer vinter</span>
            <span class="emoji">⛷️</span>
        </a>

        <a href="sommer.html" class="btn btn-summer">
            <span>Fjellturer sommer</span>
            <span class="emoji">⛰️</span>
        </a>

        <a href="oversikt.html" class="btn btn-map">
            <span>Omriss Tromsøya</span>
            <div class="map-container" id="tromso-map">
                <span class="emoji" id="fallback-emoji">🗺️</span>
            </div>
        </a>
    </div>

    <script>
        // Henter GeoJSON-dataene og tegner omrisset som en SVG
        fetch('tromsoya.geojson')
            .then(response => response.json())
            .then(geojson => {
                // Henter ut alle koordinatene (støtter Polygon og MultiPolygon)
                let coords = [];
                if (geojson.type === "FeatureCollection") {
                    coords = geojson.features[0].geometry.coordinates;
                } else if (geojson.type === "Feature") {
                    coords = geojson.geometry.coordinates;
                } else {
                    coords = geojson.coordinates;
                }

                // Flater ut koordinatene for å finne min/maks verdier (for skalering)
                let allPoints = [];
                if (Array.isArray(coords[0][0][0])) {
                    // MultiPolygon
                    coords.forEach(poly => poly[0].forEach(p => allPoints.push(p)));
                } else {
                    // Enkelt Polygon
                    coords[0].forEach(p => allPoints.push(p)));
                }

                // Finn ytterpunktene for å regne ut bounding box (BBox)
                const lons = allPoints.map(p => p[0]);
                const lats = allPoints.map(p => p[1]);
                const minLon = Math.min(...lons);
                const maxLon = Math.max(...lons);
                const minLat = Math.min(...lats);
                const maxLat = Math.max(...lats);

                const width = maxLon - minLon;
                const height = maxLat - minLat;

                // Definerer størrelsen på SVG-vinduet (f.eks 100x100 enheter)
                const viewBoxWidth = 100;
                const viewBoxHeight = 100;

                // Funksjon for å konvertere kartkoordinater til SVG-piksler
                // Merk: Kart-Y (nord) speiles fordi SVG har 0,0 øverst til venstre
                function toSvgX(lon) { return ((lon - minLon) / width) * viewBoxWidth; }
                function toSvgY(lat) { return (1 - (lat - minLat) / height) * viewBoxHeight; }

                // Generer SVG 'path'-strengen
                let pathData = "";
                
                if (Array.isArray(coords[0][0][0])) {
                    // MultiPolygon-håndtering
                    coords.forEach(polygon => {
                        polygon[0].forEach((p, index) => {
                            pathData += (index === 0 ? "M" : "L") + ` ${toSvgX(p[0])} ${toSvgY(p[1])} `;
                        });
                        pathData += "Z ";
                    });
                } else {
                    // Enkelt Polygon-håndtering
                    coords[0].forEach((p, index) => {
                        pathData += (index === 0 ? "M" : "L") + ` ${toSvgX(p[0])} ${toSvgY(p[1])} `;
                    });
                    pathData += "Z";
                }

                // Lag det ferdige SVG-elementet
                const svgHtml = `
                    <svg viewBox="0 0 ${viewBoxWidth} ${viewBoxHeight}">
                        <path d="${pathData}" />
                    </svg>
                `;

                // Erstatt kart-emojien med det ekte omrisset
                document.getElementById('tromso-map').innerHTML = svgHtml;
            })
            .catch(error => {
                console.error("Kunne ikke laste tromsoya.geojson, bruker emoji som fallback:", error);
            });
    </script>
</body>
</html>
